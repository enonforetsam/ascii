<script>
(function () {
  'use strict';

  var canvas = document.getElementById('art');
  var ctx = canvas.getContext('2d', { alpha: false });
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- configuration tables ---------- */

  // ramps go DARK -> BRIGHT; index 0 is treated as blank (skipped at render)
  var CHARSETS = {
    standard: ' .:-=+*#%@',
    blocks:   ' .:░▒▓█',
    dots:     ' .·:•',
    binary:   ' 01',
    donut:    ' .,-~:;=!*#$@',
    // dense Paul Bourke-style 70-level grayscale ramp (dark -> bright). Leading
    // space => index 0 is blank; the long smooth gradient resolves photographic
    // tone instead of the few coarse steps a short ramp gives.
    photo:    ' .\'`^",:;Il!i><~+_-?][}{1)(|/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$'
  };

  // the solid full block — forced for every face + side cell of the 3D word
  // render so it reads as chunky blocks regardless of the active ramp.
  var BLOCK_CP = 0x2588; // '█'

  // matrix uses its own glyph set (katakana + latin + symbols), forced per cell
  var MATRIX_GLYPHS =
    'アイウエオカキクケコサシスセソ' +
    'タチツテトナニヌネノハヒフヘホ' +
    '0123456789<>=*+-/\\|:;ABCDEFGHKLMNPRSTUXYZ';

  var COLOURS = {
    phosphor: { bg:'#05080a', ink:[57,255,122],  paper:false },
    amber:    { bg:'#0a0600', ink:[255,176,38],   paper:false },
    paper:    { bg:'#e4e6e0', ink:[18,40,24],      paper:true  },
    // GRADIENT colours — vivid multi-colour. They render via the per-cell path
    // (cellCol): a cell's lum (0..1) maps through `stops` to an RGB. `grad:true`
    // flags the gradient path; `ink` is only a fallback (e.g. atlas bake colour).
    // Each draws on a near-black stage so the colours pop. The faceplate panel is
    // unaffected — it overrides the theme tokens locally to its own light metal.
    spectrum: { bg:'#05060a', ink:[120,200,255], paper:false, grad:true,
                stops:[[60,8,90],[40,60,220],[20,210,200],[120,230,40],[255,210,20],[255,70,40]] },
    fire:     { bg:'#05030a', ink:[255,150,40],  paper:false, grad:true,
                stops:[[6,2,8],[120,12,6],[210,40,6],[255,120,16],[255,210,70],[255,255,235]] },
    ice:      { bg:'#03060c', ink:[120,200,255], paper:false, grad:true,
                stops:[[2,4,12],[10,30,90],[20,90,200],[40,170,235],[150,225,250],[245,252,255]] },
    neon:     { bg:'#06030a', ink:[230,60,210],  paper:false, grad:true,
                stops:[[10,4,14],[210,30,190],[150,30,210],[40,140,235],[40,232,228],[156,247,46]] }
  };

  // STAGE BACKGROUND — a top-right toggle that OVERRIDES the theme's bg for the
  // art canvas only (the left rail stays its own creme metal). Two options:
  // black (the default CRT void) and a soft creme-white (Fluid's panel off-white).
  // Only the background flips — the ink/glyphs are unchanged.
  var BG = {
    black: { hex:'#0a0a0c', rgb:'10,10,12'   },
    creme: { hex:'#e8e8e2', rgb:'232,232,226' }
  };

  // map a luminance 0..1 through a gradient colour's stops -> packed 0xRRGGBB.
  // Stops are evenly spaced; we lerp between the two bracketing stops.
  function gradLerp(stops, v) {
    if (v < 0) v = 0; else if (v > 1) v = 1;
    var n = stops.length - 1;
    var f = v * n;
    var i = f | 0;
    if (i >= n) i = n - 1;
    var t = f - i;
    var a = stops[i], b = stops[i + 1];
    var r = (a[0] + (b[0] - a[0]) * t) | 0;
    var g = (a[1] + (b[1] - a[1]) * t) | 0;
    var bl = (a[2] + (b[2] - a[2]) * t) | 0;
    return ((r & 255) << 16) | ((g & 255) << 8) | (bl & 255);
  }
  function isGradient(c) { var C = COLOURS[c]; return !!(C && C.grad); }

  /* ---------- live state ---------- */

  var state = {
    mode:    'generative', // 'generative' | 'image' | 'words' — top-level creative mode
    engine:  'donut',
    charset: 'standard',
    colour:  'phosphor',
    bg:      'black', // STAGE background override (top-right toggle): 'black'|'creme'
    speed:   1.0,    // 0..2 multiplier
    cell:    12,     // logical px per cell
    contrast:1.0,    // 0.4..2.2 gamma-ish multiplier
    seed:    0,       // integer; feeds the seeded PRNG for reproducible variation
    invert:  false,   // image engine: invert the luminance->glyph mapping
    word:    'ASCII', // words mode: the text to render as ASCII
    wordFill:'solid', // words mode: 'solid' | '3d' | 'matrix' | 'plasma' | 'donut'
    wordPal: 'mono'   // words 3d: colour palette 'mono'|'ryb'|'rainbow'|'neon'
  };

  // WORDS 3D palettes — ordered colour BANDS distributed across the word by
  // X-position (band 0 owns the leftmost slice, etc). 'mono' is a sentinel that
  // resolves to the active theme ink at render time (back-compat single ink).
  var WORD_PALETTES = {
    mono:    null,                                  // -> theme ink (per-cell off)
    ryb:     [[226,59,59], [255,207,51], [59,123,226]],            // red/yellow/blue
    rainbow: [[233,69,69],[247,148,41],[247,224,41],[74,201,96],[51,140,228],[150,84,214]],
    neon:    [[44,232,228], [232,44,210], [156,247,46]]            // cyan/magenta/lime
  };

  // DEFAULTS — the canonical baseline. writeHash() trims any key equal to its
  // default so share links stay short and back-compatible with old #e=&c=&k=.
  var DEFAULTS = {
    engine:  'donut',
    charset: 'standard',
    colour:  'phosphor',
    speed:   100,    // hash units (percent)
    cell:    12,
    contrast:100,    // hash units (percent)
    seed:    0
  };

  // the generative engines (the only ones reachable via the ENGINE tabs); the
  // 'image' render is activated from the IMAGE section, not an engine tab.
  var GEN_ENGINES = { donut:1, matrix:1, plasma:1, life:1, fire:1, flow:1, starfield:1, tunnel:1 };
  // remember the last generative engine, so removing an image returns to it
  // (donut by default). Seeded from the boot state if it's already generative.
  var lastGenEngine = 'donut';

  /* ---------- seeded PRNG (mulberry32) — best-effort reproducibility ---------
     A small deterministic generator so the same state.seed reproduces the same
     matrix rain / engine phase. rng() yields a fresh function from the current
     seed; engines pull from it so re-seeding gives a stable, repeatable look. */
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(0);            // active seeded generator (re-made on reseed)
  function reseed() { rng = mulberry32(state.seed | 0); }

  // grid + reusable typed arrays (the character buffer — source of truth)
  var dpr = 1, cw = 12, ch = 12, cols = 0, rows = 0, gridN = 0;
  // stage geometry (the canvas rect, NOT the window) — left rail offset aware
  var rectL = 0, rectT = 0, vw = 1, vh = 1;
  var lum = null;     // Float32Array, 0..1 intensity per cell
  var glyph = null;   // Uint32Array, forced code point per cell; 0 => derive from ramp
  // per-cell colour buffer for the words-3d multi-colour render. Int32Array of
  // packed 0xRRGGBB (>=0) per non-blank cell, or -1 to mean "use the theme ink"
  // (the normal single-ink path). NON-NULL/active only while words-3d renders;
  // cleared (colActive=false) for every other engine so the fast atlas path runs.
  var cellCol = null; // Int32Array(gridN): packed RGB per cell, -1 = theme ink
  var colActive = false; // is the per-cell colour path live this frame?

  var pointer = { x: -1, y: -1, gx: -1, gy: -1, active: false };

  /* ---------- glyph atlas ---------- */
  // Pre-bake the active ramp (and matrix set when needed) into an offscreen
  // canvas at cell size, in the ink colour. We bake the glyph at full ink and
  // quantize brightness via globalAlpha steps at blit time (limits state churn).

  var atlas = document.createElement('canvas');
  var actx = atlas.getContext('2d');
  var atlasMap = {};        // codepoint -> column index in atlas
  var atlasList = [];       // ordered codepoints baked
  var atlasDirty = true;

  function rampString() { return CHARSETS[state.charset] || CHARSETS.standard; }

  function buildAtlas() {
    var ink = COLOURS[state.colour].ink;
    var inkCss = 'rgb(' + ink[0] + ',' + ink[1] + ',' + ink[2] + ')';

    // collect the glyph set we need: the ramp always, plus matrix glyphs when
    // the matrix engine is active (it forces code points).
    var set = [];
    var seen = {};
    function add(cp) {
      if (cp === 32 || seen[cp]) return; // skip space + dupes
      seen[cp] = true; set.push(cp);
    }
    var ramp = rampString();
    for (var i = 0; i < ramp.length; i++) add(ramp.charCodeAt(i));
    // matrix glyphs are forced code points — bake them when matrix is the active
    // generative engine OR when the words-mode fill is 'matrix'.
    if (state.engine === 'matrix' ||
        (state.mode === 'words' && state.wordFill === 'matrix')) {
      for (var j = 0; j < MATRIX_GLYPHS.length; j++) add(MATRIX_GLYPHS.charCodeAt(j));
    }
    // the 3D word fill forces the full block '█' for face + side cells — bake it
    // so the mono (theme-ink) path can blit it from the atlas like any glyph.
    if (state.mode === 'words' && state.wordFill === '3d') add(BLOCK_CP);

    atlasList = set;
    atlasMap = {};
    var n = set.length;

    var tileW = Math.max(1, Math.ceil(cw * dpr));
    var tileH = Math.max(1, Math.ceil(ch * dpr));
    atlas.width  = Math.max(1, tileW * n);
    atlas.height = tileH;

    actx.setTransform(1, 0, 0, 1, 0, 0);
    actx.clearRect(0, 0, atlas.width, atlas.height);
    actx.font = '700 ' + Math.round(ch * dpr * 0.96) + 'px ' +
      'ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace';
    actx.textBaseline = 'middle';
    actx.textAlign = 'center';
    actx.fillStyle = inkCss;
    for (var k = 0; k < n; k++) {
      atlasMap[set[k]] = k;
      actx.fillText(String.fromCharCode(set[k]), k * tileW + tileW / 2, tileH / 2 + tileH * 0.02);
    }
    atlasDirty = false;
  }

  /* ---------- grid sizing ---------- */

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    // measure the CANVAS (CSS sizes it via the left+right offsets), not the
    // window — so the stage is the area BESIDE the rail. Store rect for pointer
    // mapping and donut tilt.
    var r = canvas.getBoundingClientRect();
    rectL = r.left; rectT = r.top;
    vw = Math.max(1, r.width); vh = Math.max(1, r.height);
    var w = vw, h = vh;

    // only set the BITMAP from the measured CSS size; let CSS own the element box
    canvas.width  = Math.max(1, Math.floor(w * dpr));
    canvas.height = Math.max(1, Math.floor(h * dpr));

    // Cells render at the MONOSPACE aspect: the Detail knob controls cell HEIGHT,
    // and the WIDTH is CHAR_ASPECT * height (a glyph is ~half as wide as it is
    // tall). Every engine + image + words samples assuming this 0.5 char aspect,
    // so matching the on-screen cell shape to it makes the rendering proportioned
    // (round donut, un-stretched image) instead of ~2x horizontally stretched.
    // cw is clamped >= 2 so a fine Detail setting can't explode the column count.
    var CELL_ASPECT = 0.5;            // glyph width / height (matches samplers)
    ch = state.cell;
    cw = Math.max(2, Math.round(state.cell * CELL_ASPECT));
    cols = Math.max(1, Math.ceil(w / cw));
    rows = Math.max(1, Math.ceil(h / ch));
    gridN = cols * rows;

    lum = new Float32Array(gridN);
    glyph = new Uint32Array(gridN);
    cellCol = new Int32Array(gridN);

    // reset per-engine state that depends on grid dims
    Matrix.reset();
    Donut.reset();
    Image_.invalidate();   // grid size changed -> re-sample the image
    Words.invalidate();    // grid size changed -> re-fit the text mask

    atlasDirty = true;
  }

  /* ====================================================================
     ENGINE 1 — DONUT  (Andy Sloane donut.c, ported to a lum/z-buffer grid)
     A torus of tube radius R1 around centre radius R2, rotated by angles
     A (about X) and B (about Z), projected with ooz=1/z into grid cells.
     A per-cell z-buffer resolves occlusion; lum = clamped N.L.
     ==================================================================== */
  var Donut = (function () {
    var simT = 0;               // absolute accumulated sim time (seconds)
    var zbuf = null;            // 1/z per cell (larger = nearer)
    var R1 = 1.0, R2 = 2.0;     // tube radius, centre radius
    var K1auto = 1;             // projection scale, set from grid

    function reset() {
      zbuf = new Float32Array(gridN);
    }

    // pin absolute sim time (used by the reduced-motion static frame so the
    // donut is deterministic and identical on every re-render).
    function setTime(t) { simT = t; }

    // angles are a PURE function of absolute time + pointer offset, so the
    // reduced-motion frame (fixed simT) is deterministic and identical on every
    // re-render, and the pointer AIMS the donut (bounded offset) instead of
    // accelerating its spin.
    function render(dt, tiltX, tiltY) {
      simT += dt;
      // seed gives a stable phase offset so different seeds spin to a
      // different-but-reproducible orientation (variation without chaos).
      var sphase = (state.seed | 0) * 0.123;
      var A = simT * 0.9 + tiltY * 2.4 + sphase;
      var B = simT * 0.45 + tiltX * 2.4 + sphase * 0.5;

      // clear buffers
      lum.fill(0);
      glyph.fill(0);
      if (!zbuf || zbuf.length !== gridN) zbuf = new Float32Array(gridN);
      zbuf.fill(0);

      // projection constants. K2 pushes the donut away from the eye; K1 scales
      // the projection so the donut fills a sensible fraction of the grid.
      var K2 = 5.0;
      // monospace cells are ~2x taller than wide; aspect corrects Y so the
      // donut reads round, not squashed.
      var aspect = 0.5;
      var K1 = Math.min(cols, rows / aspect) * K2 * 0.30 / (R1 + R2);

      var cosA = Math.cos(A), sinA = Math.sin(A);
      var cosB = Math.cos(B), sinB = Math.sin(B);

      var halfC = cols / 2, halfR = rows / 2;

      // theta sweeps the tube cross-section, phi sweeps around the centre.
      // step counts trade detail vs cost; chosen to overfill the grid.
      var thetaStep = 0.07, phiStep = 0.02;
      for (var theta = 0; theta < 6.283185; theta += thetaStep) {
        var ct = Math.cos(theta), st = Math.sin(theta);
        for (var phi = 0; phi < 6.283185; phi += phiStep) {
          var cp = Math.cos(phi), sp = Math.sin(phi);

          // point on the torus surface before world rotation
          var circleX = R2 + R1 * ct;   // distance from centre axis
          var circleY = R1 * st;

          // rotate about X by A then about Z by B (Sloane's composition)
          var x = circleX * (cosB * cp + sinA * sinB * sp) - circleY * cosA * sinB;
          var y = circleX * (sinB * cp - sinA * cosB * sp) + circleY * cosA * cosB;
          var z = K2 + cosA * circleX * sp + circleY * sinA;
          var ooz = 1 / z;   // 1/z, the depth key

          // project to grid cell; Y scaled by aspect so it isn't squashed
          var xp = (halfC + K1 * ooz * x) | 0;
          var yp = (halfR - K1 * aspect * ooz * y) | 0;

          if (xp < 0 || xp >= cols || yp < 0 || yp >= rows) continue;

          // surface normal . light. Light points up/back: (0,1,-1)/sqrt2.
          var L = cp * ct * sinB - cosA * ct * sp - sinA * st +
                  cosB * (cosA * st - ct * sinA * sp);
          // L = N.L in [-sqrt2, sqrt2]; only lit (front) faces draw
          if (L > 0) {
            var idx = yp * cols + xp;
            if (ooz > zbuf[idx]) {        // nearer than what's already here
              zbuf[idx] = ooz;
              lum[idx] = L * 0.707;        // normalize to ~0..1
            }
          }
        }
      }
    }

    return { reset: reset, render: render, setTime: setTime };
  })();

  /* ====================================================================
     ENGINE 2 — MATRIX  (vertical falling-glyph columns)
     Per column a head row advances downward; the head is brightest, the
     tail fades over `len` cells, everything above is dark. Glyphs mutate
     occasionally; the cursor brightens nearby columns. Recycle off-bottom.
     ==================================================================== */
  var Matrix = (function () {
    var head = null, spd = null, len = null;
    var mGlyphCol = null;       // persistent per-cell glyph code, survives frames
    var cap = 0;

    function reset() {
      // re-seed the PRNG so the rain pattern is reproducible from state.seed:
      // the same seed reproduces the same heads/speeds/tails/glyph picks.
      reseed();
      cap = cols;
      head = new Float32Array(cap);
      spd  = new Float32Array(cap);
      len  = new Int16Array(cap);
      // persistent glyph identities for every grid cell; seeded once so streams
      // read as stable characters that only occasionally mutate (not reborn
      // every frame). Survives across render() calls — never cleared wholesale.
      mGlyphCol = new Uint32Array(gridN);
      for (var i = 0; i < gridN; i++) mGlyphCol[i] = randGlyph();
      for (var c = 0; c < cap; c++) seed(c, true);
    }
    function seed(c, stagger) {
      // initial (stagger) heads scatter across the WHOLE screen (small overscan
      // above), so reset() pre-fills a dense, full-height field within ~1s of
      // load instead of dribbling in from offscreen. Recycle reseeds just above.
      // All randomness flows through the seeded rng() for reproducibility.
      head[c] = stagger ? (rng() * (rows + 12) - 6) : -rng() * 6;
      spd[c]  = 8 + rng() * 18;          // cells/sec
      len[c]  = 14 + (rng() * 26) | 0;   // tail length (14..40)
    }
    function randGlyph() {
      return MATRIX_GLYPHS.charCodeAt((rng() * MATRIX_GLYPHS.length) | 0);
    }

    function render(dt) {
      lum.fill(0);
      glyph.fill(0);
      if (!head || cap !== cols || !mGlyphCol || mGlyphCol.length !== gridN) reset();

      for (var c = 0; c < cols; c++) {
        head[c] += spd[c] * dt;
        var h = head[c];
        var tail = len[c];

        // pointer halo: columns near the cursor get a brightness boost
        var boost = 0;
        if (pointer.active && pointer.gx >= 0) {
          var d = Math.abs(c - pointer.gx);
          if (d < 6) boost = (1 - d / 6) * 0.5;
        }

        for (var t = 0; t < tail; t++) {
          var r = (h | 0) - t;
          if (r < 0 || r >= rows) continue;
          var idx = r * cols + c;
          var v;
          if (t === 0) v = 1.0;                       // bright head
          else v = Math.max(0, 1 - t / tail) * 0.85;  // fading trail
          v = Math.min(1, v + boost);
          if (v > lum[idx]) {
            lum[idx] = v;
            // persistent identity: head always mutates; the tail keeps its
            // standing glyph and only occasionally flips (~1.2%), so streams
            // stay stable across frames instead of shimmering all-new each frame.
            if (t === 0 || rng() < 0.012) mGlyphCol[idx] = randGlyph();
            glyph[idx] = mGlyphCol[idx];
          }
        }
        if ((h - tail) > rows) seed(c, false);
      }
    }

    return { reset: reset, render: render };
  })();

  /* ====================================================================
     ENGINE 3 — PLASMA  (normalized sum of sines over x,y,t)
     A smooth morphing scalar field mapped to lum (no glyph override; the
     ramp draws it). The cursor injects a radial ripple/attractor term.
     ==================================================================== */
  var Plasma = (function () {
    var phase = 0;

    function setTime(t) { phase = t; }

    function render(dt) {
      phase += dt;
      glyph.fill(0); // ramp-driven, no forced glyphs

      // seed-derived phase offset: stable per-seed variation of the field.
      var t = phase + (state.seed | 0) * 0.123;
      var a = 0.21, b = 0.17, cc = 0.13, d = 0.20;
      var cx = cols * 0.5, cy = rows * 0.5;
      var pgx = pointer.active ? pointer.gx : -999;
      var pgy = pointer.active ? pointer.gy : -999;

      var idx = 0;
      for (var y = 0; y < rows; y++) {
        for (var x = 0; x < cols; x++) {
          var v = Math.sin(x * a + t) +
                  Math.sin(y * b + t * 0.9) +
                  Math.sin((x + y) * cc + t * 1.1) +
                  Math.sin(Math.sqrt((x - cx) * (x - cx) + (y - cy) * (y - cy)) * d - t);
          // cursor ripple: a travelling ring radiating from the pointer
          if (pgx > -900) {
            var rr = Math.sqrt((x - pgx) * (x - pgx) + (y - pgy) * (y - pgy));
            v += Math.sin(rr * 0.55 - t * 3.0) * Math.exp(-rr * 0.05) * 2.0;
          }
          // 4 base sines span -4..4 (+ripple); normalize to 0..1
          lum[idx++] = (v + 6) / 12;
        }
      }
    }

    return { render: render, setTime: setTime };
  })();

  /* ====================================================================
     ENGINE 5 — LIFE  (Conway's Game of Life with a fading death trail)
     A Uint8 grid stepped ~11 generations/sec (NOT every frame). lum holds a
     decaying value per cell: live cells snap to full; recently-died cells fade
     out over ~0.4s so the texture leaves ghost trails. Pointer paints live
     cells. reset() seeds ~30% noise plus a couple of gliders.
     ==================================================================== */
  var Life = (function () {
    var a = null, b = null;       // current + scratch Uint8 grids
    var acc = 0;                  // generation-step accumulator (seconds)
    var STEP = 1 / 11;            // ~11 gens/sec regardless of frame rate
    var lcols = 0, lrows = 0;

    function alloc() {
      lcols = cols; lrows = rows;
      a = new Uint8Array(gridN);
      b = new Uint8Array(gridN);
    }
    function putGlider(ox, oy) {
      var pts = [[1,0],[2,1],[0,2],[1,2],[2,2]];
      for (var i = 0; i < pts.length; i++) {
        var gx = ox + pts[i][0], gy = oy + pts[i][1];
        if (gx >= 0 && gx < cols && gy >= 0 && gy < rows) a[gy * cols + gx] = 1;
      }
    }
    function reset() {
      reseed();
      alloc();
      for (var i = 0; i < gridN; i++) a[i] = rng() < 0.30 ? 1 : 0;
      putGlider(2, 2);
      putGlider((cols * 0.6) | 0, (rows * 0.3) | 0);
      putGlider((cols * 0.3) | 0, (rows * 0.7) | 0);
      lum.fill(0);
      glyph.fill(0);
      acc = 0;
    }
    function generation() {
      // toroidal neighbour count -> b, then swap a<->b. Survivors stay bright;
      // cells that just died decay (handled in render via lum), births snap up.
      for (var y = 0; y < rows; y++) {
        var ym = (y - 1 + rows) % rows, yp = (y + 1) % rows;
        for (var x = 0; x < cols; x++) {
          var xm = (x - 1 + cols) % cols, xp = (x + 1) % cols;
          var n = a[ym*cols+xm] + a[ym*cols+x] + a[ym*cols+xp] +
                  a[y*cols+xm]               + a[y*cols+xp] +
                  a[yp*cols+xm] + a[yp*cols+x] + a[yp*cols+xp];
          var alive = a[y*cols+x];
          b[y*cols+x] = (alive ? (n === 2 || n === 3) : (n === 3)) ? 1 : 0;
        }
      }
      var t = a; a = b; b = t;
    }
    function render(dt) {
      if (!a || lcols !== cols || lrows !== rows || a.length !== gridN) reset();
      // pointer paints a small live cluster (before stepping so it propagates)
      if (pointer.active && pointer.gx >= 0 && pointer.gx < cols && pointer.gy >= 0 && pointer.gy < rows) {
        for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) {
          var px = pointer.gx + dx, py = pointer.gy + dy;
          if (px >= 0 && px < cols && py >= 0 && py < rows && rng() < 0.7) a[py*cols+px] = 1;
        }
      }
      acc += dt;
      var stepped = false;
      // cap to a couple of generations per frame so a long dt can't stall
      var guard = 0;
      while (acc >= STEP && guard < 3) { generation(); acc -= STEP; stepped = true; guard++; }
      glyph.fill(0);
      // lum: live -> 1; dead -> decay toward 0 (fading death trail). On a gen-step
      // newly-dead cells start their fade from the previous lum; live cells reset.
      var decay = stepped ? 0.55 : Math.pow(0.04, dt); // strong fade per gen-step
      for (var i = 0; i < gridN; i++) {
        if (a[i]) lum[i] = 1;
        else { var v = lum[i] * decay; lum[i] = v < 0.02 ? 0 : v; }
      }
    }
    function settle() {
      // reduced-motion: a developed, recognizable Life texture in one shot.
      reset();
      for (var g = 0; g < 6; g++) generation();
      glyph.fill(0);
      for (var i = 0; i < gridN; i++) lum[i] = a[i] ? 1 : 0;
    }
    return { reset: reset, render: render, settle: settle };
  })();

  /* ====================================================================
     ENGINE 6 — FIRE  (the classic Doom/demoscene fire)
     A heat buffer; the bottom row is held hot with flicker. Each cell above
     takes the heat of the cell below minus a small random cooling, with a
     sideways wind drift so flames lean + lick. lum = heat. Rises + flickers.
     Pointer drops a hot ember.
     ==================================================================== */
  var Fire = (function () {
    // Doom-style upward heat propagation, but with structure that makes it
    // read as a living fire rather than a uniform glowing bed:
    //  - a per-column SOURCE intensity (base[]) modulated by wandering hot
    //    spots so some columns roar and the gaps between them stay dark ->
    //    distinct tapering tongues;
    //  - strong, RANDOM per-cell cooling so tongues taper and break up into
    //    sparse embers near the top (no hard top edge);
    //  - a slowly-drifting WIND field that biases the horizontal source the
    //    heat is pulled from, so tongues lean and lick frame to frame;
    //  - glyph density gated by heat: dense at the base, sparse flickering
    //    sparks up top.
    var heat = null;     // current heat field (lum source)
    var base = null;     // per-column source intensity (0..1), smoothed
    var fcols = 0, frows = 0;
    var ft = 0;          // sim clock (drives wandering hot spots + wind)
    // sparse spark glyphs for the cool, broken-up top of the flame
    var SPARKS = [ 0x2e/*.*/, 0x27/*'*/, 0x60/*`*/, 0x3a/*:*/, 0x2a/* * */ ];
    function alloc() {
      fcols = cols; frows = rows;
      heat = new Float32Array(gridN);
      base = new Float32Array(cols);
    }
    function reset() {
      reseed(); alloc(); heat.fill(0);
      // prime the source row so settle()/first frame already have texture
      for (var x = 0; x < cols; x++) base[x] = 0.55 + rng() * 0.45;
      ft = 0;
    }
    function render(dt) {
      if (!heat || fcols !== cols || frows !== rows || heat.length !== gridN ||
          !base || base.length !== cols) reset();
      ft += dt * (0.6 + state.speed * 1.4);
      // sim runs in fixed sub-steps so speed scales propagation, not fps.
      var steps = 1 + (state.speed * 1.5 | 0); if (steps > 4) steps = 4;
      // base per-row cooling — bigger than before so tongues actually taper and
      // break apart; scaled by height so the fire still climbs tall grids.
      var coolMax = Math.min(0.13, 5.6 / rows);
      var cw = cols > 1 ? cols : 1;

      // --- update the wandering source: 2-3 roaming hot spots + flicker ---
      // hot-spot centres drift across the width on slow sines (no allocation).
      var h1 = (0.5 + 0.45 * Math.sin(ft * 0.43 + 0.0)) * cw;
      var h2 = (0.5 + 0.45 * Math.sin(ft * 0.31 + 2.1)) * cw;
      var h3 = (0.5 + 0.45 * Math.sin(ft * 0.27 + 4.7)) * cw;
      var spread = cw * 0.13 + 2;        // hot-spot half-width
      for (var sx = 0; sx < cols; sx++) {
        // distance falloff to each wandering hot spot -> roaring columns
        var d1 = (sx - h1) / spread, d2 = (sx - h2) / spread, d3 = (sx - h3) / spread;
        var hot = Math.exp(-d1*d1) + 0.85 * Math.exp(-d2*d2) + 0.7 * Math.exp(-d3*d3);
        if (hot > 1) hot = 1;
        // floor so the whole base still smoulders, hot spots push toward max
        var target = 0.38 + 0.62 * hot;
        // strong per-column flicker each step
        target *= 0.7 + rng() * 0.5; if (target > 1) target = 1;
        // smooth toward the target so columns breathe instead of strobing
        base[sx] += (target - base[sx]) * 0.55;
      }
      // wind direction slowly reverses -> tongues lean left, then right
      var wind = Math.sin(ft * 0.37) * 1.6;   // fractional bias in cells

      for (var s = 0; s < steps; s++) {
        // bottom two rows = the hot source (flickering per column, near max)
        for (var br = 0; br < 2; br++) {
          var ry = rows - 1 - br;
          if (ry < 0) break;
          var fade = br === 0 ? 1.0 : 0.92;
          for (var bx = 0; bx < cols; bx++) {
            heat[ry*cols+bx] = base[bx] * fade;
          }
        }
        // propagate upward: each cell <- a windswept sample below minus a
        // random cooling. The integer wind part + a random jitter give the
        // licking sideways drift; the larger random cooling carves dark gaps.
        for (var y = 0; y < rows - 2; y++) {
          var rowAbove = y * cols, rowBelow = (y + 1) * cols;
          // slightly more cooling higher up -> fire thins as it rises
          var hfrac = 1 - (y / rows);                  // 1 at bottom, ->0 top
          var rowCool = coolMax * (1.05 - hfrac * 0.6);
          for (var xx = 0; xx < cols; xx++) {
            var jitter = (rng() * 3 | 0) - 1;            // -1,0,1
            var off = wind + jitter;
            var src2 = xx + (off < 0 ? (off - 0.5 | 0) : (off + 0.5 | 0));
            if (src2 < 0) src2 = 0; else if (src2 >= cols) src2 = cols - 1;
            var below = heat[rowBelow + src2];
            var v = below - rng() * rowCool;
            heat[rowAbove + xx] = v < 0 ? 0 : v;
          }
        }
      }
      // pointer ember: inject a blob of heat near the cursor
      if (pointer.active && pointer.gx >= 0 && pointer.gx < cols && pointer.gy >= 0 && pointer.gy < rows) {
        for (var dy = -2; dy <= 2; dy++) for (var dx = -2; dx <= 2; dx++) {
          var px = pointer.gx + dx, py = pointer.gy + dy;
          if (px >= 0 && px < cols && py >= 0 && py < rows) {
            var fall = 1 - (Math.abs(dx) + Math.abs(dy)) * 0.18;
            if (fall > 0) { var pi = py*cols+px; if (fall > heat[pi]) heat[pi] = fall; }
          }
        }
      }
      // glyph density tracks heat: leave 0 (ramp-derived) where it's hot/dense;
      // up top, where heat is faint, punch in sparse flickering spark glyphs and
      // blank the dimmest cells so the top reads as broken embers, not a wash.
      glyph.fill(0);
      var topZone = (rows * 0.62) | 0;
      for (var gy = 0; gy < topZone; gy++) {
        var gr = gy * cols;
        for (var gx = 0; gx < cols; gx++) {
          var hv = heat[gr + gx];
          if (hv < 0.10) { lum[gr + gx] = 0; continue; } // dark gap / no spark
          // probabilistic spark: rarer the higher/cooler it gets
          if (hv < 0.42 && rng() < 0.5) {
            glyph[gr + gx] = SPARKS[(rng() * SPARKS.length) | 0];
          }
        }
      }
      // hot lower portion: copy heat straight to lum (ramp picks the char)
      for (var li = topZone * cols; li < gridN; li++) lum[li] = heat[li];
      // and the top portion lum where we didn't already zero it
      for (var ty = 0; ty < topZone; ty++) {
        var tr = ty * cols;
        for (var tx = 0; tx < cols; tx++) {
          var ti = tr + tx;
          if (heat[ti] >= 0.10) lum[ti] = heat[ti];
        }
      }
    }
    function settle() {
      reset();
      for (var i = 0; i < 80; i++) render(1/30);
    }
    return { reset: reset, render: render, settle: settle };
  })();

  /* ====================================================================
     ENGINE 7 — FLOW  (a directional drifting fbm field that streams like liquid)
     Distinct from plasma: the field is SAMPLED along a slowly-rotating advection
     direction so structures translate across the screen (a current), and a
     domain-warp (fbm-of-fbm) gives ropey, liquid filaments. Brightness peaks on
     the flow ridges. Pointer injects a local attractor that bends the stream.
     ==================================================================== */
  var Flow = (function () {
    var t = 0;
    // PERSISTENT dye field — the source of truth that gets ADVECTED each frame by
    // a curl-noise velocity field (semi-Lagrangian backtrace). This is what makes
    // structures genuinely TRAVEL along streamlines instead of per-cell sparkle:
    // dye[idx] holds intensity that we transport, decay, and re-inject from a slow
    // moving noise source. dyeB is the double-buffer destination. Sized to the
    // grid and reused — NO per-frame allocation.
    var dye = null, dyeB = null, capN = 0;
    function ensure() {
      if (capN < gridN) {
        dye = new Float32Array(gridN);
        dyeB = new Float32Array(gridN);
        capN = gridN;
      }
    }
    function setTime(v) { t = v; }
    // smooth value noise (hash lattice + quintic smoothstep) — gives organic,
    // continuous fields with no axis-aligned sine artefacts.
    function hash2(ix, iy) {
      var h = (ix * 374761393 + iy * 668265263) ^ ((state.seed | 0) * 2246822519);
      h = (h ^ (h >>> 13)) * 1274126177;
      h = (h ^ (h >>> 16)) >>> 0;
      return h / 4294967296;            // 0..1
    }
    function vnoise(x, y) {
      var ix = Math.floor(x), iy = Math.floor(y);
      var fx = x - ix, fy = y - iy;
      var ux = fx * fx * fx * (fx * (fx * 6 - 15) + 10);   // quintic smootherstep
      var uy = fy * fy * fy * (fy * (fy * 6 - 15) + 10);
      var a = hash2(ix, iy), b = hash2(ix + 1, iy);
      var c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
      var ab = a + (b - a) * ux, cd = c + (d - c) * ux;
      return ab + (cd - ab) * uy;       // 0..1
    }
    // fractal noise (a few octaves) -> the streamfunction whose curl is the flow.
    function fbm(x, y) {
      var v = 0, amp = 0.5, fx = x, fy = y;
      for (var o = 0; o < 3; o++) {
        v += amp * vnoise(fx, fy);
        fx = fx * 2.03 + 17.1; fy = fy * 2.03 - 9.3; amp *= 0.5;
      }
      return v;                          // ~0..0.875
    }
    function render(dt) {
      ensure();
      glyph.fill(0);
      if (dt < 0) dt = 0; else if (dt > 0.1) dt = 0.1;   // clamp for stability
      t += dt;
      var ph = t;
      // ---- velocity field = CURL of a slowly-evolving streamfunction fbm ----
      // v = (dPsi/dy, -dPsi/dx) is divergence-free, so it reads as incompressible
      // swirling liquid. The streamfunction itself drifts over time (the +ph term
      // animates the eddies) and we add a gentle base current so the whole field
      // travels with clear directionality.
      var sc = 0.045;                    // spatial frequency of the eddies
      var eps = 0.9;                     // finite-difference step (lattice units)
      var swirl = 4.2;                   // curl velocity strength (cells/sec-ish)
      var baseAng = Math.sin(ph * 0.07) * 0.6 + 0.4;     // slowly steering current
      var baseU = Math.cos(baseAng) * 1.7, baseV = Math.sin(baseAng) * 1.7;
      var pgx = pointer.active ? pointer.gx : -999;
      var pgy = pointer.active ? pointer.gy : -999;
      var dtAdv = dt > 0 ? dt : 0.016;

      var idx = 0;
      for (var y = 0; y < rows; y++) {
        for (var x = 0; x < cols; x++, idx++) {
          var nx = x * sc, ny = y * sc;
          var tz = ph * 0.18;            // animate the streamfunction (eddies live)
          // curl via central differences of the streamfunction psi
          var p_yp = fbm(nx, ny + sc * eps + tz);
          var p_ym = fbm(nx, ny - sc * eps + tz);
          var p_xp = fbm(nx + sc * eps, ny + tz);
          var p_xm = fbm(nx - sc * eps, ny + tz);
          var u = (p_yp - p_ym) * swirl / (2 * sc * eps) + baseU;
          var v = -(p_xp - p_xm) * swirl / (2 * sc * eps) + baseV;
          // pointer injects a swirling vortex (curl of a gaussian bump)
          if (pgx > -900) {
            var ddx = x - pgx, ddy = y - pgy;
            var rr2 = ddx*ddx + ddy*ddy;
            var g = Math.exp(-rr2 * 0.006) * 9.0;
            u += -ddy * g * 0.06;
            v +=  ddx * g * 0.06;
          }
          // ---- semi-Lagrangian backtrace: where did this cell's dye come from? ----
          var bx = x - u * dtAdv;
          var by = y - v * dtAdv;
          // bilinear sample of the previous dye field at the backtraced point
          if (bx < 0) bx = 0; else if (bx > cols - 1.001) bx = cols - 1.001;
          if (by < 0) by = 0; else if (by > rows - 1.001) by = rows - 1.001;
          var bix = bx | 0, biy = by | 0;
          var ffx = bx - bix, ffy = by - biy;
          var o0 = biy * cols + bix;
          var s00 = dye[o0], s10 = dye[o0 + 1];
          var s01 = dye[o0 + cols], s11 = dye[o0 + cols + 1];
          var top = s00 + (s10 - s00) * ffx;
          var bot = s01 + (s11 - s01) * ffx;
          var adv = top + (bot - top) * ffy;
          // ---- re-inject dye from a slow upstream noise source ----
          // ropey filaments: ridge of a warped fbm, advected with the current so
          // the source structures themselves drift (continuous travelling ropes).
          var qx = nx * 1.7 - baseU * ph * 0.16, qy = ny * 1.7 - baseV * ph * 0.16;
          var wox = fbm(qx + 5.2 + tz, qy - 1.7);
          var woy = fbm(qx - 3.1, qy + 4.4 - tz);
          var src = fbm(qx + wox * 2.4, qy + woy * 2.4);   // 0..~0.875
          var rg = src * 1.143;                            // -> ~0..1
          rg = 1 - Math.abs(rg - 0.5) * 2;                 // ridge -> filaments
          if (rg < 0) rg = 0;
          rg = rg * rg * (1.6 - 0.6 * rg);                 // thin, sharp ropes
          // new value = mostly the advected dye (so it travels + stays continuous),
          // refreshed toward the source ridge so the ropes keep regenerating.
          var nv = adv * 0.88 + rg * 0.22;
          if (nv > 1.0) nv = 1.0;
          dyeB[idx] = nv;
        }
      }
      // pointer dumps a bright blob of dye so you can paint into the current
      if (pgx > -900) {
        var px0 = pgx | 0, py0 = pgy | 0;
        for (var oy = -2; oy <= 2; oy++) {
          var yy = py0 + oy; if (yy < 0 || yy >= rows) continue;
          for (var ox = -2; ox <= 2; ox++) {
            var xx = px0 + ox; if (xx < 0 || xx >= cols) continue;
            var k = yy * cols + xx;
            var add = Math.exp(-(ox*ox + oy*oy) * 0.35) * 0.9;
            var nvv = dyeB[k] + add; if (nvv > 1.25) nvv = 1.25;
            dyeB[k] = nvv;
          }
        }
      }
      // swap buffers + publish to lum with a gentle S-curve so the ropey cores
      // pop bright and the troughs go dark (filaments read as distinct currents).
      var tmp = dye; dye = dyeB; dyeB = tmp;
      for (var i = 0; i < gridN; i++) {
        var d = dye[i];
        if (d > 1) d = 1; else if (d < 0) d = 0;
        // smoothstep-ish contrast: lift cores, deepen gaps
        var s = d * d * (3 - 2 * d);
        lum[i] = d * 0.35 + s * 0.65;
      }
    }
    // SETTLE / RESET — develop the field from a seeded source so the static
    // (reduced-motion) frame already shows formed filaments, then it self-sustains.
    function prime(frames) {
      ensure();
      dye.fill(0); dyeB.fill(0);
      t = 0;
      for (var f = 0; f < frames; f++) render(0.05);
    }
    function reset() { prime(40); }
    function settle() { prime(60); }
    return { render: render, setTime: setTime, settle: settle, reset: reset };
  })();

  /* ====================================================================
     ENGINE 8 — STARFIELD  (3D warp toward the viewer)
     Stars {x,y,z} in a centred volume; z shrinks each frame (warp speed). When
     a star passes the eye it respawns far away. Project x/y by 1/z from the
     centre vanishing point -> a cell; brightness = nearness. A short streak is
     drawn behind each star (its previous projected cell) for the warp look.
     Pointer shifts the vanishing point.
     ==================================================================== */
  var Starfield = (function () {
    var N = 0, sx = null, sy = null, sz = null;
    var aspect = 0.5;            // cell w/h, so X spread matches the round look
    function alloc() {
      N = Math.max(140, Math.min(1100, (cols * rows / 7) | 0));
      sx = new Float32Array(N); sy = new Float32Array(N); sz = new Float32Array(N);
    }
    function spawn(i, full) {
      sx[i] = (rng() * 2 - 1);
      sy[i] = (rng() * 2 - 1);
      sz[i] = full ? rng() : 1;   // 0..1 depth (1 = far)
    }
    function reset() {
      reseed();
      alloc();
      for (var i = 0; i < N; i++) spawn(i, true);
    }
    function render(dt) {
      if (!sx || !N) reset();
      lum.fill(0);
      glyph.fill(0);
      // vanishing point: centre, shifted by the pointer
      var vx = cols * 0.5, vy = rows * 0.5;
      if (pointer.active && pointer.gx >= 0) {
        vx = cols * 0.5 + (pointer.gx - cols * 0.5) * 0.6;
        vy = rows * 0.5 + (pointer.gy - rows * 0.5) * 0.6;
      }
      var spread = Math.min(cols, rows / aspect) * 0.9;
      var warp = dt * (0.35 + state.speed * 0.55);
      for (var i = 0; i < N; i++) {
        var pz = sz[i];
        sz[i] -= warp;
        if (sz[i] <= 0.02) { spawn(i, false); continue; }
        var z = sz[i];
        var px = vx + (sx[i] / z) * spread;
        var py = vy + (sy[i] / z) * spread * aspect;
        var cx = px | 0, cy = py | 0;
        // nearer = brighter, with a floor so even distant stars register as faint
        // specks (a starfield reads as a field, not a few bright dots).
        var bright = 0.18 + (1 - z) * 0.95;
        if (bright > 1) bright = 1;
        // streak: walk from the star's previous (farther) projection to its
        // current one, laying down a fading warp line — long enough to read as
        // motion blur radiating from the vanishing point.
        var ppx = vx + (sx[i] / pz) * spread;
        var ppy = vy + (sy[i] / pz) * spread * aspect;
        var dlen = Math.abs(px - ppx) + Math.abs(py - ppy);
        var steps = 2 + (dlen | 0); if (steps > 14) steps = 14;
        for (var s = 0; s <= steps; s++) {
          var tt = s / steps;
          var ix = (px + (ppx - px) * tt) | 0;
          var iy = (py + (ppy - py) * tt) | 0;
          if (ix < 0 || ix >= cols || iy < 0 || iy >= rows) continue;
          var v = bright * (1 - tt * 0.65);     // head bright, tail fades
          var k = iy * cols + ix;
          if (v > lum[k]) lum[k] = v;
        }
        if (cx >= 0 && cx < cols && cy >= 0 && cy < rows) {
          var ki = cy * cols + cx;
          if (bright > lum[ki]) lum[ki] = bright;
        }
      }
    }
    function settle() {
      reset();
      for (var i = 0; i < 30; i++) render(1/30);
    }
    return { reset: reset, render: render, settle: settle };
  })();

  /* ====================================================================
     ENGINE 9 — TUNNEL  (a rushing radial tunnel)
     For each cell compute its angle + radius from the centre. A scrolling
     texture = angular stripes (function of angle) times radial rings (function
     of 1/radius + time) rushes inward; brightness is modulated by radius so the
     mouth of the tunnel reads brighter near the rim and the throat darkens.
     Pointer moves the centre.
     ==================================================================== */

      for (var x = 0; x < cols; x++) {

        if (cp) {

    'marble','opal','slate','onyx','ivory','saffron','indigo','crimson','viridian',
    'halo','echo','pulse','bloom','flux','haze','frost','signal','relay','cascade',
    'lattice','phantom','mirage','solstice','eclipse','meridian','tide','willow',

      Donut.setTime(1.2);       // fixed absolute time -> stable A,B
      Donut.render(0, tiltX, tiltY);
    } else if (state.engine === 'matrix') {
      Matrix.reset();           // re-prime the full-height field
      Matrix.render(0.4);       // larger settle step advances heads into view
    } else if (state.engine === 'life') {
      Life.settle();            // a developed Life texture in one shot
    } else if (state.engine === 'fire') {
      Fire.settle();            // a settled column of flame
    } else if (state.engine === 'flow') {
      Flow.settle();            // a developed flow field (fixed phase)
    } else if (state.engine === 'starfield') {
      Starfield.settle();       // a settled star spread with streaks
    } else if (state.engine === 'tunnel') {
      Tunnel.settle();          // a developed tunnel (fixed phase)
    } else {
      Plasma.setTime(3.0);      // fixed developed phase (deterministic)
      Plasma.render(0);
    }
    applyGradient();
    paint();
  }

  /* ---------- URL hash wiring — FULL-STATE share hash (append-only) ----------
     keys: e=engine c=charset k=colour sp=speed(0..200) ce=cell(7..22)
           ct=contrast(40..220) sd=seed(integer). readHash() reads ALL keys with
     current defaults when absent; writeHash() writes the full state but TRIMS
     any key equal to its default, so old #e=&c=&k= links still load and new
     links stay short + back-compatible. */

  var charsetFromHash = false; // did the URL explicitly pin a ramp?
  var cellFromHash = false;    // did the URL explicitly pin a cell size (ce=)?

  function clampInt(v, lo, hi) {
    v = parseInt(v, 10);
    if (!isFinite(v)) return null;
    if (v < lo) v = lo; if (v > hi) v = hi;
    return v;
  }

  function readHash() {
    var h = (location.hash || '').replace(/^#/, '');
    charsetFromHash = false;
    cellFromHash = false;
    var wordFromHash = false;   // did the URL pin a word? (implies words mode)
    if (!h) {
      // no hash: default the donut engine to its canonical 'donut' ramp
      state.mode = (state.engine === 'image') ? 'image' : 'generative';
      if (state.engine === 'donut') state.charset = 'donut';
      return;
    }
    var parts = h.split('&');
    for (var i = 0; i < parts.length; i++) {
      var kv = parts[i].split('=');
      var k = kv[0], val = kv[1];
      if (k === 'e' && (GEN_ENGINES[val] || val === 'image')) state.engine = val;
      else if (k === 'iv') state.invert = (val === '1');
      else if (k === 'bg' && BG[val]) state.bg = val;
      else if (k === 'c' && CHARSETS[val]) { state.charset = val; charsetFromHash = true; }
      else if (k === 'k' && COLOURS[val]) state.colour = val;
      else if (k === 'sp') { var sp = clampInt(val, 0, 200); if (sp !== null) state.speed = sp / 100; }
      else if (k === 'ce') { var ce = clampInt(val, 5, 22); if (ce !== null) { state.cell = ce; cellFromHash = true; } }
      else if (k === 'ct') { var ct = clampInt(val, 40, 220); if (ct !== null) state.contrast = ct / 100; }
      else if (k === 'sd') { var sd = parseInt(val, 10); if (isFinite(sd)) state.seed = sd | 0; }
      else if (k === 'w') { try { state.word = decodeURIComponent(val || ''); } catch (e) { state.word = val || ''; } wordFromHash = true; }
      else if (k === 'wf') { if (val === 'solid' || val === '3d' || val === 'matrix' || val === 'plasma' || val === 'donut') state.wordFill = val; }
      else if (k === 'wp') { if (WORD_PALETTES.hasOwnProperty(val)) state.wordPal = val; }
    }
    // top-level MODE: an explicit word pins WORDS mode; else image render => image;
    // else generative. (back-compat: old #e=image links still resolve to image.)
    if (wordFromHash) state.mode = 'words';
    else state.mode = (state.engine === 'image') ? 'image' : 'generative';
    // donut with no explicit ramp -> canonical donut ramp
    if (state.engine === 'donut' && !charsetFromHash) state.charset = 'donut';
  }

  var hashWriteTimer = 0;
  function buildHash() {
    // current full state in hash units; trim any key equal to its default.
    var sp = Math.round(state.speed * 100);
    var ct = Math.round(state.contrast * 100);
    var cur = {
      e:  state.engine,
      c:  state.charset,
      k:  state.colour,
      sp: sp,
      ce: state.cell,
      ct: ct,
      sd: state.seed | 0
    };
    var def = { e:DEFAULTS.engine, c:DEFAULTS.charset, k:DEFAULTS.colour,
                sp:DEFAULTS.speed, ce:DEFAULTS.cell, ct:DEFAULTS.contrast, sd:DEFAULTS.seed };
    var order = ['e', 'c', 'k', 'sp', 'ce', 'ct', 'sd'];
    var out = [];
    for (var i = 0; i < order.length; i++) {
      var key = order[i];
      if (cur[key] !== def[key]) out.push(key + '=' + cur[key]);
    }
    // invert is image-only; append iv=1 only when set (default false -> omitted)
    if (state.invert) out.push('iv=1');
    // STAGE background (top-right toggle): append bg=creme only when non-default
    // (default 'black' -> omitted). Appended after the legacy writer-order array
    // so old links stay back-compatible and the smoke order assertion holds.
    if (state.bg && state.bg !== 'black') out.push('bg=' + state.bg);
    // words-mode keys: w=<word> implies words mode on read; wf=<fill> only when
    // non-default. (Appended after the legacy keys so old links stay back-compat.)
    if (state.mode === 'words') {
      out.push('w=' + encodeURIComponent(state.word == null ? '' : state.word));
      if (state.wordFill !== 'solid') out.push('wf=' + state.wordFill);
      // palette only matters for the 3d fill; trim the default 'mono'.
      if (state.wordFill === '3d' && state.wordPal !== 'mono') out.push('wp=' + state.wordPal);
    }
    return out.length ? '#' + out.join('&') : '#';
  }
  function writeHash() {
    window.clearTimeout(hashWriteTimer);
    hashWriteTimer = window.setTimeout(function () {
      var h = buildHash();
      if (location.hash !== h && !(h === '#' && !location.hash)) {
        history.replaceState(null, '', h);
      }
    }, 120);
  }

  /* ---------- rotary knobs — a tactile dark-metal dial layered over a hidden
     range input. Ported from Fluid: pointer drag (vertical, up = increase) turns
     the value; the indicator rotates over a 270° sweep with a gap at the bottom.
     Driving the native input (set .value + dispatch a real 'input' event) reuses
     EVERY existing path — the slider 'input' handlers fire, state + writeHash run
     exactly as before. Keyboard arrows hit the real range input directly. ---- */
  var knobRefreshers = [];
  function refreshKnobs() {
    for (var i = 0; i < knobRefreshers.length; i++) knobRefreshers[i]();
  }
  function makeKnob(knobEl) {
    var input = document.getElementById(knobEl.getAttribute('data-for'));
    if (!input) return;
    var dial = knobEl.querySelector('.knob-dial');
    var min = parseFloat(input.min), max = parseFloat(input.max);
    var step = parseFloat(input.step) || 1;
    var START = -135, SWEEP = 270;   // 270° sweep, gap centred at the bottom

    function refresh() {
      var frac = (parseFloat(input.value) - min) / (max - min || 1);
      frac = Math.max(0, Math.min(1, frac));
      dial.style.transform = 'rotate(' + (START + frac * SWEEP) + 'deg)';
      knobEl.setAttribute('aria-valuenow', input.value);
      knobEl.setAttribute('aria-valuemin', input.min);
      knobEl.setAttribute('aria-valuemax', input.max);
    }
    function commit(v) {
      v = Math.max(min, Math.min(max, v));
      if (step) v = Math.round(v / step) * step;
      v = Math.max(min, Math.min(max, v));
      if (String(v) !== input.value) {
        input.value = String(v);
        input.dispatchEvent(new Event('input', { bubbles: true }));
      }
      refresh();
    }
    // ANGULAR positioning (Fluid's model): the value follows the pointer's ANGLE
    // about the knob centre, measured clockwise from 12 o'clock across the 270°
    // sweep — click/drag anywhere around the dial and it turns straight to that
    // angle (click a spot to jump to it). Move/up bind to the WINDOW so the drag
    // tracks anywhere on screen; wheel adjusts too.
    function setFromPoint(cx, cy) {
      var r = knobEl.getBoundingClientRect();
      var dx = cx - (r.left + r.width / 2), dy = cy - (r.top + r.height / 2);
      if (!dx && !dy) return;
      var deg = Math.atan2(dx, -dy) * 180 / Math.PI;   // 0 at top, clockwise positive
      if (deg > 135) deg = 135; else if (deg < -135) deg = -135;
      commit(min + ((deg - START) / SWEEP) * (max - min));
    }
    var dragging = false;
    function onMove(e) {
      if (!dragging) return;
      setFromPoint(e.clientX, e.clientY);
      e.preventDefault();
    }
    function onUp() {
      if (!dragging) return;
      dragging = false;
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('pointercancel', onUp);
      input.dispatchEvent(new Event('change', { bubbles: true }));
    }
    knobEl.addEventListener('pointerdown', function (e) {
      dragging = true;
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
      window.addEventListener('pointercancel', onUp);
      knobEl.focus();
      setFromPoint(e.clientX, e.clientY);   // jump straight to the clicked angle
      e.preventDefault();
    });
    knobEl.addEventListener('wheel', function (e) {
      e.preventDefault();
      commit(parseFloat(input.value) + (e.deltaY < 0 ? 1 : -1) * step * (e.shiftKey ? 10 : 1));
    }, { passive: false });
    // keyboard on the dial mirrors the range (the real input also stays reachable)
    knobEl.addEventListener('keydown', function (e) {
      var d = 0;
      if (e.key === 'ArrowUp' || e.key === 'ArrowRight') d = step;
      else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') d = -step;
      else if (e.key === 'Home') { commit(min); e.preventDefault(); return; }
      else if (e.key === 'End') { commit(max); e.preventDefault(); return; }
      else return;
      commit(parseFloat(input.value) + d);
      e.preventDefault();
    });
    input.addEventListener('input', refresh);
    knobRefreshers.push(refresh);
    refresh();
  }
  Array.prototype.forEach.call(document.querySelectorAll('.knob[data-for]'), makeKnob);

  /* ---------- LOOKS: one-tap curated configs ---------- */

    Mono:      { e:'donut',  c:'standard', k:'paper',    sp:70,  ce:10, sd:0 },
    Signal:    { e:'plasma', c:'binary',   k:'phosphor', sp:140, ce:10, sd:0 },

    // STYLE-ONLY gradient looks — they restyle whatever engine is active (no

    Inferno:   { c:'standard', k:'fire',     sp:160, ce:11, sd:0 },
    Drift:     { c:'standard', k:'spectrum', sp:55,  ce:10, sd:0 },
    Aurora:    { c:'blocks',   k:'ice',      sp:80,  ce:12, sd:0 },
    Voltage:   { c:'photo',    k:'neon',     sp:170, ce:10, sd:0 },

  function applyPreset(name) {

    if (!p) return;
    // A LOOK switches to its generative engine but KEEPS any loaded image — you
    // can click the thumbnail to return to it. No surprise clearing. Looks are a
    // generative concept, so they also return the top-level mode to generative.
    state.mode     = 'generative';
    // KEEP the user's current engine — a LOOK only restyles (charset/colour/speed/cell/seed),
    // it does not switch engines (you pick the engine; the look dresses it).
    if (p.c) state.charset = p.c;
    else state.charset = (p.e === 'donut') ? 'donut' : 'standard';
    state.colour   = p.k;
    state.speed    = p.sp / 100;
    state.cell     = p.ce;
    state.seed     = (p.sd | 0);
    reseed();
    atlasDirty = true;

    syncControls();

  /* ---------- LOOK SWATCHES — turn each LOOK button into a square mini-swatch
     made of characters. Each tile shows a static patch of that look's OWN charset
     ramp (so blocks looks show blocks, binary shows 0/1, etc.) tinted to its
     palette: a solid ink colour, or a clipped gradient for the spectrum/fire/ice/
     neon looks, over that look's stage background. The plain-text name in the
     markup stays as the no-JS fallback; here we replace it with [tex][name]. The
     data-look attr + button element are untouched, so the existing delegated click
     handler and setPressed() selection keep working. ---------- */
  function looksField(ramp, rows, cols, seed) {
    // a small deterministic plasma-ish field -> reads as a patch of ASCII art
    // (not flat repetition); seeded per look so every swatch differs.
    var n = ramp.length - 1, out = '';
    for (var y = 0; y < rows; y++) {
      for (var x = 0; x < cols; x++) {
        var a = Math.sin(x * 0.85 + y * 0.55 + seed * 0.13) *
                Math.cos(x * 0.5 - y * 0.9 + seed * 0.07);
        var b = Math.sin((x + y) * 0.7 + seed * 0.21);
        var v = 0.5 + 0.5 * (a * 0.6 + b * 0.4);
        if (v < 0) v = 0; else if (v > 1) v = 1;
        out += ramp.charAt(Math.round(v * n));
      }
      if (y < rows - 1) out += '\n';
    }
    return out;
  }
  function buildLookSwatches() {
    if (!segLooks) return;
    var btns = segLooks.querySelectorAll('button[data-look]');
    for (var i = 0; i < btns.length; i++) {
      var btn = btns[i];
      var name = btn.dataset.look;
      var look = LOOKS[name]; if (!look) continue;
      var C = COLOURS[look.k] || COLOURS.phosphor;
      // the look's own charset ramp (matches how applyPreset resolves charset)
      var ramp = CHARSETS[look.c || (look.e === 'donut' ? 'donut' : 'standard')] || CHARSETS.standard;
      var seed = 0; for (var s = 0; s < name.length; s++) seed += name.charCodeAt(s) * (s + 3);
      var field = looksField(ramp, 6, 8, seed);

      btn.style.background = C.bg;                       // the look's stage bg
      if (C.paper) btn.classList.add('lk-light'); else btn.classList.remove('lk-light');

      var tex = document.createElement('span');
      tex.className = 'looktex';
      tex.setAttribute('aria-hidden', 'true');
      tex.textContent = field;
      if (C.grad && C.stops) {
        var cols = C.stops.map(function (c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }).join(',');
        tex.style.backgroundImage = 'linear-gradient(135deg,' + cols + ')';
        tex.style.webkitBackgroundClip = 'text';
        tex.style.backgroundClip = 'text';
        tex.style.color = 'transparent';
      } else {
        tex.style.color = 'rgb(' + C.ink[0] + ',' + C.ink[1] + ',' + C.ink[2] + ')';
      }
      var nm = document.createElement('span');
      nm.className = 'lookname';
      nm.textContent = name;

      btn.textContent = '';                              // drop the fallback text
      btn.appendChild(tex);
      btn.appendChild(nm);
    }
  }

  function matchLook() {

    for (var name in LOOKS) {

      var c = p.c || (p.e === 'donut' ? 'donut' : 'standard');
      if (state.charset === c && state.colour === p.k &&
          Math.round(state.speed * 100) === p.sp && state.cell === p.ce &&

  function syncControls() {

    // TOP-LEVEL MODE (state.mode): drive the body class (CSS swaps the control
    // set) + the 3-way mode toggle's pressed state.
    var m = state.mode;
    document.body.classList.toggle('mode-generative', m === 'generative');

    document.body.classList.toggle('words-3d', m === 'words' && state.wordFill === '3d');

    var ramps = (m === 'image' || m === 'words');
    if (labCharset) labCharset.textContent = ramps ? 'Ramp' : 'Charset';
    if (knmCell) knmCell.textContent = ramps ? 'Detail' : 'Cell';

    setPressed(segEngine, 'data-engine', state.engine === 'image' ? null : state.engine);
    setPressed(segCharset, 'data-ramp', state.charset);
