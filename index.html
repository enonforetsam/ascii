<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASCII — everything is characters</title>
<meta name="description" content="ASCII is a text-native generative art instrument. Where Fluid renders pixels, ASCII renders characters — a phosphor-green CRT terminal where everything is glyphs.">
<meta name="theme-color" content="#05080a">
<meta property="og:title" content="ASCII — everything is characters">
<meta property="og:description" content="A text-native generative art instrument. Everything is characters.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ascii.krackeddevs.com/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305080a'/%3E%3Ctext x='16' y='23' font-family='monospace' font-size='22' font-weight='700' text-anchor='middle' fill='%2339ff7a'%3E%3E%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --mono:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    /* ---- theme tokens (phosphor default). Each theme sets only --bg/--bg-rgb
       and --ink/--ink-rgb (+ a couple of overrides); ALL chrome colours derive
       from those, so swapping a theme recolours the whole instrument — not just
       the canvas glyphs. ---- */
    --bg:#05080a;  --bg-rgb:5,8,10;
    --ink:#39ff7a; --ink-rgb:57,255,122;
    --ink-dim:#1f8f47;
    --glow:0 0 4px rgba(var(--ink-rgb),.55), 0 0 12px rgba(var(--ink-rgb),.28);
    --ctl-glow:0 0 8px rgba(var(--ink-rgb),.35);
    --scan-op:.7;
    /* derived — re-resolve automatically when --ink-rgb / --bg-rgb change */
    --ink-faint:rgba(var(--ink-rgb),.34);
    --tab-bg:rgba(var(--ink-rgb),.06);
    --tab-bg-hover:rgba(var(--ink-rgb),.16);
    --tab-bg-on:rgba(var(--ink-rgb),.24);
    /* width of the Fluid-style left rail; collapses to 0 when hidden/mobile */
    --panel-w:clamp(224px, 23vw, 300px);
  }
  body[data-theme="amber"]{
    --bg:#0a0600;  --bg-rgb:10,6,0;
    --ink:#ffb026; --ink-rgb:255,176,38;
    --ink-dim:#b87d1a;
    --scan-op:.6;
  }
  body[data-theme="paper"]{
    --bg:#e7e8e2;  --bg-rgb:231,232,226;
    --ink:#13271b; --ink-rgb:19,39,27;
    --ink-dim:#3a5244;
    --glow:none;
    --ctl-glow:none;
    --scan-op:.16;
    --tab-bg:rgba(var(--ink-rgb),.05);
    --tab-bg-hover:rgba(var(--ink-rgb),.12);
    --tab-bg-on:rgba(var(--ink-rgb),.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--mono);
    overflow:hidden;
    position:relative;
    text-shadow:var(--glow);
  }

  /* the STAGE — offset by the left rail so the art lives BESIDE the panel,
     never under it. <canvas> is a replaced element (intrinsic 300x150), so
     left+right+top+bottom alone DON'T stretch it — give it an explicit size:
     width = viewport minus the rail, height = full viewport. */
  #art{
    position:fixed;
    left:var(--panel-w);
    top:0;
    width:calc(100% - var(--panel-w));
    height:100%;
    display:block;
    z-index:0;
  }

  .vignette{
    position:fixed;
    left:var(--panel-w);
    right:0;
    top:0;
    bottom:0;
    z-index:1;
    pointer-events:none;
    background:radial-gradient(120% 100% at 50% 50%,
      rgba(var(--bg-rgb),0) 42%,
      rgba(var(--bg-rgb),.45) 80%,
      rgba(var(--bg-rgb),.9) 100%);
  }

  /* Fluid-style LEFT RAIL — a fixed-width vertical control column pinned to the
     left edge, full height, internal scroll, border-right. The wordmark sits at
     the top; controls stack below. */
  .topbar{
    position:fixed;
    left:0;top:0;bottom:0;
    width:var(--panel-w);
    z-index:4;
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:16px;
    padding:18px 16px 14px;
    overflow-y:auto;
    overscroll-behavior:contain;
    /* LIGHT brushed-metal instrument faceplate — visually identical to Fluid's
       control panel (Fluid .panel, ~line 46). A fixed neutral light-metal panel,
       decoupled from the art theme: override the colour tokens locally to Fluid's
       LIGHT palette so every control resolves DARK-ink-on-light-metal, while the
       stage/art keeps the active theme. Ports Fluid's --panel-metal #d8d8d5, its
       --ink #101010, --line and --accent #f5bdc9 verbatim. */
    --ink:#101010;
    --ink-rgb:16,16,16;
    --ink-dim:rgba(16,16,16,.58);
    --glow:none;
    --ctl-glow:none;
    --line:rgba(16,16,16,.16);
    --accent:#f5bdc9;
    --panel-metal:#d8d8d5;
    color:var(--ink);
    text-shadow:none;
    /* Fluid's exact faceplate: layered radial sheens + a brushed vertical texture +
       a vertical metal gradient, with the inset bevel highlight/shadow. Keep a
       hairline border-right so it reads as a faceplate beside the dark art stage
       (Fluid uses inset -1px; here a real border divides panel from stage). */
    background-color:var(--panel-metal);
    background-image:
      radial-gradient(120% 80% at 100% 0%, rgba(255,255,255,.56), rgba(255,255,255,0) 42%),
      radial-gradient(100% 80% at 0% 100%, rgba(84,68,102,.08), rgba(84,68,102,0) 48%),
      linear-gradient(90deg, rgba(255,255,255,.38), rgba(255,255,255,0) 28%, rgba(0,0,0,.10) 100%),
      repeating-linear-gradient(90deg, rgba(255,255,255,.28) 0, rgba(255,255,255,.28) 1px, rgba(70,76,86,.07) 2px, rgba(70,76,86,.07) 4px),
      linear-gradient(180deg, #e7e8e8 0%, #c8ccd1 54%, #aeb4bc 100%);
    border-right:1px solid rgba(0,0,0,.22);
    box-shadow:
      inset -18px 0 34px rgba(0,0,0,.10),
      inset 1px 0 0 rgba(255,255,255,.75);
  }
  .topbar::-webkit-scrollbar{width:7px;height:7px}
  .topbar::-webkit-scrollbar-thumb{background:rgba(16,16,16,.22);border-radius:7px}
  .topbar::-webkit-scrollbar-track{background:transparent}
  /* Fluid wordmark treatment: uppercase, .22em tracking, LIGHT emboss
     (text-shadow 0 1px 0 rgba(255,255,255,.62)) so dark ink lifts off the metal. */
  h1.wordmark{
    font-size:16px;
    font-weight:700;
    letter-spacing:.22em;
    text-transform:uppercase;
    line-height:1;
    color:var(--ink);
    text-shadow:0 1px 0 rgba(255,255,255,.62);
    white-space:nowrap;
    flex:0 0 auto;
  }
  .wordmark .blip{
    display:inline-block;
    width:.5em;height:.86em;
    margin-left:.18em;
    vertical-align:-.08em;
    background:var(--ink);
    box-shadow:none;
    animation:blink 1.05s steps(1,end) infinite;
  }
  @keyframes blink{50%{opacity:0}}
  .sub{
    font-size:9px;
    letter-spacing:.34em;
    text-transform:uppercase;
    color:var(--ink-dim);
    opacity:1;
    white-space:nowrap;
    flex:0 0 auto;
  }
  @media (max-width:720px){ .sub{display:none} }

  /* controls — stacked vertically inside the rail */
  .controls{
    margin-left:0;
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:14px;
    justify-content:flex-start;
  }
  .group{
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:6px;
  }
  /* Fluid section-label typography: 9px, .16em tracking, uppercase, soft ink */
  .group > .lab{
    font-size:9px;
    letter-spacing:.16em;
    text-transform:uppercase;
    font-weight:700;
    color:var(--ink-dim);
    opacity:1;
    user-select:none;
  }

  /* ---- EMBOSSED METAL TILES — raised, tactile button tiles, IDENTICAL to
     Fluid's .fieldBtn (~line 548) but for text labels on the LIGHT panel: a light
     tile face, a 1px --line hairline border, the inset top-highlight + drop shadow
     (inset 0 1px 0 rgba(255,255,255,.10), 0 2px 4px rgba(0,0,0,.42)); :hover lifts
     (translateY(-1px) + 0 4px 8px), :active presses (translateY(1px)); the active
     aria-pressed="true" maps to Fluid's .fieldBtn.on — the ACCENT-lit pressed
     state (inset accent ring on an accent-tinted face). ---- */
  .tabs{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:6px;
  }
  .tabs.cols2{ grid-template-columns:repeat(2,minmax(0,1fr)); }
  .tab, .btn{
    appearance:none;
    -webkit-appearance:none;
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:0;
    color:#ececef;
    width:100%;
    min-height:34px;
    min-width:32px;
    padding:0 6px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:clip;
    cursor:pointer;
    text-shadow:none;
    border-radius:8px;
    border:1px solid rgba(0,0,0,.55);
    background-color:#06060a;
    background-image:linear-gradient(180deg, #1a1b22 0%, #101117 55%, #08090d 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.12),
      0 2px 4px rgba(0,0,0,.42);
    transition:transform .07s ease, box-shadow .1s ease, background-image .1s ease, color .1s ease, border-color .1s ease;
  }
  .tab:hover, .btn:hover{
    transform:translateY(-1px);
    background-image:linear-gradient(180deg, #20212a 0%, #15161d 55%, #0c0d12 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.16),
      0 4px 8px rgba(0,0,0,.5);
  }
  .tab:active, .btn:active{
    transform:translateY(1px);
    box-shadow:
      inset 0 1px 3px rgba(0,0,0,.6),
      0 1px 1px rgba(0,0,0,.4);
  }
  /* selected — the clicked tile fills WHITE with dark text (pops against the
     dark gunmetal tiles) */
  .tab[aria-pressed="true"]{
    color:#0b0b0c;
    background-image:linear-gradient(180deg, #ffffff 0%, #f2f2f3 60%, #e4e4e6 100%);
    border-color:rgba(0,0,0,.28);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.95),
      0 2px 6px rgba(0,0,0,.3);
  }
  .tab[aria-pressed="true"]:hover{
    background-image:linear-gradient(180deg, #ffffff 0%, #f6f6f7 60%, #eaeaec 100%);
  }

  /* uniform, always-visible focus ring */
  .tab:focus-visible, .btn:focus-visible, .knob:focus-visible, input:focus-visible{
    outline:2px solid var(--ink);
    outline-offset:2px;
  }

  /* ---- KNOBS — three circular dark-metal dials in a row (Speed / Cell /
     Contrast). Ported from Fluid's .knob: a radial-gradient metal face, an inset
     highlight rim, and a WHITE indicator dot that rotates across a ~270° sweep.
     A visually-hidden <input type=range> holds the real value (keyboard + a11y +
     existing 'input' handlers); the knob drives it. ~44px face. ---- */
  .knobgrid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:8px;
  }
  .knobctl{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
    position:relative;
  }
  /* visually-hidden range — keeps keyboard + screen-reader + 'input' handlers */
  .knobctl input[type="range"]{
    position:absolute;
    width:1px;height:1px;
    opacity:0;
    pointer-events:none;
    margin:0;padding:0;
    overflow:hidden;
  }
  .knob{
    width:46px;height:46px;
    position:relative;
    border-radius:50%;
    cursor:pointer;
    touch-action:none;
    -webkit-user-select:none;user-select:none;
    /* dark brushed-metal dial: glossy top rim, deep recessed face */
    background:
      radial-gradient(circle at 50% 32%, rgba(255,255,255,.16), rgba(255,255,255,0) 46%),
      radial-gradient(circle at 50% 50%, #2b2d36 0%, #1a1b22 58%, #0d0e13 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.16),
      inset 0 -6px 12px rgba(0,0,0,.6),
      0 3px 7px rgba(0,0,0,.55),
      0 1px 0 rgba(255,255,255,.06);
  }
  .knob::before{
    /* recessed glass face inside a thin chrome rim */
    content:"";
    position:absolute;inset:8px;
    border-radius:50%;
    background:radial-gradient(circle at 46% 34%, #23242c, #121319 70%, #0a0b10 100%);
    box-shadow:
      inset 0 1px 2px rgba(0,0,0,.7),
      inset 0 0 0 1px rgba(255,255,255,.05);
  }
  /* rotating indicator: a layer that turns; the white dot sits near its top */
  .knob-dial{
    position:absolute;inset:0;
    border-radius:50%;
    z-index:2;
    transform:rotate(-135deg);
    transition:transform .06s linear;
  }
  .knob-dial::after{
    content:"";
    position:absolute;
    left:50%;top:6px;
    width:5px;height:5px;
    margin-left:-2.5px;
    border-radius:50%;
    background:#f5f5f6;
    box-shadow:0 0 4px rgba(245,245,246,.6), 0 1px 1px rgba(0,0,0,.6);
  }
  .knoblabel{
    text-align:center;
    line-height:1.2;
  }
  .knoblabel .knm{
    display:block;
    font-size:8px;
    letter-spacing:.16em;
    text-transform:uppercase;
    opacity:.55;
  }
  .knoblabel .val{
    display:block;
    font-size:11px;
    font-weight:700;
    font-variant-numeric:tabular-nums;
    opacity:.92;
    margin-top:1px;
  }

  /* hide-bar toggle pinned bottom-right so the bar can vanish for clean view */
  .reveal{
    position:fixed;
    right:12px;bottom:12px;
    z-index:4;
    display:none;
  }
  /* hidden state: collapse the rail to 0 so the stage expands full-width */
  body.barhidden{ --panel-w:0px; }
  body.barhidden .topbar{ display:none; }
  body.barhidden .reveal{ display:block; }

  footer{
    position:fixed;
    left:var(--panel-w);right:0;bottom:0;
    z-index:4;
    display:flex;
    justify-content:space-between;
    gap:16px;
    padding:10px 14px;
    font-size:10px;
    letter-spacing:.16em;
    color:var(--ink-faint);
    text-shadow:none;
    pointer-events:none;
  }
  footer span{white-space:nowrap}
  body.barhidden footer{ display:none; }

  .scanlines{
    position:fixed;
    left:var(--panel-w);
    right:0;
    top:0;
    bottom:0;
    z-index:3;
    pointer-events:none;
    background:repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,.16) 3px,
      rgba(0,0,0,.16) 4px
    );
    mix-blend-mode:multiply;
    opacity:var(--scan-op);
  }

  /* record button — active recording state pulses a red dot (on the dark metal tile) */
  .tab.recording{
    border-color:#e0341f;
    color:#ff8a7e;
    background-image:linear-gradient(180deg, #2a1614 0%, #1c0f0e 55%, #120a09 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10), inset 0 0 0 1px rgba(224,52,31,.5), 0 0 9px rgba(224,52,31,.4);
  }
  .tab.recording::before{
    content:"";
    display:inline-block;
    width:7px;height:7px;
    margin-right:6px;
    border-radius:50%;
    background:#c2160a;
    box-shadow:0 0 6px rgba(194,22,10,.7);
    vertical-align:.04em;
    animation:recpulse .9s ease-in-out infinite;
  }
  @keyframes recpulse{50%{opacity:.25}}
  .tab[aria-disabled="true"], .tab:disabled{
    opacity:.4;
    cursor:not-allowed;
  }

  /* ---- MODE SWITCH — a top-level 3-way segmented toggle that swaps the control
     set. body.mode-generative shows the generative-only controls (ENGINE, LOOKS,
     the SPEED knob, the SHUFFLE action); body.mode-image shows the image-only
     controls (the IMAGE source section + INVERT); body.mode-words shows the WORDS
     controls (the text input + FILL picker, SPEED only when the fill is an engine).
     The shared controls (CHARSET/Ramp, COLOUR, the CELL + CONTRAST knobs, COPY +
     SHARE, EXPORT) live in ALL modes. Visibility is pure display:none so there are
     no dead/blank gaps. Driven by state.mode in syncControls(). ---- */

  /* generative-only — hidden in image + words modes */
  body.mode-image #grp-engine,
  body.mode-words #grp-engine,
  body.mode-image #grp-looks,
  body.mode-words #grp-looks,
  body.mode-image #knob-speed,
  body.mode-image .act-shuffle,
  body.mode-words .act-shuffle{ display:none; }

  /* image-only — hidden when not in image mode */
  body.mode-generative #grp-image,
  body.mode-words #grp-image,
  body.mode-generative #img-invert{ display:none; }
  /* INVERT lives inside the image-loaded block; its row wrapper must also vanish
     in generative mode so no empty .tabs row remains. The whole #grp-image is
     already hidden above, so this is only belt-and-braces for the inner row. */

  /* words-only — the text input + FILL picker, hidden in the other modes */
  #grp-words{ display:none; }
  body.mode-words #grp-words{ display:flex; }

  /* PALETTE picker — only for words mode with the 3D block fill. Hidden in every
     other mode/fill so there's no dead control. body.words-3d is set in
     syncControls() when state.mode==='words' && state.wordFill==='3d'. */
  #grp-wordpal{ display:none; }
  body.words-3d #grp-wordpal{ display:flex; }

  /* In image mode the SPEED knob is gone — the knob row now holds CELL + CONTRAST.
     In words mode SPEED is only meaningful when the fill is an engine; body.words-
     static (solid fill) hides it too. Recentre to 2 columns when one dial is gone
     so the remaining dials sit balanced (no empty third column / lopsided gap). */
  body.mode-image .knobgrid,
  body.mode-words.words-static .knobgrid{ grid-template-columns:repeat(2,minmax(0,1fr)); }
  body.mode-words.words-static #knob-speed{ display:none; }
  /* 3D blocks are also static (no animation) -> drop the SPEED knob too. */
  body.mode-words.words-3d .knobgrid{ grid-template-columns:repeat(2,minmax(0,1fr)); }
  body.mode-words.words-3d #knob-speed{ display:none; }

  /* The ACTIONS group is shared (copy + share stay), but SHUFFLE is generative-
     only. The group's .tabs is a 3-col grid; with shuffle hidden in image/words
     mode the two remaining tiles must fill the row cleanly (no blank third cell). */
  body.mode-image #grp-actions .tabs,
  body.mode-words #grp-actions .tabs{ grid-template-columns:repeat(2,minmax(0,1fr)); }

  /* ---- WORDS text input — a self-contained field styled to the metal panel:
     a recessed dark slot (matching the metal tiles' face) with light ink, a
     hairline border + inset shadow so it reads as a milled groove in the panel. */
  .wordfield{
    appearance:none;
    -webkit-appearance:none;
    font-family:var(--mono);
    font-size:13px;
    letter-spacing:.04em;
    color:#f2f2f3;
    width:100%;
    min-height:38px;
    padding:8px 10px;
    border-radius:8px;
    border:1px solid rgba(0,0,0,.6);
    background-color:#0a0b10;
    background-image:linear-gradient(180deg, #0c0d13 0%, #121319 100%);
    box-shadow:
      inset 0 2px 4px rgba(0,0,0,.6),
      inset 0 1px 0 rgba(255,255,255,.04);
    text-shadow:none;
    caret-color:#fff;
  }
  .wordfield::placeholder{ color:rgba(242,242,243,.4); }
  .wordfield:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }

  /* ---- IMAGE SECTION — two states toggled by body.has-image ---------------
     Default (no image): show .image-empty (the "insert image" button), hide
     .image-loaded. With body.has-image: hide .image-empty, show .image-loaded
     (thumbnail + replace + remove + invert). No dead/blank controls in either
     state. */
  .image-loaded{ display:none; flex-direction:column; gap:6px; }
  body.has-image .image-empty{ display:none; }
  body.has-image .image-loaded{ display:flex; }

  .image-row{
    display:flex;
    align-items:stretch;
    gap:6px;
  }
  .image-thumb-actions{
    display:flex;
    flex-direction:column;
    gap:6px;
    flex:1 1 auto;
    min-width:0;
  }
  .image-thumb-actions .tab{ flex:1 1 auto; }

  /* clickable thumbnail tile — a small metal-framed preview of the loaded
     image. Pressed (aria-pressed="true") when the image render is active. */
  .img-thumb{
    appearance:none;
    -webkit-appearance:none;
    flex:0 0 auto;
    width:62px;height:62px;
    padding:3px;
    border-radius:8px;
    cursor:pointer;
    border:1px solid rgba(0,0,0,.55);
    background-color:#06060a;
    background-image:linear-gradient(180deg, #1a1b22 0%, #101117 55%, #08090d 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.12),
      0 2px 4px rgba(0,0,0,.42);
    transition:transform .07s ease, box-shadow .1s ease, border-color .1s ease;
  }
  .img-thumb img{
    display:block;
    width:100%;height:100%;
    object-fit:cover;
    border-radius:5px;
    image-rendering:auto;
  }
  .img-thumb:hover{
    transform:translateY(-1px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.16), 0 4px 8px rgba(0,0,0,.5);
  }
  .img-thumb:active{ transform:translateY(1px); }
  /* active = image is the current render: bright accent ring */
  .img-thumb[aria-pressed="true"]{
    border-color:#fff;
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.9),
      0 0 0 2px rgba(255,255,255,.55),
      0 2px 6px rgba(0,0,0,.4);
  }
  .img-thumb:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){
    .img-thumb{ transition:box-shadow .12s ease, border-color .12s ease; }
    .img-thumb:hover, .img-thumb:active{ transform:none; }
  }

  /* TOAST — self-contained, theme-coloured, fades after ~1.6s */
  .toast{
    position:fixed;
    left:calc(var(--panel-w) + 50%);
    transform:translate(-50%, 12px);
    bottom:34px;
    z-index:6;
    max-width:min(80vw,360px);
    padding:8px 14px;
    font-size:12px;
    letter-spacing:.08em;
    color:var(--ink);
    background:rgba(var(--bg-rgb),.92);
    border:1px solid var(--ink);
    border-radius:3px;
    box-shadow:var(--ctl-glow);
    text-shadow:none;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    pointer-events:none;
    opacity:0;
    transition:opacity .18s ease, transform .18s ease;
  }
  .toast.show{
    opacity:1;
    transform:translate(-50%, 0);
  }
  body.barhidden .toast{ left:50%; }
  @media (max-width:680px){ .toast{ left:50%; } }

  @media (prefers-reduced-motion: reduce){
    .wordmark .blip{animation:none}
    .tab.recording::before{animation:none}
    .toast{transition:none}
    /* no transform/shift transitions when motion is reduced */
    .tab, .btn{transition:box-shadow .12s ease, background-image .12s ease, color .12s ease}
    .tab:hover, .btn:hover{transform:none}
    .tab:active, .btn:active{transform:none}
    .knob-dial{transition:none}
  }

  /* MOBILE — the rail becomes a full-width top strip (a translucent overlay) over
     a full-bleed stage. Groups stay vertical so chips always wrap; nothing can
     overflow horizontally. The strip scrolls internally if tall. */
  @media (max-width:680px){
    :root{ --panel-w:0px; }              /* stage goes full-bleed under the strip */
    .topbar{
      right:0; bottom:auto;
      width:100vw; max-width:100vw; height:auto;
      max-height:64vh;
      border-right:none;
      border-bottom:1px solid var(--ink-faint);
    }
    .controls{ gap:12px; }
    /* phone: flex-wrap the metal tiles + knobs so they adapt to ANY container
       width and never clip — fixed grid columns are rigid, flex-wrap is not. */
    .tabs, .tabs.cols2{ display:flex; flex-wrap:wrap; gap:6px; }
    .tabs .tab, .tabs .btn{ flex:1 1 96px; }
    .knobgrid{ display:flex; flex-wrap:wrap; gap:14px 20px; justify-content:flex-start; }
    .knobctl{ flex:0 0 auto; }
  }
</style>
</head>
<body>
<canvas id="art" aria-hidden="true"></canvas>
<div class="vignette"></div>

<header class="topbar">
  <h1 class="wordmark">ASCII<span class="blip" aria-hidden="true"></span></h1>
  <span class="sub">everything is characters</span>

  <div class="controls" role="group" aria-label="Instrument controls">
    <!-- MODE SWITCH — top-level 3-way segmented toggle that swaps the whole control
         set. Generative = donut/matrix/plasma engines + looks + speed + shuffle.
         Image = the image source + invert. Words = type text -> ASCII, optionally
         filled by a live engine. Driven by body.mode-generative / body.mode-image /
         body.mode-words (set in syncControls from state.mode) so each mode shows
         only its own controls; the shared controls (charset/colour/cell/contrast/
         copy/share/export) live in all three. -->
    <div class="group">
      <span class="lab" id="lab-mode">Mode</span>
      <div class="tabs modeswitch" id="seg-mode" role="group" aria-labelledby="lab-mode">
        <button class="tab" id="mode-gen" data-mode="generative" type="button" aria-pressed="true" aria-label="Generative mode — donut, matrix, plasma engines">Generative</button>
        <button class="tab" id="mode-img" data-mode="image" type="button" aria-pressed="false" aria-label="Image mode — convert a loaded image to ASCII">Image</button>
        <button class="tab" id="mode-words" data-mode="words" type="button" aria-pressed="false" aria-label="Words mode — type text rendered as ASCII">Words</button>
      </div>
    </div>

    <!-- WORDS — type text that renders as ASCII, optionally with a live engine
         flowing inside the letter shapes. Shown only in words mode (body.mode-words).
         The FILL picker chooses what fills the glyphs: solid coverage, or an engine
         (matrix/plasma/donut) cut to the letter mask. -->
    <div class="group" id="grp-words">
      <span class="lab" id="lab-word-text">Text</span>
      <input type="text" class="wordfield" id="word-text" value="ASCII" maxlength="48"
             autocomplete="off" autocapitalize="characters" spellcheck="false"
             aria-labelledby="lab-word-text" aria-label="Words to render as ASCII"
             placeholder="type your words…">
      <span class="lab" id="lab-word-fill" style="margin-top:4px">Fill</span>
      <div class="tabs cols2" id="seg-wordfill" role="group" aria-labelledby="lab-word-fill">
        <button class="tab" data-fill="solid" type="button" aria-pressed="true" aria-label="solid fill — flat letters">solid</button>
        <button class="tab" data-fill="3d" type="button" aria-pressed="false" aria-label="3D fill — extruded block letters with a bevel">3D</button>
        <button class="tab" data-fill="matrix" type="button" aria-pressed="false" aria-label="matrix fill — falling glyphs inside the letters">matrix</button>
        <button class="tab" data-fill="plasma" type="button" aria-pressed="false" aria-label="plasma fill — plasma field inside the letters">plasma</button>
        <button class="tab" data-fill="donut" type="button" aria-pressed="false" aria-label="donut fill — spinning donut inside the letters">donut</button>
      </div>
    </div>

    <!-- PALETTE — the per-cell colour scheme for the 3D block letters. Shown only
         in words mode with the 3D fill (body.words-3d). Distributes colours across
         the word as equal horizontal X-position bands; side bevels are darkened. -->
    <div class="group" id="grp-wordpal">
      <span class="lab" id="lab-wordpal">Palette</span>
      <div class="tabs cols2" id="seg-wordpal" role="group" aria-labelledby="lab-wordpal">
        <button class="tab" data-pal="mono" type="button" aria-pressed="true" aria-label="mono palette — the theme ink colour">mono</button>
        <button class="tab" data-pal="ryb" type="button" aria-pressed="false" aria-label="RYB palette — red, yellow, blue bands">RYB</button>
        <button class="tab" data-pal="rainbow" type="button" aria-pressed="false" aria-label="rainbow palette — a spread of hues">rainbow</button>
        <button class="tab" data-pal="neon" type="button" aria-pressed="false" aria-label="neon palette — cyan, magenta, lime">neon</button>
      </div>
    </div>

    <div class="group" id="grp-engine">
      <span class="lab" id="lab-engine">Engine</span>
      <div class="tabs" role="group" aria-labelledby="lab-engine">
        <button class="tab" id="eng-donut" data-engine="donut" type="button" aria-pressed="true">donut</button>
        <button class="tab" id="eng-matrix" data-engine="matrix" type="button" aria-pressed="false">matrix</button>
        <button class="tab" id="eng-plasma" data-engine="plasma" type="button" aria-pressed="false">plasma</button>
      </div>
    </div>

    <!-- IMAGE — a persistent loaded SOURCE, separate from the generative engines.
         The section toggles between two states via body.has-image: NO image (a
         single "insert image" button) vs LOADED (clickable thumbnail that
         activates the image render + replace + remove + invert). -->
    <div class="group image-group" id="grp-image">
      <span class="lab" id="lab-image">Image</span>

      <!-- state A: no image loaded -->
      <div class="tabs image-empty" role="group" aria-labelledby="lab-image">
        <button class="tab" id="img-insert" type="button" aria-label="Insert an image to convert to ASCII">insert image</button>
      </div>

      <!-- state B: an image is loaded -->
      <div class="image-loaded" role="group" aria-labelledby="lab-image">
        <div class="image-row">
          <button class="img-thumb" id="img-thumb" type="button" aria-pressed="false"
                  aria-label="Activate image render (show the loaded image as ASCII)">
            <img id="img-thumb-img" alt="loaded image thumbnail" decoding="async">
          </button>
          <div class="image-thumb-actions">
            <button class="tab" id="img-replace" type="button" aria-label="Replace the loaded image">replace</button>
            <button class="tab" id="img-remove" type="button" aria-label="Remove the loaded image and return to a generative engine">remove ✕</button>
          </div>
        </div>
        <div class="tabs">
          <button class="tab" id="img-invert" type="button" aria-pressed="false" aria-label="Invert image luminance mapping">invert</button>
        </div>
      </div>

      <input type="file" id="img-file" accept="image/*" style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none;left:-9999px" aria-hidden="true" tabindex="-1">
    </div>

    <div class="group" id="grp-charset">
      <span class="lab" id="lab-charset">Charset</span>
      <div class="tabs seg ramp" id="seg-charset" role="group" aria-labelledby="lab-charset">
        <button class="tab" data-ramp="standard" type="button" aria-pressed="true" aria-label="standard ramp">standard</button>
        <button class="tab" data-ramp="blocks" type="button" aria-pressed="false" aria-label="blocks ramp">blocks</button>
        <button class="tab" data-ramp="dots" type="button" aria-pressed="false" aria-label="dots ramp">dots</button>
        <button class="tab" data-ramp="binary" type="button" aria-pressed="false" aria-label="binary ramp">binary</button>
        <button class="tab" data-ramp="donut" type="button" aria-pressed="false" aria-label="donut ramp">donut</button>
        <button class="tab" data-ramp="photo" type="button" aria-pressed="false" aria-label="photo ramp">photo</button>
      </div>
    </div>

    <div class="group">
      <span class="lab" id="lab-colour">Colour</span>
      <div class="tabs seg colour" id="seg-colour" role="group" aria-labelledby="lab-colour">
        <button class="tab" data-colour="phosphor" type="button" aria-pressed="true" aria-label="phosphor colour">phosphor</button>
        <button class="tab" data-colour="amber" type="button" aria-pressed="false" aria-label="amber colour">amber</button>
        <button class="tab" data-colour="paper" type="button" aria-pressed="false" aria-label="paper colour">paper</button>
      </div>
    </div>

    <div class="group" id="grp-knobs">
      <span class="lab" id="lab-knobs">Motion</span>
      <div class="knobgrid">
        <div class="knobctl knob-speed" id="knob-speed">
          <div class="knob" data-for="sl-speed" role="slider" tabindex="0" aria-label="Speed"><span class="knob-dial"></span></div>
          <input type="range" id="sl-speed" min="0" max="200" value="100" aria-label="Speed" aria-valuetext="100 percent">
          <div class="knoblabel"><span class="knm">Speed</span><span class="val" id="val-speed">100</span></div>
        </div>
        <div class="knobctl">
          <div class="knob" data-for="sl-cell" role="slider" tabindex="0" aria-label="Cell size in pixels"><span class="knob-dial"></span></div>
          <input type="range" id="sl-cell" min="5" max="22" value="12" aria-label="Cell size in pixels" aria-valuetext="12 pixels">
          <div class="knoblabel"><span class="knm" id="knm-cell">Cell</span><span class="val" id="val-cell">12</span></div>
        </div>
        <div class="knobctl">
          <div class="knob" data-for="sl-contrast" role="slider" tabindex="0" aria-label="Contrast"><span class="knob-dial"></span></div>
          <input type="range" id="sl-contrast" min="40" max="220" value="100" aria-label="Contrast" aria-valuetext="100 percent">
          <div class="knoblabel"><span class="knm">Contrast</span><span class="val" id="val-contrast">100</span></div>
        </div>
      </div>
    </div>

    <div class="group" id="grp-looks">
      <span class="lab" id="lab-looks">Looks</span>
      <div class="tabs seg looks cols2" id="seg-looks" role="group" aria-labelledby="lab-looks">
        <button class="tab" data-look="Neo" type="button" aria-label="Neo look">Neo</button>
        <button class="tab" data-look="Solaris" type="button" aria-label="Solaris look">Solaris</button>
        <button class="tab" data-look="Blueprint" type="button" aria-label="Blueprint look">Blueprint</button>
        <button class="tab" data-look="Mono" type="button" aria-label="Mono look">Mono</button>
        <button class="tab" data-look="Signal" type="button" aria-label="Signal look">Signal</button>
        <button class="tab" data-look="Ember" type="button" aria-label="Ember look">Ember</button>
      </div>
    </div>

    <div class="group" id="grp-actions">
      <span class="lab" id="lab-actions">Actions</span>
      <div class="tabs" role="group" aria-labelledby="lab-actions">
        <button class="tab" id="act-copy" type="button" aria-label="Copy frame as text (C)">copy</button>
        <button class="tab" id="act-share" type="button" aria-label="Copy share link">share</button>
        <button class="tab act-shuffle" id="act-shuffle" type="button" aria-label="Shuffle the seed">shuffle</button>
      </div>
    </div>

    <div class="group">
      <span class="lab" id="lab-export">Export</span>
      <div class="tabs cols2" role="group" aria-labelledby="lab-export">
        <button class="tab" id="exp-txt" type="button" aria-label="Download as plain text">txt</button>
        <button class="tab" id="exp-ans" type="button" aria-label="Download as ANSI colour text">ans</button>
        <button class="tab" id="exp-png" type="button" aria-label="Download as PNG image">png</button>
        <button class="tab" id="exp-rec" type="button" aria-pressed="false" aria-label="Record a WebM clip">rec</button>
      </div>
    </div>

    <button class="btn" id="btn-hide" type="button" aria-pressed="false" aria-label="Hide control bar for a clean view">hide</button>
  </div>
</header>

<button class="btn reveal" id="btn-show" type="button" aria-label="Show control bar">controls</button>

<footer>
  <span>M2 · copy · share · export · looks</span>
  <span>ascii.krackeddevs.com</span>
</footer>

<div class="scanlines" aria-hidden="true"></div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('art');
  var ctx = canvas.getContext('2d', { alpha: false });
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- configuration tables ---------- */

  // ramps go DARK -> BRIGHT; index 0 is treated as blank (skipped at render)
  var CHARSETS = {
    standard: ' .:-=+*#%@',
    blocks:   ' .:░▒▓█',
    dots:     ' .·:•',
    binary:   ' 01',
    donut:    ' .,-~:;=!*#$@',
    // dense Paul Bourke-style 70-level grayscale ramp (dark -> bright). Leading
    // space => index 0 is blank; the long smooth gradient resolves photographic
    // tone instead of the few coarse steps a short ramp gives.
    photo:    ' .\'`^",:;Il!i><~+_-?][}{1)(|/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$'
  };

  // the solid full block — forced for every face + side cell of the 3D word
  // render so it reads as chunky blocks regardless of the active ramp.
  var BLOCK_CP = 0x2588; // '█'

  // matrix uses its own glyph set (katakana + latin + symbols), forced per cell
  var MATRIX_GLYPHS =
    'アイウエオカキクケコサシスセソ' +
    'タチツテトナニヌネノハヒフヘホ' +
    '0123456789<>=*+-/\\|:;ABCDEFGHKLMNPRSTUXYZ';

  var COLOURS = {
    phosphor: { bg:'#05080a', ink:[57,255,122],  paper:false },
    amber:    { bg:'#0a0600', ink:[255,176,38],   paper:false },
    paper:    { bg:'#e4e6e0', ink:[18,40,24],      paper:true  }
  };

  /* ---------- live state ---------- */

  var state = {
    mode:    'generative', // 'generative' | 'image' | 'words' — top-level creative mode
    engine:  'donut',
    charset: 'standard',
    colour:  'phosphor',
    speed:   1.0,    // 0..2 multiplier
    cell:    12,     // logical px per cell
    contrast:1.0,    // 0.4..2.2 gamma-ish multiplier
    seed:    0,       // integer; feeds the seeded PRNG for reproducible variation
    invert:  false,   // image engine: invert the luminance->glyph mapping
    word:    'ASCII', // words mode: the text to render as ASCII
    wordFill:'solid', // words mode: 'solid' | '3d' | 'matrix' | 'plasma' | 'donut'
    wordPal: 'mono'   // words 3d: colour palette 'mono'|'ryb'|'rainbow'|'neon'
  };

  // WORDS 3D palettes — ordered colour BANDS distributed across the word by
  // X-position (band 0 owns the leftmost slice, etc). 'mono' is a sentinel that
  // resolves to the active theme ink at render time (back-compat single ink).
  var WORD_PALETTES = {
    mono:    null,                                  // -> theme ink (per-cell off)
    ryb:     [[226,59,59], [255,207,51], [59,123,226]],            // red/yellow/blue
    rainbow: [[233,69,69],[247,148,41],[247,224,41],[74,201,96],[51,140,228],[150,84,214]],
    neon:    [[44,232,228], [232,44,210], [156,247,46]]            // cyan/magenta/lime
  };

  // DEFAULTS — the canonical baseline. writeHash() trims any key equal to its
  // default so share links stay short and back-compatible with old #e=&c=&k=.
  var DEFAULTS = {
    engine:  'donut',
    charset: 'standard',
    colour:  'phosphor',
    speed:   100,    // hash units (percent)
    cell:    12,
    contrast:100,    // hash units (percent)
    seed:    0
  };

  // the generative engines (the only ones reachable via the ENGINE tabs); the
  // 'image' render is activated from the IMAGE section, not an engine tab.
  var GEN_ENGINES = { donut:1, matrix:1, plasma:1 };
  // remember the last generative engine, so removing an image returns to it
  // (donut by default). Seeded from the boot state if it's already generative.
  var lastGenEngine = 'donut';

  /* ---------- seeded PRNG (mulberry32) — best-effort reproducibility ---------
     A small deterministic generator so the same state.seed reproduces the same
     matrix rain / engine phase. rng() yields a fresh function from the current
     seed; engines pull from it so re-seeding gives a stable, repeatable look. */
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(0);            // active seeded generator (re-made on reseed)
  function reseed() { rng = mulberry32(state.seed | 0); }

  // grid + reusable typed arrays (the character buffer — source of truth)
  var dpr = 1, cw = 12, ch = 12, cols = 0, rows = 0, gridN = 0;
  // stage geometry (the canvas rect, NOT the window) — left rail offset aware
  var rectL = 0, rectT = 0, vw = 1, vh = 1;
  var lum = null;     // Float32Array, 0..1 intensity per cell
  var glyph = null;   // Uint32Array, forced code point per cell; 0 => derive from ramp
  // per-cell colour buffer for the words-3d multi-colour render. Int32Array of
  // packed 0xRRGGBB (>=0) per non-blank cell, or -1 to mean "use the theme ink"
  // (the normal single-ink path). NON-NULL/active only while words-3d renders;
  // cleared (colActive=false) for every other engine so the fast atlas path runs.
  var cellCol = null; // Int32Array(gridN): packed RGB per cell, -1 = theme ink
  var colActive = false; // is the per-cell colour path live this frame?

  var pointer = { x: -1, y: -1, gx: -1, gy: -1, active: false };

  /* ---------- glyph atlas ---------- */
  // Pre-bake the active ramp (and matrix set when needed) into an offscreen
  // canvas at cell size, in the ink colour. We bake the glyph at full ink and
  // quantize brightness via globalAlpha steps at blit time (limits state churn).

  var atlas = document.createElement('canvas');
  var actx = atlas.getContext('2d');
  var atlasMap = {};        // codepoint -> column index in atlas
  var atlasList = [];       // ordered codepoints baked
  var atlasDirty = true;

  function rampString() { return CHARSETS[state.charset] || CHARSETS.standard; }

  function buildAtlas() {
    var ink = COLOURS[state.colour].ink;
    var inkCss = 'rgb(' + ink[0] + ',' + ink[1] + ',' + ink[2] + ')';

    // collect the glyph set we need: the ramp always, plus matrix glyphs when
    // the matrix engine is active (it forces code points).
    var set = [];
    var seen = {};
    function add(cp) {
      if (cp === 32 || seen[cp]) return; // skip space + dupes
      seen[cp] = true; set.push(cp);
    }
    var ramp = rampString();
    for (var i = 0; i < ramp.length; i++) add(ramp.charCodeAt(i));
    // matrix glyphs are forced code points — bake them when matrix is the active
    // generative engine OR when the words-mode fill is 'matrix'.
    if (state.engine === 'matrix' ||
        (state.mode === 'words' && state.wordFill === 'matrix')) {
      for (var j = 0; j < MATRIX_GLYPHS.length; j++) add(MATRIX_GLYPHS.charCodeAt(j));
    }
    // the 3D word fill forces the full block '█' for face + side cells — bake it
    // so the mono (theme-ink) path can blit it from the atlas like any glyph.
    if (state.mode === 'words' && state.wordFill === '3d') add(BLOCK_CP);

    atlasList = set;
    atlasMap = {};
    var n = set.length;

    var tileW = Math.max(1, Math.ceil(cw * dpr));
    var tileH = Math.max(1, Math.ceil(ch * dpr));
    atlas.width  = Math.max(1, tileW * n);
    atlas.height = tileH;

    actx.setTransform(1, 0, 0, 1, 0, 0);
    actx.clearRect(0, 0, atlas.width, atlas.height);
    actx.font = '700 ' + Math.round(ch * dpr * 0.96) + 'px ' +
      'ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace';
    actx.textBaseline = 'middle';
    actx.textAlign = 'center';
    actx.fillStyle = inkCss;
    for (var k = 0; k < n; k++) {
      atlasMap[set[k]] = k;
      actx.fillText(String.fromCharCode(set[k]), k * tileW + tileW / 2, tileH / 2 + tileH * 0.02);
    }
    atlasDirty = false;
  }

  /* ---------- grid sizing ---------- */

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    // measure the CANVAS (CSS sizes it via the left+right offsets), not the
    // window — so the stage is the area BESIDE the rail. Store rect for pointer
    // mapping and donut tilt.
    var r = canvas.getBoundingClientRect();
    rectL = r.left; rectT = r.top;
    vw = Math.max(1, r.width); vh = Math.max(1, r.height);
    var w = vw, h = vh;

    // only set the BITMAP from the measured CSS size; let CSS own the element box
    canvas.width  = Math.max(1, Math.floor(w * dpr));
    canvas.height = Math.max(1, Math.floor(h * dpr));

    cw = state.cell;
    ch = state.cell;
    cols = Math.max(1, Math.ceil(w / cw));
    rows = Math.max(1, Math.ceil(h / ch));
    gridN = cols * rows;

    lum = new Float32Array(gridN);
    glyph = new Uint32Array(gridN);
    cellCol = new Int32Array(gridN);

    // reset per-engine state that depends on grid dims
    Matrix.reset();
    Donut.reset();
    Image_.invalidate();   // grid size changed -> re-sample the image
    Words.invalidate();    // grid size changed -> re-fit the text mask

    atlasDirty = true;
  }

  /* ====================================================================
     ENGINE 1 — DONUT  (Andy Sloane donut.c, ported to a lum/z-buffer grid)
     A torus of tube radius R1 around centre radius R2, rotated by angles
     A (about X) and B (about Z), projected with ooz=1/z into grid cells.
     A per-cell z-buffer resolves occlusion; lum = clamped N.L.
     ==================================================================== */
  var Donut = (function () {
    var simT = 0;               // absolute accumulated sim time (seconds)
    var zbuf = null;            // 1/z per cell (larger = nearer)
    var R1 = 1.0, R2 = 2.0;     // tube radius, centre radius
    var K1auto = 1;             // projection scale, set from grid

    function reset() {
      zbuf = new Float32Array(gridN);
    }

    // pin absolute sim time (used by the reduced-motion static frame so the
    // donut is deterministic and identical on every re-render).
    function setTime(t) { simT = t; }

    // angles are a PURE function of absolute time + pointer offset, so the
    // reduced-motion frame (fixed simT) is deterministic and identical on every
    // re-render, and the pointer AIMS the donut (bounded offset) instead of
    // accelerating its spin.
    function render(dt, tiltX, tiltY) {
      simT += dt;
      // seed gives a stable phase offset so different seeds spin to a
      // different-but-reproducible orientation (variation without chaos).
      var sphase = (state.seed | 0) * 0.123;

      var W = OW * SS, H = OH * SS;

      if (W > 4096) { SS = Math.max(1, (4096 / OW) | 0); W = OW * SS; H = OH * SS; }
      off.width = W; off.height = H;
      octx.setTransform(1, 0, 0, 1, 0, 0);
      octx.clearRect(0, 0, W, H);

      octx.textAlign = 'center';

      var fontStack = '900 PXpx system-ui, -apple-system, "Segoe UI", Roboto, ' +

      // width with a small margin, and all lines stack within the height. Wrapping

      // the full height rather than overflowing the width.
      var lines = words;

    // whole logo (face + depth) stays on-grid.

    function buildPixels(txt) {
      pixDirty = false;
      pixKeyText = txt; pixKeyCols = cols; pixKeyRows = rows;
      if (!pix || pix.length !== gridN) pix = new Uint8Array(gridN);
      pix.fill(0);
      pixMinX = 0; pixMaxX = -1; pixMinY = 0; pixMaxY = -1;

      var FW = FONT5x7.W, FH = FONT5x7.H;
      var words = txt.split(/\s+/).filter(function (w) { return w.length; });
      if (!words.length) return;

      // Inter-glyph gap = 1 font pixel; words on the same line get a wider gap.
      var GAP = 2;           // font-pixel cols between glyphs (>= depth so the 3D extrude of one letter never bleeds into the next)
      var WGAP = FW + 1;     // font-pixel columns between words on a line (a space)
      var LGAP = 2;          // font-pixel rows between text lines

      // into lines; return the line list (each = array of words) and the pixel
      // dimensions, or null if even one word overflows the width at this scale.
      function layout(S, depthD) {
        // available cells, leaving room for the diagonal extrude depth (down+right)
        var availCols = cols - depthD;

        if (availCols < FW * S || availRows < FH * S) return null;
        // word pixel-width helper (font pixels)
        function wWidth(w) { return w.length * FW + (w.length - 1) * GAP; }
        var lines = [], cur = [], curW = 0;
        for (var i = 0; i < words.length; i++) {

          var add = (cur.length ? WGAP : 0) + wWidth(w);

          } else {

        if (cur.length) lines.push(cur);

        // max pixel width across lines

        for (var li = 0; li < lines.length; li++) {

      }

      // depth scales with S; estimate before final S is known by trying largest S
      // down to 1, recomputing depth each time (depth ~ 1.6*S, clamped).
      var best = null;
      for (var S = Math.max(rows, cols); S >= 1 && !best; S--) {
        var D = depthForScale(S);
        var lay = layout(S, D);
        if (lay) best = { lay: lay, D: D };
      }
      if (!best) return; // shouldn't happen (S=1 with depth 0-ish always fits-ish)

      var S2 = best.lay.S, D2 = best.D;
      var pw = best.lay.pw, ph = best.lay.ph;
      // centre the block within the available (cells minus depth) area
      var availCols = cols - D2, availRows = rows - D2;
      var ox = Math.floor((availCols - pw * S2) / 2);
      var oy = Math.floor((availRows - ph * S2) / 2);
      if (ox < 0) ox = 0; if (oy < 0) oy = 0;

      // stamp each line of words
      var lineYpx = 0;
      for (var li2 = 0; li2 < best.lay.lines.length; li2++) {
        var line = best.lay.lines[li2];
        // line is centred horizontally too
        var lwpx = 0;
        for (var ki = 0; ki < line.length; ki++) {
          lwpx += line[ki].length * FW + (line[ki].length - 1) * GAP;
          if (ki) lwpx += WGAP;
        }
        var lineXpx = Math.floor((pw - lwpx) / 2);
        var penX = lineXpx;
        for (var wi = 0; wi < line.length; wi++) {
          var word = line[wi];
          for (var ci = 0; ci < word.length; ci++) {

            stampGlyph(ch, ox + penX * S2, oy + lineYpx * S2, S2);
            penX += FW + GAP;

          penX += WGAP - GAP; // word separator (we already advanced one GAP)
        }
        lineYpx += FH + LGAP;

    }

    function depthForScale(S) {
      var D = Math.round(S * 1.3);
      if (D < 1) D = 1;
      if (D > 9) D = 9;
      return D;
    }

    // stamp one bitmap glyph at cell (cx0,cy0) at integer scale S into pix[].
    function stampGlyph(ch, cx0, cy0, S) {
      var FW = FONT5x7.W, FH = FONT5x7.H;
      for (var ry = 0; ry < FH; ry++) {
        for (var rx = 0; rx < FW; rx++) {
          if (!FONT5x7.lit(ch, rx, ry)) continue;
          var bx = cx0 + rx * S, by = cy0 + ry * S;
          for (var sy = 0; sy < S; sy++) {
            var yy = by + sy; if (yy < 0 || yy >= rows) continue;
            var rowOff = yy * cols;

              var xx = bx + sx; if (xx < 0 || xx >= cols) continue;
              pix[rowOff + xx] = 1;
              if (pixMaxX < 0) { pixMinX = pixMaxX = xx; pixMinY = pixMaxY = yy; }
              if (xx < pixMinX) pixMinX = xx;
              if (xx > pixMaxX) pixMaxX = xx;
              if (yy < pixMinY) pixMinY = yy;

    // Multiply the freshly-rendered lum[] by the letter mask (engine fills).
    function applyMask() {
      ensure();

    // Solid fill: lum = mask coverage (static; ramp gradates the edges).
    function renderSolid() {
      ensure();
      glyph.fill(0);
      if (mask && mask.length === gridN) lum.set(mask);
      else lum.fill(0);
    }

    // 3D BLOCK letters: extruded, multi-colour, STATIC.
    //  Now driven by the INLINE BITMAP FONT (FONT5x7) — crisp on/off pixel-blocks
    //  integer-scaled into the grid (no vector-font anti-aliasing), so the letters
    //  read as a retro 8-bit pixel logo. For each lit font-pixel:
    //   - FACE cells = bright solid palette block ('█'), drawn on top.
    //   - DEPTH cells = the extruded side, walked 1..D in the down-right diagonal.
    //     Rendered as a LIGHTER shade of the band colour with the BLOCK GRID
    //     showing (a checker of '█' + '▓' on a per-cell basis), so the depth reads
    //     as "built from 3D blocks" rather than a flat darker shadow.
    //  Per-cell colour (cellCol) comes from X-position bands of the active palette
    //  ('mono' -> theme ink). Depth D auto-scales to the integer font scale.
    function render3d() {
      ensurePixels();
      lum.fill(0);
      glyph.fill(0);
      if (cellCol) cellCol.fill(-1);
      colActive = false;
      if (!pix || pix.length !== gridN || pixMaxX < 0) return;

      var minX = pixMinX, maxX = pixMaxX, minY = pixMinY, maxY = pixMaxY;

      // DEPTH auto-scales to the font integer scale used in buildPixels: derive
      // the scale back from the lit bbox isn't reliable, so recompute from the
      // chosen layout via depthForScale on the effective scale. We approximate the
      // scale as the letter height / font height; depth follows that.
      var letterH = (maxY - minY + 1);
      var approxS = Math.max(1, Math.round(letterH / FONT5x7.H));
      var D = depthForScale(approxS);

      // palette + band geometry (bands span the word's X extent).
      var pal = WORD_PALETTES[state.wordPal] || null;
      var ink = COLOURS[state.colour].ink;
      var wSpan = Math.max(1, maxX - minX + 1);
      var nBands = pal ? pal.length : 1;
      function bandRGB(gx) {

        var bi = (((gx - minX) / wSpan) * nBands) | 0;
        if (bi < 0) bi = 0; if (bi >= nBands) bi = nBands - 1;
        return pal[bi];
      }
      function pack(rgb) { return ((rgb[0] & 255) << 16) | ((rgb[1] & 255) << 8) | (rgb[2] & 255); }
      // a LIGHTER tint of the band colour for the 3D side (mix toward white) so
      // the depth reads as the same colour's lit side, matching the reference.
      function lighten(rgb, t) {

      var SHADE_CP = 0x2593; // '▓' — used on alternating depth cells to show grid

      // SIDE pass first (face draws over it). For each lit font-pixel, walk 1..D in
      // the down-right diagonal; any in-bounds non-face cell becomes a depth block.
      for (var fi = 0; fi < gridN; fi++) {

      // FACE pass — bright solid block on top, full band colour.
      for (var pf = 0; pf < gridN; pf++) {

        lum[pf] = 1.0;
        glyph[pf] = BLOCK_CP;
        cellCol[pf] = pack(bandRGB(pf % cols));
      }
      // engage the per-cell colour path. For mono (no palette) the depth still
      // needs the per-cell renderer to show its lighter tint, so keep it on; cells
      // left at -1 fall back to theme ink in paintPerCell.

  /* ---------- renderer: blit the atlas per non-blank cell ---------- */

  var ALPHA_STEPS = 6; // quantize brightness to N alpha tiers

  function paint() {
    var col = COLOURS[state.colour];
    var tileW = Math.max(1, Math.ceil(cw * dpr));
    var tileH = Math.max(1, Math.ceil(ch * dpr));

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = col.bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (atlasDirty) buildAtlas();

    var ramp = rampString();
    var rampLen = ramp.length;
    var gamma = state.contrast;
    var cpw = Math.max(1, cw * dpr);
    var cph = Math.max(1, ch * dpr);

    // PER-CELL COLOUR PATH — words-3d with a real palette. Each non-blank cell
    // owns a colour in cellCol (packed RGB); draw its glyph directly with
    // fillText in that colour. The render is STATIC, so per-cell fills are cheap.
    if (colActive && cellCol) {
      paintPerCell(ramp, rampLen, gamma, cpw, cph);
      return;
    }

    ctx.globalAlpha = 1;
    var prevAlpha = -1;
    var i = 0;
    for (var y = 0; y < rows; y++) {
      var py = Math.round(y * cph);
      for (var x = 0; x < cols; x++, i++) {
        var v = lum[i];
        if (v <= 0.001) continue;
        // contrast shaping
        if (gamma !== 1) v = Math.pow(v, 1 / gamma);
        if (v <= 0.004) continue;

        // pick the glyph: forced code point, or derive from ramp by lum
        var cp = glyph[i];
        if (cp === 0) {
          var ri = (v * (rampLen - 1) + 0.5) | 0;
          if (ri < 1) continue;            // ramp index 0 == blank
          if (ri > rampLen - 1) ri = rampLen - 1;
          cp = ramp.charCodeAt(ri);
          if (cp === 32) continue;         // space => blank
        }
        var tile = atlasMap[cp];
        if (tile === undefined) continue;

        // quantize alpha to limit state changes
        var aStep = (v * ALPHA_STEPS + 0.5) | 0;
        if (aStep < 1) aStep = 1;
        if (aStep > ALPHA_STEPS) aStep = ALPHA_STEPS;
        var alpha = aStep / ALPHA_STEPS;
        if (alpha !== prevAlpha) { ctx.globalAlpha = alpha; prevAlpha = alpha; }

        ctx.drawImage(
          atlas,
          tile * tileW, 0, tileW, tileH,
          Math.round(x * cpw), py, tileW, tileH
        );
      }
    }
    ctx.globalAlpha = 1;
  }

  // PER-CELL colour renderer (words-3d). Draws each non-blank cell's glyph in its
  // OWN colour from cellCol (packed 0xRRGGBB) with crisp solid blocks. Falls back
  // to the theme ink for any cell left at -1 (e.g. mono cells that slipped here).
  function paintPerCell(ramp, rampLen, gamma, cpw, cph) {
    var ink = COLOURS[state.colour].ink;
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';
    ctx.font = '700 ' + Math.round(ch * dpr * 0.96) + 'px ' +
      'ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace';
    ctx.globalAlpha = 1;
    var halfW = cpw / 2, halfH = cph / 2;
    var i = 0;
    for (var y = 0; y < rows; y++) {
      var cyp = y * cph + halfH + cph * 0.02;
      for (var x = 0; x < cols; x++, i++) {
        var v = lum[i];
        if (v <= 0.001) continue;
        if (gamma !== 1) v = Math.pow(v, 1 / gamma);
        if (v <= 0.004) continue;
        var cp = glyph[i];
        if (cp === 0) {
          var ri = (v * (rampLen - 1) + 0.5) | 0;
          if (ri < 1) continue;
          if (ri > rampLen - 1) ri = rampLen - 1;
          cp = ramp.charCodeAt(ri);
          if (cp === 32) continue;
        }
        var packed = cellCol[i];
        if (packed >= 0) {
          ctx.fillStyle = 'rgb(' + ((packed >> 16) & 255) + ',' +
            ((packed >> 8) & 255) + ',' + (packed & 255) + ')';
        } else {
          // theme ink, scaled by brightness so it matches the atlas path's feel
          var b = v;
          ctx.fillStyle = 'rgb(' + ((ink[0]*b)|0) + ',' + ((ink[1]*b)|0) + ',' + ((ink[2]*b)|0) + ')';
        }
        // CRISP PIXEL BLOCKS — a monospace '█' only fills ~0.6 of the cell width
        // (vertical gutters => thin bars), so draw real filled squares. Leave a
        // small gap so the block grid reads as separated squares (like the ref);
        // '▓' depth cells inset more so the recessed 3D side shows its structure.
        var rx = Math.round(x * cpw), ry = Math.round(y * cph);
        var rw = Math.round((x + 1) * cpw) - rx, rh = Math.round((y + 1) * cph) - ry;
        var g = rw < 5 ? 1 : Math.round(rw * 0.16);
        if (cp === 0x2593) { g = rw < 6 ? 2 : Math.round(rw * 0.30); }
        ctx.fillRect(rx, ry, rw - g, rh - g);
      }
    }
  }

  /* ====================================================================
     COPY-AS-TEXT + EXPORTS — the headline superpower. The character buffer
     (lum[]/glyph[]) is the source of truth, so the grid IS real text.
     ==================================================================== */

  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }

  // walk the current grid -> a plain-text string (trailing whitespace trimmed
  // per row, rows joined by newlines). ramp index 0 == blank/space.
  function gridToText() {
    var ramp = rampString();
    var rampLen = ramp.length;
    var out = [];
    for (var y = 0; y < rows; y++) {
      var line = '';
      for (var x = 0; x < cols; x++) {
        var idx = y * cols + x;
        var cp = glyph[idx];
        var chr;
        if (cp) {
          chr = String.fromCodePoint(cp);
        } else {
          var ri = Math.floor(clamp01(lum[idx]) * rampLen);
          if (ri < 0) ri = 0; if (ri > rampLen - 1) ri = rampLen - 1;
          chr = ramp.charAt(ri);
        }
        line += chr;
      }
      out.push(line.replace(/\s+$/, ''));
    }
    return out.join('\n');
  }

  // ANSI-coloured text: per cell emit \x1b[38;2;R;G;Bm scaled by brightness so
  // the glow survives; reset each line + the whole file.
  function gridToAnsi() {
    var ramp = rampString();
    var rampLen = ramp.length;
    var ink = COLOURS[state.colour].ink;
    var out = '';
    for (var y = 0; y < rows; y++) {
      var line = '';
      for (var x = 0; x < cols; x++) {
        var idx = y * cols + x;
        var v = clamp01(lum[idx]);
        var cp = glyph[idx];
        var chr;
        if (cp) {
          chr = String.fromCodePoint(cp);
        } else {
          var ri = Math.floor(v * rampLen);
          if (ri < 0) ri = 0; if (ri > rampLen - 1) ri = rampLen - 1;
          chr = ramp.charAt(ri);
        }
        var r, g, bl;
        // words-3d per-cell colour: emit the cell's OWN truecolour so the coloured
        // 3D blocks survive into a terminal (face = full, side = pre-darkened).
        if (colActive && cellCol && cellCol[idx] >= 0) {
          var pk = cellCol[idx];
          r = (pk >> 16) & 255; g = (pk >> 8) & 255; bl = pk & 255;
        } else {
          var b = 0.35 + 0.65 * v;
          r = Math.round(ink[0] * b); g = Math.round(ink[1] * b); bl = Math.round(ink[2] * b);
        }
        line += '\x1b[38;2;' + r + ';' + g + ';' + bl + 'm' + chr;
      }
      out += line + '\x1b[0m\n';
    }
    return out + '\x1b[0m';
  }

  function stamp() {
    var d = new Date();
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' +
           p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
  }
  function fname(ext) { return 'ascii-' + state.engine + '-' + stamp() + '.' + ext; }

  function downloadBlob(blob, name) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }

  function copyText(str, okMsg) {
    function fallback() {
      try {
        var ta = document.createElement('textarea');
        ta.value = str;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if (ok) toast(okMsg); else toast('copy failed');
      } catch (e) { toast('copy failed'); }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(str).then(function () { toast(okMsg); }, fallback);
    } else {
      fallback();
    }
  }

  function doCopy() {
    copyText(gridToText(), 'copied ' + cols + 'x' + rows);
  }

  var REC_SUPPORTED = !!(typeof MediaRecorder !== 'undefined' &&

  /* ---------- main loop ---------- */

  var rafId = 0, last = 0;

  function step(dt) {

    var tiltX = 0, tiltY = 0;
    if (pointer.active) {
      tiltX = Math.max(-1, Math.min(1, (pointer.x / vw) * 2 - 1));
      tiltY = Math.max(-1, Math.min(1, (pointer.y / vh) * 2 - 1));
    }
    var sp = state.speed;
    colActive = false;   // default: single-ink atlas path (words-3d re-enables it)
    if (state.mode === 'words') {
      if (state.wordFill === 'solid') Words.renderSolid();
      else if (state.wordFill === '3d') Words.render3d();
      else Words.renderFill(dt * sp, state.wordFill, tiltX, tiltY);
    }
    else if (state.mode === 'image')   Image_.render(dt);
    else if (state.engine === 'donut') Donut.render(dt * sp, tiltX, tiltY);
    else if (state.engine === 'matrix') Matrix.render(dt * sp);
    else                                Plasma.render(dt * sp);
    paint();
  }

  function loop(now) {
    var dt = last ? Math.min(0.05, (now - last) / 1000) : 0.016;
    last = now;

  // reduced-motion: render exactly ONE deterministic, content-rich static frame.
  // Donut angles are pinned to an absolute sim time so the frame is identical on
  // every re-render (no creeping rotation from repeated pointermove/resize).
  // Matrix gets a real settle so columns are seeded INTO view (not a blank field)
  // and plasma is advanced to a developed (non-faint) phase.
  function renderStaticFrame() {
    var tiltX = 0, tiltY = 0; // ignore pointer for a deterministic frame
    colActive = false;
    if (state.mode === 'words') {
      // reduced-motion words: solid is naturally static; an engine-fill renders
      // ONE settled static frame (developed phase) then cuts to the letter mask.
      if (state.wordFill === 'solid') {
        Words.renderSolid();
      } else if (state.wordFill === '3d') {
        Words.render3d();
      } else if (state.wordFill === 'matrix') {
        Matrix.reset(); Matrix.render(0.4); Words.applyMask();
      } else if (state.wordFill === 'donut') {

      } else {
        Plasma.setTime(3.0); Plasma.render(0); Words.applyMask();
      }
    } else if (state.mode === 'image') {
      Image_.render(0);         // static sample (recomputes if dirty)
    } else if (state.engine === 'donut') {
      Donut.setTime(1.2);       // fixed absolute time -> stable A,B
      Donut.render(0, tiltX, tiltY);
    } else if (state.engine === 'matrix') {
      Matrix.reset();           // re-prime the full-height field
      Matrix.render(0.4);       // larger settle step advances heads into view
    } else {
      Plasma.setTime(3.0);      // fixed developed phase (deterministic)

  /* ---------- URL hash wiring — FULL-STATE share hash (append-only) ----------
     keys: e=engine c=charset k=colour sp=speed(0..200) ce=cell(7..22)
           ct=contrast(40..220) sd=seed(integer). readHash() reads ALL keys with
     current defaults when absent; writeHash() writes the full state but TRIMS
     any key equal to its default, so old #e=&c=&k= links still load and new
     links stay short + back-compatible. */

  var charsetFromHash = false; // did the URL explicitly pin a ramp?

  function clampInt(v, lo, hi) {
    v = parseInt(v, 10);
    if (!isFinite(v)) return null;
    if (v < lo) v = lo; if (v > hi) v = hi;
    return v;
  }

  function readHash() {
    var h = (location.hash || '').replace(/^#/, '');
    charsetFromHash = false;
    var wordFromHash = false;   // did the URL pin a word? (implies words mode)
    if (!h) {
      // no hash: default the donut engine to its canonical 'donut' ramp
      state.mode = (state.engine === 'image') ? 'image' : 'generative';
      if (state.engine === 'donut') state.charset = 'donut';
      return;
    }
    var parts = h.split('&');
    for (var i = 0; i < parts.length; i++) {
      var kv = parts[i].split('=');
      var k = kv[0], val = kv[1];
      if (k === 'e' && (val === 'donut' || val === 'matrix' || val === 'plasma' || val === 'image')) state.engine = val;
      else if (k === 'iv') state.invert = (val === '1');
      else if (k === 'c' && CHARSETS[val]) { state.charset = val; charsetFromHash = true; }
      else if (k === 'k' && COLOURS[val]) state.colour = val;
      else if (k === 'sp') { var sp = clampInt(val, 0, 200); if (sp !== null) state.speed = sp / 100; }
      else if (k === 'ce') { var ce = clampInt(val, 5, 22); if (ce !== null) state.cell = ce; }
      else if (k === 'ct') { var ct = clampInt(val, 40, 220); if (ct !== null) state.contrast = ct / 100; }
      else if (k === 'sd') { var sd = parseInt(val, 10); if (isFinite(sd)) state.seed = sd | 0; }
      else if (k === 'w') { try { state.word = decodeURIComponent(val || ''); } catch (e) { state.word = val || ''; } wordFromHash = true; }
      else if (k === 'wf') { if (val === 'solid' || val === '3d' || val === 'matrix' || val === 'plasma' || val === 'donut') state.wordFill = val; }
      else if (k === 'wp') { if (WORD_PALETTES.hasOwnProperty(val)) state.wordPal = val; }
    }
    // top-level MODE: an explicit word pins WORDS mode; else image render => image;
    // else generative. (back-compat: old #e=image links still resolve to image.)
    if (wordFromHash) state.mode = 'words';
    else state.mode = (state.engine === 'image') ? 'image' : 'generative';
    // donut with no explicit ramp -> canonical donut ramp
    if (state.engine === 'donut' && !charsetFromHash) state.charset = 'donut';
  }

  var hashWriteTimer = 0;
  function buildHash() {
    // current full state in hash units; trim any key equal to its default.
    var sp = Math.round(state.speed * 100);
    var ct = Math.round(state.contrast * 100);
    var cur = {
      e:  state.engine,
      c:  state.charset,
      k:  state.colour,
      sp: sp,
      ce: state.cell,
      ct: ct,
      sd: state.seed | 0
    };
    var def = { e:DEFAULTS.engine, c:DEFAULTS.charset, k:DEFAULTS.colour,
                sp:DEFAULTS.speed, ce:DEFAULTS.cell, ct:DEFAULTS.contrast, sd:DEFAULTS.seed };
    var order = ['e', 'c', 'k', 'sp', 'ce', 'ct', 'sd'];
    var out = [];
    for (var i = 0; i < order.length; i++) {
      var key = order[i];
      if (cur[key] !== def[key]) out.push(key + '=' + cur[key]);
    }
    // invert is image-only; append iv=1 only when set (default false -> omitted)
    if (state.invert) out.push('iv=1');
    // words-mode keys: w=<word> implies words mode on read; wf=<fill> only when
    // non-default. (Appended after the legacy keys so old links stay back-compat.)
    if (state.mode === 'words') {
      out.push('w=' + encodeURIComponent(state.word == null ? '' : state.word));
      if (state.wordFill !== 'solid') out.push('wf=' + state.wordFill);
      // palette only matters for the 3d fill; trim the default 'mono'.

  /* ---------- rotary knobs — a tactile dark-metal dial layered over a hidden
     range input. Ported from Fluid: pointer drag (vertical, up = increase) turns
     the value; the indicator rotates over a 270° sweep with a gap at the bottom.
     Driving the native input (set .value + dispatch a real 'input' event) reuses
     EVERY existing path — the slider 'input' handlers fire, state + writeHash run
     exactly as before. Keyboard arrows hit the real range input directly. ---- */
  var knobRefreshers = [];
  function refreshKnobs() {
    for (var i = 0; i < knobRefreshers.length; i++) knobRefreshers[i]();
  }
  function makeKnob(knobEl) {
    var input = document.getElementById(knobEl.getAttribute('data-for'));
    if (!input) return;
    var dial = knobEl.querySelector('.knob-dial');
    var min = parseFloat(input.min), max = parseFloat(input.max);
    var step = parseFloat(input.step) || 1;
    var START = -135, SWEEP = 270;   // 270° sweep, gap centred at the bottom

    function refresh() {
      var frac = (parseFloat(input.value) - min) / (max - min || 1);
      frac = Math.max(0, Math.min(1, frac));
      dial.style.transform = 'rotate(' + (START + frac * SWEEP) + 'deg)';
      knobEl.setAttribute('aria-valuenow', input.value);
      knobEl.setAttribute('aria-valuemin', input.min);
      knobEl.setAttribute('aria-valuemax', input.max);
    }
    function commit(v) {
      v = Math.max(min, Math.min(max, v));
      if (step) v = Math.round(v / step) * step;
      v = Math.max(min, Math.min(max, v));
      if (String(v) !== input.value) {
        input.value = String(v);
        input.dispatchEvent(new Event('input', { bubbles: true }));
      }
      refresh();
    }
    // ANGULAR positioning (Fluid's model): the value follows the pointer's ANGLE
    // about the knob centre, measured clockwise from 12 o'clock across the 270°
    // sweep — click/drag anywhere around the dial and it turns straight to that
    // angle (click a spot to jump to it). Move/up bind to the WINDOW so the drag
    // tracks anywhere on screen; wheel adjusts too.
    function setFromPoint(cx, cy) {
      var r = knobEl.getBoundingClientRect();
      var dx = cx - (r.left + r.width / 2), dy = cy - (r.top + r.height / 2);
      if (!dx && !dy) return;
      var deg = Math.atan2(dx, -dy) * 180 / Math.PI;   // 0 at top, clockwise positive
      if (deg > 135) deg = 135; else if (deg < -135) deg = -135;
      commit(min + ((deg - START) / SWEEP) * (max - min));
    }
    var dragging = false;
    function onMove(e) {
      if (!dragging) return;
      setFromPoint(e.clientX, e.clientY);
      e.preventDefault();
    }
    function onUp() {
      if (!dragging) return;
      dragging = false;
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('pointercancel', onUp);
      input.dispatchEvent(new Event('change', { bubbles: true }));
    }
    knobEl.addEventListener('pointerdown', function (e) {
      dragging = true;
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
      window.addEventListener('pointercancel', onUp);
      knobEl.focus();
      setFromPoint(e.clientX, e.clientY);   // jump straight to the clicked angle
      e.preventDefault();
    });
    knobEl.addEventListener('wheel', function (e) {
      e.preventDefault();
      commit(parseFloat(input.value) + (e.deltaY < 0 ? 1 : -1) * step * (e.shiftKey ? 10 : 1));
    }, { passive: false });
    // keyboard on the dial mirrors the range (the real input also stays reachable)
    knobEl.addEventListener('keydown', function (e) {
      var d = 0;
      if (e.key === 'ArrowUp' || e.key === 'ArrowRight') d = step;
      else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') d = -step;
      else if (e.key === 'Home') { commit(min); e.preventDefault(); return; }
      else if (e.key === 'End') { commit(max); e.preventDefault(); return; }
      else return;
      commit(parseFloat(input.value) + d);
      e.preventDefault();
    });
    input.addEventListener('input', refresh);
    knobRefreshers.push(refresh);
    refresh();
  }

    // can click the thumbnail to return to it. No surprise clearing. Looks are a
    // generative concept, so they also return the top-level mode to generative.

  // any loaded image (the thumbnail just stops reading "active"). The 'image'
  // render is activated from the IMAGE section (thumbnail / load); it requires a
  // loaded image (a bare e=image hash with no bytes falls back to a generative
  // engine instead of a blank stage).
  function setEngine(e) {
    if (GEN_ENGINES[e]) lastGenEngine = e;

      // on a generative engine.
