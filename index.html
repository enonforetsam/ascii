<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASCII — everything is characters</title>
<meta name="description" content="ASCII is a text-native generative art instrument. Where Fluid renders pixels, ASCII renders characters — a phosphor-green CRT terminal where everything is glyphs.">
<meta name="theme-color" content="#05080a">
<meta property="og:title" content="ASCII — everything is characters">
<meta property="og:description" content="A text-native generative art instrument. Everything is characters.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ascii.krackeddevs.com/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305080a'/%3E%3Ctext x='16' y='23' font-family='monospace' font-size='22' font-weight='700' text-anchor='middle' fill='%2339ff7a'%3E%3E%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --mono:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    /* ---- theme tokens (phosphor default). Each theme sets only --bg/--bg-rgb
       and --ink/--ink-rgb (+ a couple of overrides); ALL chrome colours derive
       from those, so swapping a theme recolours the whole instrument — not just
       the canvas glyphs. ---- */
    --bg:#05080a;  --bg-rgb:5,8,10;
    --ink:#39ff7a; --ink-rgb:57,255,122;
    --ink-dim:#1f8f47;
    --glow:0 0 4px rgba(var(--ink-rgb),.55), 0 0 12px rgba(var(--ink-rgb),.28);
    --ctl-glow:0 0 8px rgba(var(--ink-rgb),.35);
    --scan-op:.7;
    /* derived — re-resolve automatically when --ink-rgb / --bg-rgb change */
    --ink-faint:rgba(var(--ink-rgb),.34);
    --tab-bg:rgba(var(--ink-rgb),.06);
    --tab-bg-hover:rgba(var(--ink-rgb),.16);
    --tab-bg-on:rgba(var(--ink-rgb),.24);
    /* width of the Fluid-style left rail; collapses to 0 when hidden/mobile */
    --panel-w:clamp(224px, 23vw, 300px);
  }
  body[data-theme="amber"]{
    --bg:#0a0600;  --bg-rgb:10,6,0;
    --ink:#ffb026; --ink-rgb:255,176,38;
    --ink-dim:#b87d1a;
    --scan-op:.6;
  }
  body[data-theme="paper"]{
    --bg:#e7e8e2;  --bg-rgb:231,232,226;
    --ink:#13271b; --ink-rgb:19,39,27;
    --ink-dim:#3a5244;
    --glow:none;
    --ctl-glow:none;
    --scan-op:.16;
    --tab-bg:rgba(var(--ink-rgb),.05);
    --tab-bg-hover:rgba(var(--ink-rgb),.12);
    --tab-bg-on:rgba(var(--ink-rgb),.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--mono);
    overflow:hidden;
    position:relative;
    text-shadow:var(--glow);
  }

  /* the STAGE — offset by the left rail so the art lives BESIDE the panel,
     never under it. <canvas> is a replaced element (intrinsic 300x150), so
     left+right+top+bottom alone DON'T stretch it — give it an explicit size:
     width = viewport minus the rail, height = full viewport. */
  #art{
    position:fixed;
    left:var(--panel-w);
    top:0;
    width:calc(100% - var(--panel-w));
    height:100%;
    display:block;
    z-index:0;
  }

  .vignette{
    position:fixed;
    left:var(--panel-w);
    right:0;
    top:0;
    bottom:0;
    z-index:1;
    pointer-events:none;
    background:radial-gradient(120% 100% at 50% 50%,
      rgba(var(--bg-rgb),0) 42%,
      rgba(var(--bg-rgb),.45) 80%,
      rgba(var(--bg-rgb),.9) 100%);
  }

  /* Fluid-style LEFT RAIL — a fixed-width vertical control column pinned to the
     left edge, full height, internal scroll, border-right. The wordmark sits at
     the top; controls stack below. */
  .topbar{
    position:fixed;
    left:0;top:0;bottom:0;
    width:var(--panel-w);
    z-index:4;
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:14px;
    padding:16px 16px 14px;
    overflow-y:auto;
    overscroll-behavior:contain;
    border-right:1px solid var(--ink-faint);
    background:
      linear-gradient(rgba(var(--ink-rgb),.03), rgba(var(--ink-rgb),.03)),
      rgba(var(--bg-rgb),.78);
    backdrop-filter:blur(3px);
    -webkit-backdrop-filter:blur(3px);
  }
  h1.wordmark{
    font-size:18px;
    font-weight:700;
    letter-spacing:.16em;
    line-height:1;
    text-shadow:var(--glow);
    white-space:nowrap;
    flex:0 0 auto;
  }
  .wordmark .blip{
    display:inline-block;
    width:.5em;height:.86em;
    margin-left:.18em;
    vertical-align:-.08em;
    background:var(--ink);
    box-shadow:var(--glow);
    animation:blink 1.05s steps(1,end) infinite;
  }
  @keyframes blink{50%{opacity:0}}
  .sub{
    font-size:10px;
    letter-spacing:.34em;
    text-transform:uppercase;
    opacity:.62;
    white-space:nowrap;
    flex:0 0 auto;
  }
  @media (max-width:720px){ .sub{display:none} }

  /* controls — stacked vertically inside the rail */
  .controls{
    margin-left:0;
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:14px;
    justify-content:flex-start;
  }
  .group{
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:6px;
  }
  .group > .lab{
    font-size:9px;
    letter-spacing:.22em;
    text-transform:uppercase;
    opacity:.6;
    user-select:none;
  }

  /* tab + button — all >=32px hit targets */
  .tabs{ display:flex; flex-wrap:wrap; gap:3px; }
  .tab, .btn{
    appearance:none;
    -webkit-appearance:none;
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:.06em;
    color:var(--ink);
    background:var(--tab-bg);
    border:1px solid var(--ink-faint);
    min-height:32px;
    min-width:32px;
    padding:0 11px;
    cursor:pointer;
    text-shadow:none;
    border-radius:2px;
    transition:background .12s, border-color .12s;
  }
  .tab:hover, .btn:hover{ background:var(--tab-bg-hover); }
  .tab[aria-pressed="true"]{
    background:var(--tab-bg-on);
    border-color:var(--ink);
    box-shadow:var(--ctl-glow);
  }

  select{
    appearance:none;
    -webkit-appearance:none;
    font-family:var(--mono);
    font-size:12px;
    color:var(--ink);
    background:var(--tab-bg);
    border:1px solid var(--ink-faint);
    min-height:32px;
    padding:0 26px 0 9px;
    cursor:pointer;
    border-radius:2px;
    text-shadow:none;
    background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);
    background-position:calc(100% - 14px) 13px, calc(100% - 9px) 13px;
    background-size:5px 5px,5px 5px;
    background-repeat:no-repeat;
  }

  /* sliders — stacked full-width inside the rail */
  .group.sliders{
    flex-direction:column;
    align-items:stretch;
    gap:8px;
  }
  .slider{
    display:flex;
    align-items:center;
    gap:7px;
  }
  .slider label{
    font-size:9px;
    letter-spacing:.18em;
    text-transform:uppercase;
    opacity:.62;
    white-space:nowrap;
  }
  .slider .val{
    font-size:11px;
    font-variant-numeric:tabular-nums;
    min-width:2.4em;
    text-align:right;
    opacity:.82;
    white-space:nowrap;
  }
  input[type="range"]{
    -webkit-appearance:none;
    appearance:none;
    width:auto;
    flex:1;
    min-width:0;
    height:32px;
    background:transparent;
    cursor:pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track{
    height:2px;
    background:var(--ink-faint);
  }
  input[type="range"]::-moz-range-track{
    height:2px;
    background:var(--ink-faint);
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    appearance:none;
    width:12px;height:12px;
    margin-top:-5px;
    border-radius:50%;
    background:var(--ink);
    box-shadow:var(--ctl-glow);
  }
  input[type="range"]::-moz-range-thumb{
    width:12px;height:12px;
    border:none;border-radius:50%;
    background:var(--ink);
    box-shadow:var(--ctl-glow);
  }

  /* uniform, always-visible focus ring */
  .tab:focus-visible, .btn:focus-visible, select:focus-visible, input:focus-visible{
    outline:2px solid var(--ink);
    outline-offset:2px;
  }

  /* hide-bar toggle pinned bottom-right so the bar can vanish for clean view */
  .reveal{
    position:fixed;
    right:12px;bottom:12px;
    z-index:4;
    display:none;
  }
  /* hidden state: collapse the rail to 0 so the stage expands full-width */
  body.barhidden{ --panel-w:0px; }
  body.barhidden .topbar{ display:none; }
  body.barhidden .reveal{ display:block; }

  footer{
    position:fixed;
    left:var(--panel-w);right:0;bottom:0;
    z-index:4;
    display:flex;
    justify-content:space-between;
    gap:16px;
    padding:10px 14px;
    font-size:10px;
    letter-spacing:.16em;
    color:var(--ink-faint);
    text-shadow:none;
    pointer-events:none;
  }
  footer span{white-space:nowrap}
  body.barhidden footer{ display:none; }

  .scanlines{
    position:fixed;
    left:var(--panel-w);
    right:0;
    top:0;
    bottom:0;
    z-index:3;
    pointer-events:none;
    background:repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,.16) 3px,
      rgba(0,0,0,.16) 4px
    );
    mix-blend-mode:multiply;
    opacity:var(--scan-op);
  }

  @media (prefers-reduced-motion: reduce){
    .wordmark .blip{animation:none}
  }

  /* MOBILE — the rail becomes a full-width top strip (a translucent overlay) over
     a full-bleed stage. Groups stay vertical so chips always wrap; nothing can
     overflow horizontally. The strip scrolls internally if tall. */
  @media (max-width:680px){
    :root{ --panel-w:0px; }              /* stage goes full-bleed under the strip */
    .topbar{
      right:0; bottom:auto;
      width:auto; height:auto;
      max-height:64vh;
      border-right:none;
      border-bottom:1px solid var(--ink-faint);
    }
    .controls{ gap:12px; }
  }
</style>
</head>
<body>
<canvas id="art" aria-hidden="true"></canvas>
<div class="vignette"></div>

<header class="topbar">
  <h1 class="wordmark">ASCII<span class="blip" aria-hidden="true"></span></h1>
  <span class="sub">everything is characters</span>

  <div class="controls" role="group" aria-label="Instrument controls">
    <div class="group">
      <span class="lab" id="lab-engine">Engine</span>
      <div class="tabs" role="group" aria-labelledby="lab-engine">
        <button class="tab" id="eng-donut" data-engine="donut" type="button" aria-pressed="true">donut</button>
        <button class="tab" id="eng-matrix" data-engine="matrix" type="button" aria-pressed="false">matrix</button>
        <button class="tab" id="eng-plasma" data-engine="plasma" type="button" aria-pressed="false">plasma</button>
      </div>
    </div>

    <div class="group">
      <span class="lab" id="lab-charset">Charset</span>
      <div class="tabs seg ramp" id="seg-charset" role="group" aria-labelledby="lab-charset">
        <button class="tab" data-ramp="standard" type="button" aria-pressed="true" aria-label="standard ramp">standard</button>
        <button class="tab" data-ramp="blocks" type="button" aria-pressed="false" aria-label="blocks ramp">blocks</button>
        <button class="tab" data-ramp="dots" type="button" aria-pressed="false" aria-label="dots ramp">dots</button>
        <button class="tab" data-ramp="binary" type="button" aria-pressed="false" aria-label="binary ramp">binary</button>
        <button class="tab" data-ramp="donut" type="button" aria-pressed="false" aria-label="donut ramp">donut</button>
      </div>
    </div>

    <div class="group">
      <span class="lab" id="lab-colour">Colour</span>
      <div class="tabs seg colour" id="seg-colour" role="group" aria-labelledby="lab-colour">
        <button class="tab" data-colour="phosphor" type="button" aria-pressed="true" aria-label="phosphor colour">phosphor</button>
        <button class="tab" data-colour="amber" type="button" aria-pressed="false" aria-label="amber colour">amber</button>
        <button class="tab" data-colour="paper" type="button" aria-pressed="false" aria-label="paper colour">paper</button>
      </div>
    </div>

    <div class="group sliders">
      <div class="slider">
        <label for="sl-speed">Speed</label>
        <input type="range" id="sl-speed" min="0" max="200" value="100" aria-label="Speed" aria-valuetext="100 percent">
        <span class="val" id="val-speed">100</span>
      </div>
      <div class="slider">
        <label for="sl-cell">Cell</label>
        <input type="range" id="sl-cell" min="7" max="22" value="12" aria-label="Cell size in pixels" aria-valuetext="12 pixels">
        <span class="val" id="val-cell">12</span>
      </div>
      <div class="slider">
        <label for="sl-contrast">Contrast</label>
        <input type="range" id="sl-contrast" min="40" max="220" value="100" aria-label="Contrast" aria-valuetext="100 percent">
        <span class="val" id="val-contrast">100</span>
      </div>
    </div>

    <button class="btn" id="btn-hide" type="button" aria-pressed="false" aria-label="Hide control bar for a clean view">hide</button>
  </div>
</header>

<button class="btn reveal" id="btn-show" type="button" aria-label="Show control bar">controls</button>

<footer>
  <span>M1 · donut / matrix / plasma</span>
  <span>ascii.krackeddevs.com</span>
</footer>

<div class="scanlines" aria-hidden="true"></div>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('art');
  var ctx = canvas.getContext('2d', { alpha: false });
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- configuration tables ---------- */

  // ramps go DARK -> BRIGHT; index 0 is treated as blank (skipped at render)
  var CHARSETS = {
    standard: ' .:-=+*#%@',
    blocks:   ' .:░▒▓█',
    dots:     ' .·:•',
    binary:   ' 01',
    donut:    ' .,-~:;=!*#$@'
  };

  // matrix uses its own glyph set (katakana + latin + symbols), forced per cell
  var MATRIX_GLYPHS =
    'アイウエオカキクケコサシスセソ' +
    'タチツテトナニヌネノハヒフヘホ' +
    '0123456789<>=*+-/\\|:;ABCDEFGHKLMNPRSTUXYZ';

  var COLOURS = {
    phosphor: { bg:'#05080a', ink:[57,255,122],  paper:false },
    amber:    { bg:'#0a0600', ink:[255,176,38],   paper:false },
    paper:    { bg:'#e4e6e0', ink:[18,40,24],      paper:true  }
  };

  /* ---------- live state ---------- */

  var state = {
    engine:  'donut',
    charset: 'standard',
    colour:  'phosphor',
    speed:   1.0,    // 0..2 multiplier
    cell:    12,     // logical px per cell
    contrast:1.0     // 0.4..2.2 gamma-ish multiplier
  };

  // grid + reusable typed arrays (the character buffer — source of truth)
  var dpr = 1, cw = 12, ch = 12, cols = 0, rows = 0, gridN = 0;
  // stage geometry (the canvas rect, NOT the window) — left rail offset aware
  var rectL = 0, rectT = 0, vw = 1, vh = 1;
  var lum = null;     // Float32Array, 0..1 intensity per cell
  var glyph = null;   // Uint32Array, forced code point per cell; 0 => derive from ramp

  var pointer = { x: -1, y: -1, gx: -1, gy: -1, active: false };

  /* ---------- glyph atlas ---------- */
  // Pre-bake the active ramp (and matrix set when needed) into an offscreen
  // canvas at cell size, in the ink colour. We bake the glyph at full ink and
  // quantize brightness via globalAlpha steps at blit time (limits state churn).

  var atlas = document.createElement('canvas');
  var actx = atlas.getContext('2d');
  var atlasMap = {};        // codepoint -> column index in atlas
  var atlasList = [];       // ordered codepoints baked
  var atlasDirty = true;

  function rampString() { return CHARSETS[state.charset] || CHARSETS.standard; }

  function buildAtlas() {
    var ink = COLOURS[state.colour].ink;
    var inkCss = 'rgb(' + ink[0] + ',' + ink[1] + ',' + ink[2] + ')';

    // collect the glyph set we need: the ramp always, plus matrix glyphs when
    // the matrix engine is active (it forces code points).
    var set = [];
    var seen = {};
    function add(cp) {
      if (cp === 32 || seen[cp]) return; // skip space + dupes
      seen[cp] = true; set.push(cp);
    }
    var ramp = rampString();
    for (var i = 0; i < ramp.length; i++) add(ramp.charCodeAt(i));
    if (state.engine === 'matrix') {
      for (var j = 0; j < MATRIX_GLYPHS.length; j++) add(MATRIX_GLYPHS.charCodeAt(j));
    }

    atlasList = set;
    atlasMap = {};
    var n = set.length;

    var tileW = Math.max(1, Math.ceil(cw * dpr));
    var tileH = Math.max(1, Math.ceil(ch * dpr));
    atlas.width  = Math.max(1, tileW * n);
    atlas.height = tileH;

    actx.setTransform(1, 0, 0, 1, 0, 0);
    actx.clearRect(0, 0, atlas.width, atlas.height);
    actx.font = '700 ' + Math.round(ch * dpr * 0.96) + 'px ' +
      'ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace';
    actx.textBaseline = 'middle';
    actx.textAlign = 'center';
    actx.fillStyle = inkCss;
    for (var k = 0; k < n; k++) {
      atlasMap[set[k]] = k;
      actx.fillText(String.fromCharCode(set[k]), k * tileW + tileW / 2, tileH / 2 + tileH * 0.02);
    }
    atlasDirty = false;
  }

  /* ---------- grid sizing ---------- */

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    // measure the CANVAS (CSS sizes it via the left+right offsets), not the
    // window — so the stage is the area BESIDE the rail. Store rect for pointer
    // mapping and donut tilt.
    var r = canvas.getBoundingClientRect();
    rectL = r.left; rectT = r.top;
    vw = Math.max(1, r.width); vh = Math.max(1, r.height);
    var w = vw, h = vh;

    // only set the BITMAP from the measured CSS size; let CSS own the element box
    canvas.width  = Math.max(1, Math.floor(w * dpr));
    canvas.height = Math.max(1, Math.floor(h * dpr));

    cw = state.cell;
    ch = state.cell;
    cols = Math.max(1, Math.ceil(w / cw));
    rows = Math.max(1, Math.ceil(h / ch));
    gridN = cols * rows;

    lum = new Float32Array(gridN);
    glyph = new Uint32Array(gridN);

    // reset per-engine state that depends on grid dims
    Matrix.reset();
    Donut.reset();

    atlasDirty = true;
  }

  /* ====================================================================
     ENGINE 1 — DONUT  (Andy Sloane donut.c, ported to a lum/z-buffer grid)
     A torus of tube radius R1 around centre radius R2, rotated by angles
     A (about X) and B (about Z), projected with ooz=1/z into grid cells.
     A per-cell z-buffer resolves occlusion; lum = clamped N.L.
     ==================================================================== */
  var Donut = (function () {
    var simT = 0;               // absolute accumulated sim time (seconds)
    var zbuf = null;            // 1/z per cell (larger = nearer)
    var R1 = 1.0, R2 = 2.0;     // tube radius, centre radius
    var K1auto = 1;             // projection scale, set from grid

    function reset() {
      zbuf = new Float32Array(gridN);
    }

    // pin absolute sim time (used by the reduced-motion static frame so the
    // donut is deterministic and identical on every re-render).
    function setTime(t) { simT = t; }

    // angles are a PURE function of absolute time + pointer offset, so the
    // reduced-motion frame (fixed simT) is deterministic and identical on every
    // re-render, and the pointer AIMS the donut (bounded offset) instead of
    // accelerating its spin.
    function render(dt, tiltX, tiltY) {
      simT += dt;
      var A = simT * 0.9 + tiltY * 2.4;
      var B = simT * 0.45 + tiltX * 2.4;

      // clear buffers
      lum.fill(0);
      glyph.fill(0);
      if (!zbuf || zbuf.length !== gridN) zbuf = new Float32Array(gridN);
      zbuf.fill(0);

      // projection constants. K2 pushes the donut away from the eye; K1 scales
      // the projection so the donut fills a sensible fraction of the grid.
      var K2 = 5.0;
      // monospace cells are ~2x taller than wide; aspect corrects Y so the
      // donut reads round, not squashed.
      var aspect = 0.5;
      var K1 = Math.min(cols, rows / aspect) * K2 * 0.30 / (R1 + R2);

      var cosA = Math.cos(A), sinA = Math.sin(A);
      var cosB = Math.cos(B), sinB = Math.sin(B);

      var halfC = cols / 2, halfR = rows / 2;

      // theta sweeps the tube cross-section, phi sweeps around the centre.
      // step counts trade detail vs cost; chosen to overfill the grid.
      var thetaStep = 0.07, phiStep = 0.02;
      for (var theta = 0; theta < 6.283185; theta += thetaStep) {
        var ct = Math.cos(theta), st = Math.sin(theta);
        for (var phi = 0; phi < 6.283185; phi += phiStep) {
          var cp = Math.cos(phi), sp = Math.sin(phi);

          // point on the torus surface before world rotation
          var circleX = R2 + R1 * ct;   // distance from centre axis
          var circleY = R1 * st;

          // rotate about X by A then about Z by B (Sloane's composition)
          var x = circleX * (cosB * cp + sinA * sinB * sp) - circleY * cosA * sinB;
          var y = circleX * (sinB * cp - sinA * cosB * sp) + circleY * cosA * cosB;
          var z = K2 + cosA * circleX * sp + circleY * sinA;
          var ooz = 1 / z;   // 1/z, the depth key

          // project to grid cell; Y scaled by aspect so it isn't squashed
          var xp = (halfC + K1 * ooz * x) | 0;
          var yp = (halfR - K1 * aspect * ooz * y) | 0;

          if (xp < 0 || xp >= cols || yp < 0 || yp >= rows) continue;

          // surface normal . light. Light points up/back: (0,1,-1)/sqrt2.
          var L = cp * ct * sinB - cosA * ct * sp - sinA * st +
                  cosB * (cosA * st - ct * sinA * sp);
          // L = N.L in [-sqrt2, sqrt2]; only lit (front) faces draw
          if (L > 0) {
            var idx = yp * cols + xp;
            if (ooz > zbuf[idx]) {        // nearer than what's already here
              zbuf[idx] = ooz;
              lum[idx] = L * 0.707;        // normalize to ~0..1
            }
          }
        }
      }
    }

    return { reset: reset, render: render, setTime: setTime };
  })();

  /* ====================================================================
     ENGINE 2 — MATRIX  (vertical falling-glyph columns)
     Per column a head row advances downward; the head is brightest, the
     tail fades over `len` cells, everything above is dark. Glyphs mutate
     occasionally; the cursor brightens nearby columns. Recycle off-bottom.
     ==================================================================== */
  var Matrix = (function () {
    var head = null, spd = null, len = null;
    var mGlyphCol = null;       // persistent per-cell glyph code, survives frames
    var cap = 0;

    function reset() {
      cap = cols;
      head = new Float32Array(cap);
      spd  = new Float32Array(cap);
      len  = new Int16Array(cap);
      // persistent glyph identities for every grid cell; seeded once so streams
      // read as stable characters that only occasionally mutate (not reborn
      // every frame). Survives across render() calls — never cleared wholesale.
      mGlyphCol = new Uint32Array(gridN);
      for (var i = 0; i < gridN; i++) mGlyphCol[i] = randGlyph();
      for (var c = 0; c < cap; c++) seed(c, true);
    }
    function seed(c, stagger) {
      // initial (stagger) heads scatter across the WHOLE screen (small overscan
      // above), so reset() pre-fills a dense, full-height field within ~1s of
      // load instead of dribbling in from offscreen. Recycle reseeds just above.
      head[c] = stagger ? (Math.random() * (rows + 12) - 6) : -Math.random() * 6;
      spd[c]  = 8 + Math.random() * 18;          // cells/sec
      len[c]  = 14 + (Math.random() * 26) | 0;   // tail length (14..40)
    }
    function randGlyph() {
      return MATRIX_GLYPHS.charCodeAt((Math.random() * MATRIX_GLYPHS.length) | 0);
    }

    function render(dt) {
      lum.fill(0);
      glyph.fill(0);
      if (!head || cap !== cols || !mGlyphCol || mGlyphCol.length !== gridN) reset();

      for (var c = 0; c < cols; c++) {
        head[c] += spd[c] * dt;
        var h = head[c];
        var tail = len[c];

        // pointer halo: columns near the cursor get a brightness boost
        var boost = 0;
        if (pointer.active && pointer.gx >= 0) {
          var d = Math.abs(c - pointer.gx);
          if (d < 6) boost = (1 - d / 6) * 0.5;
        }

        for (var t = 0; t < tail; t++) {
          var r = (h | 0) - t;
          if (r < 0 || r >= rows) continue;
          var idx = r * cols + c;
          var v;
          if (t === 0) v = 1.0;                       // bright head
          else v = Math.max(0, 1 - t / tail) * 0.85;  // fading trail
          v = Math.min(1, v + boost);
          if (v > lum[idx]) {
            lum[idx] = v;
            // persistent identity: head always mutates; the tail keeps its
            // standing glyph and only occasionally flips (~1.2%), so streams
            // stay stable across frames instead of shimmering all-new each frame.
            if (t === 0 || Math.random() < 0.012) mGlyphCol[idx] = randGlyph();
            glyph[idx] = mGlyphCol[idx];
          }
        }
        if ((h - tail) > rows) seed(c, false);
      }
    }

    return { reset: reset, render: render };
  })();

  /* ====================================================================
     ENGINE 3 — PLASMA  (normalized sum of sines over x,y,t)
     A smooth morphing scalar field mapped to lum (no glyph override; the
     ramp draws it). The cursor injects a radial ripple/attractor term.
     ==================================================================== */
  var Plasma = (function () {
    var phase = 0;

    function setTime(t) { phase = t; }

    function render(dt) {
      phase += dt;
      glyph.fill(0); // ramp-driven, no forced glyphs

      var t = phase;
      var a = 0.21, b = 0.17, cc = 0.13, d = 0.20;
      var cx = cols * 0.5, cy = rows * 0.5;
      var pgx = pointer.active ? pointer.gx : -999;
      var pgy = pointer.active ? pointer.gy : -999;

      var idx = 0;
      for (var y = 0; y < rows; y++) {
        for (var x = 0; x < cols; x++) {
          var v = Math.sin(x * a + t) +
                  Math.sin(y * b + t * 0.9) +
                  Math.sin((x + y) * cc + t * 1.1) +
                  Math.sin(Math.sqrt((x - cx) * (x - cx) + (y - cy) * (y - cy)) * d - t);
          // cursor ripple: a travelling ring radiating from the pointer
          if (pgx > -900) {
            var rr = Math.sqrt((x - pgx) * (x - pgx) + (y - pgy) * (y - pgy));
            v += Math.sin(rr * 0.55 - t * 3.0) * Math.exp(-rr * 0.05) * 2.0;
          }
          // 4 base sines span -4..4 (+ripple); normalize to 0..1
          lum[idx++] = (v + 6) / 12;
        }
      }
    }

    return { render: render, setTime: setTime };
  })();

  /* ---------- renderer: blit the atlas per non-blank cell ---------- */

  var ALPHA_STEPS = 6; // quantize brightness to N alpha tiers

  function paint() {
    var col = COLOURS[state.colour];
    var tileW = Math.max(1, Math.ceil(cw * dpr));
    var tileH = Math.max(1, Math.ceil(ch * dpr));

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = col.bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (atlasDirty) buildAtlas();

    var ramp = rampString();
    var rampLen = ramp.length;
    var gamma = state.contrast;
    var cpw = Math.max(1, cw * dpr);
    var cph = Math.max(1, ch * dpr);

    ctx.globalAlpha = 1;
    var prevAlpha = -1;
    var i = 0;
    for (var y = 0; y < rows; y++) {
      var py = Math.round(y * cph);
      for (var x = 0; x < cols; x++, i++) {
        var v = lum[i];
        if (v <= 0.001) continue;
        // contrast shaping
        if (gamma !== 1) v = Math.pow(v, 1 / gamma);
        if (v <= 0.004) continue;

        // pick the glyph: forced code point, or derive from ramp by lum
        var cp = glyph[i];
        if (cp === 0) {
          var ri = (v * (rampLen - 1) + 0.5) | 0;
          if (ri < 1) continue;            // ramp index 0 == blank
          if (ri > rampLen - 1) ri = rampLen - 1;
          cp = ramp.charCodeAt(ri);
          if (cp === 32) continue;         // space => blank
        }
        var tile = atlasMap[cp];
        if (tile === undefined) continue;

        // quantize alpha to limit state changes
        var aStep = (v * ALPHA_STEPS + 0.5) | 0;
        if (aStep < 1) aStep = 1;
        if (aStep > ALPHA_STEPS) aStep = ALPHA_STEPS;
        var alpha = aStep / ALPHA_STEPS;
        if (alpha !== prevAlpha) { ctx.globalAlpha = alpha; prevAlpha = alpha; }

        ctx.drawImage(
          atlas,
          tile * tileW, 0, tileW, tileH,
          Math.round(x * cpw), py, tileW, tileH
        );
      }
    }
    ctx.globalAlpha = 1;
  }

  /* ---------- main loop ---------- */

  var rafId = 0, last = 0;

  function step(dt) {
    // pointer-derived tilt for donut, in -1..1
    var tiltX = 0, tiltY = 0;
    if (pointer.active) {
      tiltX = Math.max(-1, Math.min(1, (pointer.x / vw) * 2 - 1));
      tiltY = Math.max(-1, Math.min(1, (pointer.y / vh) * 2 - 1));
    }
    var sp = state.speed;
    if (state.engine === 'donut')      Donut.render(dt * sp, tiltX, tiltY);
    else if (state.engine === 'matrix') Matrix.render(dt * sp);
    else                                Plasma.render(dt * sp);
    paint();
  }

  function loop(now) {
    var dt = last ? Math.min(0.05, (now - last) / 1000) : 0.016;
    last = now;
    step(dt);
    rafId = window.requestAnimationFrame(loop);
  }

  // reduced-motion: render exactly ONE deterministic, content-rich static frame.
  // Donut angles are pinned to an absolute sim time so the frame is identical on
  // every re-render (no creeping rotation from repeated pointermove/resize).
  // Matrix gets a real settle so columns are seeded INTO view (not a blank field)
  // and plasma is advanced to a developed (non-faint) phase.
  function renderStaticFrame() {
    var tiltX = 0, tiltY = 0; // ignore pointer for a deterministic frame
    if (state.engine === 'donut') {
      Donut.setTime(1.2);       // fixed absolute time -> stable A,B
      Donut.render(0, tiltX, tiltY);
    } else if (state.engine === 'matrix') {
      Matrix.reset();           // re-prime the full-height field
      Matrix.render(0.4);       // larger settle step advances heads into view
    } else {
      Plasma.setTime(3.0);      // fixed developed phase (deterministic)
      Plasma.render(0);
    }
    paint();
  }

  function start() {
    if (rafId) { window.cancelAnimationFrame(rafId); rafId = 0; }
    last = 0;
    if (reduce) {
      renderStaticFrame();
    } else {
      rafId = window.requestAnimationFrame(loop);
    }
  }

  /* ---------- colour mode application (body class for CSS) ---------- */

  function applyColour() {
    document.body.dataset.theme = state.colour;
    document.querySelector('meta[name="theme-color"]')
      .setAttribute('content', COLOURS[state.colour].bg);
    atlasDirty = true;
  }

  /* ---------- URL hash wiring: #e=engine&c=charset&k=colour ---------- */

  var charsetFromHash = false; // did the URL explicitly pin a ramp?

  function readHash() {
    var h = (location.hash || '').replace(/^#/, '');
    charsetFromHash = false;
    if (!h) {
      // no hash: default the donut engine to its canonical 'donut' ramp
      if (state.engine === 'donut') state.charset = 'donut';
      return;
    }
    var parts = h.split('&');
    for (var i = 0; i < parts.length; i++) {
      var kv = parts[i].split('=');
      var k = kv[0], val = kv[1];
      if (k === 'e' && CHARSETS && (val === 'donut' || val === 'matrix' || val === 'plasma')) state.engine = val;
      else if (k === 'c' && CHARSETS[val]) { state.charset = val; charsetFromHash = true; }
      else if (k === 'k' && COLOURS[val]) state.colour = val;
    }
    // donut with no explicit ramp -> canonical donut ramp
    if (state.engine === 'donut' && !charsetFromHash) state.charset = 'donut';
  }

  var hashWriteTimer = 0;
  function writeHash() {
    window.clearTimeout(hashWriteTimer);
    hashWriteTimer = window.setTimeout(function () {
      var h = '#e=' + state.engine + '&c=' + state.charset + '&k=' + state.colour;
      if (location.hash !== h) {
        history.replaceState(null, '', h);
      }
    }, 120);
  }

  /* ---------- control wiring ---------- */

  var segEngine  = document.querySelector('.tabs[aria-labelledby="lab-engine"]');
  var segCharset = document.getElementById('seg-charset');
  var segColour  = document.getElementById('seg-colour');
  var slSpeed    = document.getElementById('sl-speed');
  var slCell     = document.getElementById('sl-cell');
  var slContrast = document.getElementById('sl-contrast');
  var valSpeed   = document.getElementById('val-speed');
  var valCell    = document.getElementById('val-cell');
  var valContrast= document.getElementById('val-contrast');
  var btnHide    = document.getElementById('btn-hide');
  var btnShow    = document.getElementById('btn-show');

  // mark the active button (aria-pressed) within a delegated chip group
  function setPressed(groupEl, attr, value) {
    var btns = groupEl.querySelectorAll('button');
    for (var i = 0; i < btns.length; i++) {
      btns[i].setAttribute('aria-pressed', btns[i].getAttribute(attr) === value ? 'true' : 'false');
    }
  }

  function syncSliderLabels() {
    var sp = Math.round(state.speed * 100), co = Math.round(state.contrast * 100);
    slSpeed.value    = sp;
    slCell.value     = state.cell;
    slContrast.value = co;
    slSpeed.setAttribute('aria-valuetext', sp + ' percent');
    slCell.setAttribute('aria-valuetext', state.cell + ' pixels');
    slContrast.setAttribute('aria-valuetext', co + ' percent');
    valSpeed.textContent    = sp;
    valCell.textContent     = state.cell;
    valContrast.textContent = co;
  }

  function syncControls() {
    setPressed(segEngine, 'data-engine', state.engine);
    setPressed(segCharset, 'data-ramp', state.charset);
    setPressed(segColour, 'data-colour', state.colour);
    syncSliderLabels();
  }

  function setEngine(e) {
    if (state.engine === e) return;
    state.engine = e;
    atlasDirty = true; // matrix needs its glyph set baked
    syncControls();
    writeHash();
    if (reduce) start(); // re-render the single static frame
  }

  // delegated click per chip group (one listener each)
  segEngine.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn || !btn.dataset.engine) return;
    setEngine(btn.dataset.engine);
  });
  segCharset.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn || !btn.dataset.ramp) return;
    state.charset = btn.dataset.ramp;
    setPressed(segCharset, 'data-ramp', state.charset);
    atlasDirty = true;
    writeHash();
    if (reduce) start();
  });
  segColour.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn || !btn.dataset.colour) return;
    state.colour = btn.dataset.colour;
    setPressed(segColour, 'data-colour', state.colour);
    applyColour();
    writeHash();
    if (reduce) start();
  });

  // title hints: ramp name + the actual ramp string
  (function () {
    var btns = segCharset.querySelectorAll('button');
    for (var i = 0; i < btns.length; i++) {
      var name = btns[i].dataset.ramp;
      btns[i].setAttribute('title', name + '  ' + (CHARSETS[name] || ''));
    }
  })();

  slSpeed.addEventListener('input', function () {
    state.speed = (+slSpeed.value) / 100;
    slSpeed.setAttribute('aria-valuetext', slSpeed.value + ' percent');
    valSpeed.textContent = slSpeed.value;
    if (reduce) start();
  });

  slCell.addEventListener('input', function () {
    state.cell = +slCell.value;
    slCell.setAttribute('aria-valuetext', state.cell + ' pixels');
    valCell.textContent = state.cell;
    resize();
    if (reduce) start();
  });

  slContrast.addEventListener('input', function () {
    state.contrast = (+slContrast.value) / 100;
    slContrast.setAttribute('aria-valuetext', slContrast.value + ' percent');
    valContrast.textContent = slContrast.value;
    if (reduce) start();
  });

  function hideBar() {
    document.body.classList.add('barhidden');
    btnHide.setAttribute('aria-pressed', 'true');
    btnShow.focus();
    resize();   // stage just grew to full width — re-fit the canvas
    start();    // repaint immediately (reduced-motion has no rAF loop)
  }
  function showBar() {
    document.body.classList.remove('barhidden');
    btnHide.setAttribute('aria-pressed', 'false');
    btnHide.focus();
    resize();   // stage shrank back beside the rail — re-fit the canvas
    start();
  }
  btnHide.addEventListener('click', hideBar);
  btnShow.addEventListener('click', showBar);

  // 'H' toggles the control bar (ignored while typing in a form control)
  window.addEventListener('keydown', function (ev) {
    if (ev.key !== 'h' && ev.key !== 'H') return;
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    var t = ev.target, tag = t && t.tagName;
    if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
    if (document.body.classList.contains('barhidden')) showBar();
    else hideBar();
  });

  // pointer reactivity
  function onPointer(ev) {
    pointer.active = true;
    // stage-relative: subtract the rail offset so cell 0,0 is the stage corner
    pointer.x = ev.clientX - rectL;
    pointer.y = ev.clientY - rectT;
    pointer.gx = (pointer.x / cw) | 0;
    pointer.gy = (pointer.y / ch) | 0;
    if (reduce) start();
  }
  window.addEventListener('pointermove', onPointer, { passive: true });
  window.addEventListener('pointerdown', onPointer, { passive: true });
  window.addEventListener('pointerleave', function () { pointer.active = false; });

  window.addEventListener('hashchange', function () {
    readHash();
    applyColour();
    syncControls();
    resize();
    if (reduce) start();
  });

  var resizeTimer = 0;
  window.addEventListener('resize', function () {
    window.clearTimeout(resizeTimer);
    resizeTimer = window.setTimeout(function () {
      resize();
      if (reduce) start();
    }, 140);
  });

  /* ---------- boot ---------- */

  readHash();
  applyColour();
  syncControls();
  writeHash();
  resize();
  start();
})();
</script>
</body>
</html>
