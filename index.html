    }
    // keep state.mode coherent: a generative engine => generative mode; image => image.
    if (GEN_ENGINES[e]) state.mode = 'generative';
    else if (e === 'image') state.mode = 'image';
    if (state.engine === e) { syncImageSection(); return; }
    state.engine = e;
    atlasDirty = true; // matrix needs its glyph set baked
    if (e === 'image') Image_.invalidate();
    syncControls();
    writeHash();
    if (reduce) start(); // re-render the single static frame
  }

  /* ---------- MODE SWITCH wiring ----------
     The top-level toggle swaps the whole control set. "Generative" returns to the
     last generative engine (donut default), KEEPING any loaded image. "Image"
     enters image mode: if an image is loaded it renders; if NOT it shows the
     image section's insert state + a hint toast — it never auto-opens the file
     picker (only the explicit "insert" button does), so the canvas may sit empty
     until an image is inserted. */
  function enterGenerativeMode() {
    state.mode = 'generative';
    var back = GEN_ENGINES[lastGenEngine] ? lastGenEngine : 'donut';
    setEngine(back);
    syncControls();   // ensure the mode classes reflect generative even if engine was unchanged
    start();
  }
  function enterImageMode() {
    state.mode = 'image';
    if (Image_.hasImage()) {
      setEngine('image');               // renders the loaded image
      syncControls();
      start();
      return;
    }
    // no image yet: switch to image mode WITHOUT opening the picker. Set the
    // engine directly (setEngine('image') would pop the picker) and show the
    // insert state + a hint.
    state.engine = 'image';
    atlasDirty = true;
    Image_.invalidate();
    syncControls();                   // flips body.mode-image, shows insert state
    writeHash();
    start();                          // re-render (canvas may be empty)
    toast('insert an image to convert');
  }
  // WORDS mode: top-level switch to words. The render dispatch keys off state.mode,
  // so we just set it, sync the control set, and (re)start. A generative engine is
  // still tracked underneath for the engine-fill paths.
  function enterWordsMode() {
    state.mode = 'words';
    // long words need a finer grid to render as legible letters (not thin bars)
    if (state.cell > 7) { state.cell = 6; syncSliderLabels(); resize(); }
    Words.invalidate();
    atlasDirty = true;     // matrix-fill may need its glyph set baked
    syncControls();
    writeHash();
    start();
  }
  if (segMode) segMode.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn || !btn.dataset.mode) return;
    var m = btn.dataset.mode;
    if (m === 'image') enterImageMode();
    else if (m === 'words') enterWordsMode();
    else enterGenerativeMode();
  });

  // WORDS text input — live-updates the mask (debounced rebuild via cache key).
  if (wordText) {
    var wordSync = function () {
      state.word = wordText.value;
      state.mode = 'words';
      if (state.cell > 7) { state.cell = 6; syncSliderLabels(); resize(); }
      Words.invalidate();
      syncControls();
      writeHash();
      start();   // re-render (reduced-motion has no rAF loop)
    };
    wordText.addEventListener('input', wordSync);
  }

  // WORDS fill picker — solid vs an engine that flows inside the letters.
  if (segWordFill) segWordFill.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn || !btn.dataset.fill) return;
    state.wordFill = btn.dataset.fill;
    state.mode = 'words';
    atlasDirty = true;     // matrix-fill needs its glyph set baked
    if (state.wordFill === 'donut') Donut.reset();
    if (state.wordFill === 'matrix') Matrix.reset();
    syncControls();
    writeHash();
    start();
  });

  // WORDS palette picker — the colour scheme for the 3D block letters.
  if (segWordPal) segWordPal.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn || !btn.dataset.pal) return;
    state.wordPal = btn.dataset.pal;
    state.mode = 'words';
    setPressed(segWordPal, 'data-pal', state.wordPal);
    writeHash();
    start();
  });

  // delegated click per chip group (one listener each). The ENGINE tabs only
  // carry generative engines now; clicking one switches to generative but keeps
  // any loaded image.
  segEngine.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn || !btn.dataset.engine) return;
    setEngine(btn.dataset.engine);
  });
  segCharset.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn || !btn.dataset.ramp) return;
    state.charset = btn.dataset.ramp;
    setPressed(segCharset, 'data-ramp', state.charset);
    atlasDirty = true;
    writeHash();
    syncLook();
    if (reduce) start();
  });
  segColour.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn || !btn.dataset.colour) return;
    state.colour = btn.dataset.colour;
    setPressed(segColour, 'data-colour', state.colour);
    applyColour();
    writeHash();
    syncLook();
    if (reduce) start();
  });

  // title hints: ramp name + the actual ramp string
  (function () {
    var btns = segCharset.querySelectorAll('button');
    for (var i = 0; i < btns.length; i++) {
      var name = btns[i].dataset.ramp;
      btns[i].setAttribute('title', name + '  ' + (CHARSETS[name] || ''));
    }
  })();

  slSpeed.addEventListener('input', function () {
    state.speed = (+slSpeed.value) / 100;
    slSpeed.setAttribute('aria-valuetext', slSpeed.value + ' percent');
    valSpeed.textContent = slSpeed.value;
    writeHash();
    syncLook();
    if (reduce) start();
  });

  slCell.addEventListener('input', function () {
    state.cell = +slCell.value;
    slCell.setAttribute('aria-valuetext', state.cell + ' pixels');
    valCell.textContent = state.cell;
    resize();
    writeHash();
    syncLook();
    if (reduce) start();
  });

  slContrast.addEventListener('input', function () {
    state.contrast = (+slContrast.value) / 100;
    slContrast.setAttribute('aria-valuetext', slContrast.value + ' percent');
    valContrast.textContent = slContrast.value;
    Image_.invalidate();   // contrast feeds the image sample
    writeHash();
    if (reduce) start();
  });

  function hideBar() {
    document.body.classList.add('barhidden');
    btnHide.setAttribute('aria-pressed', 'true');
    btnShow.focus();
    resize();   // stage just grew to full width — re-fit the canvas
    start();    // repaint immediately (reduced-motion has no rAF loop)
  }
  function showBar() {
    document.body.classList.remove('barhidden');
    btnHide.setAttribute('aria-pressed', 'false');
    btnHide.focus();
    resize();   // stage shrank back beside the rail — re-fit the canvas
    start();
  }
  btnHide.addEventListener('click', hideBar);
  btnShow.addEventListener('click', showBar);

  /* ---------- LOOKS / ACTIONS / EXPORT wiring ---------- */
  if (segLooks) segLooks.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn || !btn.dataset.look) return;
    applyPreset(btn.dataset.look);
  });
  if (btnCopy)    btnCopy.addEventListener('click', doCopy);
  if (btnShare)   btnShare.addEventListener('click', doShare);
  if (btnShuffle) btnShuffle.addEventListener('click', doShuffle);
  if (btnTxt)     btnTxt.addEventListener('click', exportTxt);
  if (btnAns)     btnAns.addEventListener('click', exportAns);
  if (btnPng)     btnPng.addEventListener('click', exportPng);
  if (btnRec) {
    if (!REC_SUPPORTED) {
      btnRec.disabled = true;
      btnRec.setAttribute('aria-disabled', 'true');
      btnRec.title = 'recording unavailable in this browser';
    } else {
      btnRec.addEventListener('click', toggleRec);
    }
  }

  /* ---------- IMAGE insert / invert / drag-drop / paste ---------- */

  function openPicker() { if (imgFile) imgFile.click(); }

  // Load a dataURL into an Image, store it, switch to the image engine,
  // recompute + render, toast. Shared by file picker, drag-drop, paste.
  function loadImageFromURL(url, label) {
    var img = new Image();
    img.onload = function () {
      Image_.setImage(img);
      // point the section's thumbnail at the loaded image + flip to the loaded
      // state. setEngine('image') below auto-activates the image render.
      if (thumbImg) thumbImg.src = url;
      state.engine = 'image';
      // high-fidelity defaults for a photo: auto-select the dense 'photo' ramp
      // (but only if the user is on a SHORT generative ramp — never override an
      // explicit photo/blocks choice), and drop to a FINER cell so the grid has
      // enough cells to resolve detail. All ramps + cells stay user-selectable.
      if (state.charset === 'standard' || state.charset === 'donut' ||
          state.charset === 'binary' || state.charset === 'dots') {
        state.charset = 'photo';
      }
      if (state.cell > 6) state.cell = 6;
      atlasDirty = true;
      Image_.invalidate();
      syncControls();
      writeHash();
      resize();  // cell changed -> re-fit the grid (also re-samples the image)
      start();   // (re)render with the new sample (reduced-motion has no loop)
      toast(label || ('image · ' + img.naturalWidth + 'x' + img.naturalHeight));
    };
    img.onerror = function () { toast('image failed to load'); };
    img.src = url;
  }

  // Read a File (image) -> dataURL -> loadImageFromURL.
  function loadImageFile(file) {
    if (!file || !/^image\//.test(file.type)) { toast('not an image'); return; }
    var fr = new FileReader();
    fr.onload = function () { loadImageFromURL(fr.result, 'image · ' + file.name); };
    fr.onerror = function () { toast('read failed'); };
    fr.readAsDataURL(file);
  }

  if (btnInsert) btnInsert.addEventListener('click', openPicker);
  if (btnReplace) btnReplace.addEventListener('click', openPicker);
  if (imgFile) imgFile.addEventListener('change', function () {
    if (imgFile.files && imgFile.files[0]) loadImageFile(imgFile.files[0]);
    imgFile.value = '';   // allow re-picking the same file
  });

  // clicking the thumbnail activates the image render (returns to it after you
  // wandered off to a generative engine/Look — the image was never discarded).
  if (btnThumb) btnThumb.addEventListener('click', function () {
    if (Image_.hasImage()) setEngine('image');
  });

  // remove ✕ : drop the image, flip the section back to the insert state, and
  // switch the render to the last generative engine used (donut by default).
  function removeImage() {
    Image_.setImage(null);
    if (thumbImg) thumbImg.removeAttribute('src');
    var back = GEN_ENGINES[lastGenEngine] ? lastGenEngine : 'donut';
    state.engine = back;          // setEngine would re-open the picker for 'image'
    atlasDirty = true;
    syncControls();               // flips body.has-image off (no image now)
    writeHash();                  // hash drops e=image, reverts to the generative engine
    resize();                     // re-fit the grid for the generative engine
    start();
    toast('image removed');
  }
  if (btnRemove) btnRemove.addEventListener('click', removeImage);

  function setInvert(on) {
    state.invert = !!on;
    if (btnInvert) btnInvert.setAttribute('aria-pressed', state.invert ? 'true' : 'false');
    Image_.invalidate();
    writeHash();
    if (state.engine === 'image') start();
  }
  if (btnInvert) btnInvert.addEventListener('click', function () { setInvert(!state.invert); });

  // DRAG-AND-DROP anywhere on the page loads an image + switches to image.
  window.addEventListener('dragover', function (e) {
    if (e.dataTransfer) { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; }
  });
  window.addEventListener('drop', function (e) {
    if (!e.dataTransfer) return;
    var f = null, dt = e.dataTransfer;
    if (dt.files && dt.files.length) {
      for (var i = 0; i < dt.files.length; i++) {
        if (/^image\//.test(dt.files[i].type)) { f = dt.files[i]; break; }
      }
    }
    if (f) { e.preventDefault(); loadImageFile(f); }
  });

  // PASTE an image from the clipboard (Ctrl/Cmd+V). Best-effort + guarded.
  window.addEventListener('paste', function (e) {
    try {
      var items = e.clipboardData && e.clipboardData.items;
      if (!items) return;
      for (var i = 0; i < items.length; i++) {
        if (items[i].kind === 'file' && /^image\//.test(items[i].type)) {
          var f = items[i].getAsFile();
          if (f) { e.preventDefault(); loadImageFile(f); return; }
        }
      }
    } catch (err) { /* clipboard image unavailable; ignore */ }
  });

  // 'C' copies the grid as text (ignored while typing / with modifiers)
  window.addEventListener('keydown', function (ev) {
    if (ev.key !== 'c' && ev.key !== 'C') return;
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    var t = ev.target, tag = t && t.tagName;
    if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
    doCopy();
  });

  // 'H' toggles the control bar (ignored while typing in a form control)
  window.addEventListener('keydown', function (ev) {
    if (ev.key !== 'h' && ev.key !== 'H') return;
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    var t = ev.target, tag = t && t.tagName;
    if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
    if (document.body.classList.contains('barhidden')) showBar();
    else hideBar();
  });

  // pointer reactivity
  function onPointer(ev) {
    pointer.active = true;
    // stage-relative: subtract the rail offset so cell 0,0 is the stage corner
    pointer.x = ev.clientX - rectL;
    pointer.y = ev.clientY - rectT;
    pointer.gx = (pointer.x / cw) | 0;
    pointer.gy = (pointer.y / ch) | 0;
    if (reduce) start();
  }
  window.addEventListener('pointermove', onPointer, { passive: true });
  window.addEventListener('pointerdown', onPointer, { passive: true });
  window.addEventListener('pointerleave', function () { pointer.active = false; });

  window.addEventListener('hashchange', function () {
    readHash();
    // e=image with no loaded bytes -> fall back to a generative engine (unless a
    // word pinned words mode, where the engine is just the fill source).
    if (state.mode === 'image' && state.engine === 'image' && !Image_.hasImage()) {
      state.engine = 'donut'; state.mode = 'generative';
    }
    if (GEN_ENGINES[state.engine]) lastGenEngine = state.engine;
    reseed();
    Words.invalidate();
    applyColour();
    syncControls();
    resize();
    start();
  });

  var resizeTimer = 0;
  window.addEventListener('resize', function () {
    window.clearTimeout(resizeTimer);
    resizeTimer = window.setTimeout(function () {
      resize();
      if (reduce) start();
    }, 140);
  });

  /* ---------- boot ---------- */

  readHash();
  // a shared #e=image link references the image render but carries no image
  // bytes (not shareable via hash). Fall back to a generative engine (donut) so
  // we never boot to a blank stage; remember it as the last generative engine.
  // (A word-pinned link is words mode and shares fully via the hash.)
  var bootImageWanted = (state.mode === 'image' && state.engine === 'image');
  if (bootImageWanted && !Image_.hasImage()) { state.engine = 'donut'; state.mode = 'generative'; }
  if (GEN_ENGINES[state.engine]) lastGenEngine = state.engine;
  reseed();
  applyColour();
  syncControls();
  writeHash();
  resize();
  start();

  // prompt for an image if the link asked for the image render but had no bytes.
  if (bootImageWanted && !Image_.hasImage()) {
    toast('insert an image to convert');
  }

  // OPTIONAL test hook — exposed ONLY when window.__ASCII_TEST__ is set before
  // load (headless functional tests). Zero effect on the shipped instrument.
  if (window.__ASCII_TEST__) {
    window.__ascii = {
      state: state,
      gridToText: gridToText,
      gridToAnsi: gridToAnsi,
      getMask: function () { return Words.getMask(); },
      grid: function () { return { cols: cols, rows: rows, lum: lum, glyph: glyph, cellCol: cellCol }; },
      api: {
        start: start,
        syncControls: syncControls,
        invalidateWords: function () { Words.invalidate(); atlasDirty = true; },
        renderOnce: function () { step(0); }   // synchronous single render for tests
      }
    };
  }
})();
</script>
</body>
</html>
