<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="description" content="ASCII is a text-native generative art instrument. Where Fluid renders pixels, ASCII renders characters — a phosphor-green CRT terminal where everything is glyphs.">
<meta name="theme-color" content="#05080a">
<meta property="og:title" content="ASCII — everything is characters">
<meta property="og:description" content="A text-native generative art instrument. Everything is characters.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ascii.krackeddevs.com/">
<meta property="og:image" content="https://ascii.krackeddevs.com/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:type" content="image/png">
<meta property="og:image:alt" content="ASCII — everything is characters">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="ASCII — everything is characters">
<meta name="twitter:description" content="A text-native generative art instrument. Everything is characters.">
<meta name="twitter:image" content="https://ascii.krackeddevs.com/og.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305080a'/%3E%3Ctext x='16' y='23' font-family='monospace' font-size='22' font-weight='700' text-anchor='middle' fill='%2339ff7a'%3E%3E%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --mono:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    /* ---- theme tokens (phosphor default). Each theme sets only --bg/--bg-rgb
       and --ink/--ink-rgb (+ a couple of overrides); ALL chrome colours derive
       from those, so swapping a theme recolours the whole instrument — not just
       the canvas glyphs. ---- */
    --bg:#05080a;  --bg-rgb:5,8,10;
    --ink:#39ff7a; --ink-rgb:57,255,122;
    --ink-dim:#1f8f47;
    --glow:0 0 4px rgba(var(--ink-rgb),.55), 0 0 12px rgba(var(--ink-rgb),.28);
    --ctl-glow:0 0 8px rgba(var(--ink-rgb),.35);
    --scan-op:.7;
    /* derived — re-resolve automatically when --ink-rgb / --bg-rgb change */
    --ink-faint:rgba(var(--ink-rgb),.34);
    --tab-bg:rgba(var(--ink-rgb),.06);
    --tab-bg-hover:rgba(var(--ink-rgb),.16);
    --tab-bg-on:rgba(var(--ink-rgb),.24);
    /* width of the Fluid-style left rail; collapses to 0 when hidden/mobile */
    --panel-w:clamp(224px, 23vw, 300px);
  }
  body[data-theme="amber"]{
    --bg:#0a0600;  --bg-rgb:10,6,0;
    --ink:#ffb026; --ink-rgb:255,176,38;
    --ink-dim:#b87d1a;
    --scan-op:.6;
  }
  body[data-theme="paper"]{
    --bg:#e7e8e2;  --bg-rgb:231,232,226;
    --ink:#13271b; --ink-rgb:19,39,27;
    --ink-dim:#3a5244;
    --glow:none;
    --ctl-glow:none;
    --scan-op:.16;
    --tab-bg:rgba(var(--ink-rgb),.05);
    --tab-bg-hover:rgba(var(--ink-rgb),.12);
    --tab-bg-on:rgba(var(--ink-rgb),.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--mono);
    overflow:hidden;
    position:relative;
    text-shadow:var(--glow);
  }

  /* the STAGE — offset by the left rail so the art lives BESIDE the panel,
     never under it. <canvas> is a replaced element (intrinsic 300x150), so
     left+right+top+bottom alone DON'T stretch it — give it an explicit size:
     width = viewport minus the rail, height = full viewport. */
  #art{
    position:fixed;
    left:var(--panel-w);
    top:0;
    width:calc(100% - var(--panel-w));
    height:100%;
    display:block;
    z-index:0;
    touch-action:none;   /* image pan/zoom + engine pointer own the canvas gestures (no native scroll/pinch) */
  }

  .vignette{
    position:fixed;
    left:var(--panel-w);
    right:0;
    top:0;
    bottom:0;
    z-index:1;
    pointer-events:none;
    /* edge fade tracks the STAGE background (top-right toggle), not the theme bg,
       so the vignette matches whichever bg (black/creme) is active. */
    background:radial-gradient(120% 100% at 50% 50%,
      rgba(var(--stage-bg-rgb, 10,10,12),0) 42%,
      rgba(var(--stage-bg-rgb, 10,10,12),.45) 80%,
      rgba(var(--stage-bg-rgb, 10,10,12),.9) 100%);
  }

  /* Fluid-style LEFT RAIL — a fixed-width vertical control column pinned to the
     left edge, full height, internal scroll, border-right. The wordmark sits at
     the top; controls stack below. */
  .topbar{
    position:fixed;
    left:0;top:0;bottom:0;
    width:var(--panel-w);
    transition:transform .24s cubic-bezier(.4,0,.2,1);  /* seamless rail slide */
    z-index:4;
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:16px;
    padding:18px 16px 14px;
    overflow-y:auto;
    overscroll-behavior:contain;
    scrollbar-width:thin;                              /* super-thin scrollbar (Firefox) */
    scrollbar-color:rgba(255,255,255,.3) transparent;
    /* CYBERPUNK / MATRIX panel — refined + restrained. A CALM near-black surface
       with ONE neon-green accent (#ffffff) and a single hairline border. No circuit
       grid, no scanline texture, no cyan wash — the controls do the talking. Tokens
       are overridden locally to a dark terminal palette so every control resolves
       neon-green-on-charcoal, while the stage/art keeps its active theme. */
    --ink:#eaeaea;                         /* bright terminal text */
    --ink-rgb:230,230,230;
    --ink-dim:rgba(160,160,160,.55);       /* dimmed neon-green */
    --neon:#ffffff;                        /* the single accent — phosphor green */
    --neon-rgb:255,255,255;
    --glow:0 0 6px rgba(255,255,255,.45);
    --ctl-glow:0 0 8px rgba(255,255,255,.35);
    --line:rgba(255,255,255,.18);
    --accent:#ffffff;
    --panel-metal:#0a0a0b;
    color:var(--ink);
    text-shadow:none;
    /* a calm dark vertical gradient — no texture, no competing washes */
    background-color:var(--panel-metal);
    background-image:linear-gradient(180deg, #131315 0%, #0a0a0b 100%);
    border-right:1px solid rgba(255,255,255,.16);
  }

  .topbar::-webkit-scrollbar{width:4px;height:4px}     /* super thin */
  .topbar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.3);border-radius:2px}
  .topbar::-webkit-scrollbar-track{background:transparent}
  /* Wordmark: uppercase, tracked neon green with a restrained glow — the one place
     (besides the active tile) where glow is allowed. */
  h1.wordmark{
    font-size:16px;
    font-weight:700;
    letter-spacing:.24em;
    text-transform:uppercase;
    line-height:1;
    color:#eeeeee;
    text-shadow:0 0 7px rgba(255,255,255,.5);
    white-space:nowrap;
    flex:0 0 auto;
  }
  .wordmark .blip{
    display:inline-block;
    width:.5em;height:.86em;
    margin-left:.18em;
    vertical-align:-.08em;
    background:var(--neon);
    box-shadow:0 0 5px rgba(255,255,255,.55);
    animation:blink 1.05s steps(1,end) infinite;
  }
  @keyframes blink{50%{opacity:0}}
  .sub{
    font-size:9px;
    letter-spacing:.3em;
    text-transform:uppercase;
    color:var(--ink-dim);
    text-shadow:none;
    white-space:nowrap;
    flex:0 0 auto;
  }
  /* descriptive subtitle under the title (Fluid-style) — what the tool does */
  .desc{
    font-size:11px;
    line-height:1.5;
    letter-spacing:.005em;
    text-transform:none;
    color:var(--ink-dim);
    text-shadow:none;
    margin-top:8px;
    max-width:34ch;
  }
  @media (max-width:720px){ .sub, .desc{display:none} }
  /* "made by" portfolio credit — sits under the description, above the controls */
  .credit{
    font-size:9.5px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--ink-faint);
    text-shadow:none;
    margin-top:11px;
  }
  .credit a{
    color:var(--ink-dim);
    text-decoration:none;
    border-bottom:1px solid var(--line);
    transition:color .12s ease, border-color .12s ease;
  }
  .credit a:hover{ color:var(--neon); border-color:var(--neon); }
  /* COLOUR tiles each show a swatch bar of the palette's REAL colour/gradient */
  .seg.colour .tab{ padding-bottom:13px; }
  .seg.colour .cswatch{
    position:absolute; left:7px; right:7px; bottom:6px; height:4px;
    border-radius:2px; z-index:1; pointer-events:none;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.28);
  }
  /* narrow desktop windows shrink the rail (it clamps to its 224px min) → shrink the
     tile text a touch so 8-char labels (standard/phosphor/spectrum/Generative) never clip. */
  @media (min-width:681px) and (max-width:1120px){
    .controls .tab, .controls .btn{ font-size:9px; letter-spacing:0; padding:0 3px; }
    .controls .modeswitch .tab{ font-size:7px; letter-spacing:0; padding:8px 2px; }
  }

  /* controls — stacked vertically inside the rail */
  .controls{
    margin-left:0;
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:14px;
    justify-content:flex-start;
  }
  /* ---- SECTION BAYS — each control group is a calm, recessed bay: a barely-there
     dark fill and a single hairline border, clean rounded corners, generous
     consistent padding. No clipped corners, no tick, no inset glow. */
  .group{
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:9px;
    position:relative;
    padding:13px 13px 14px;
    background:rgba(255,255,255,.018);
    border:1px solid rgba(255,255,255,.12);
    border-radius:0;
    clip-path:polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);  /* sharp HUD corner */
  }
  /* ---- SECTION LABELS — clean uppercase tracked green, no markers, no brackets. */
  .group > .lab{
    font-size:9px;
    letter-spacing:.22em;
    text-transform:uppercase;
    font-weight:700;
    color:var(--neon);
    opacity:.78;
    user-select:none;
    text-shadow:none;
  }

  /* ---- HUD TILE GRID — the row of datapad button tiles (3-up by default). The tile
     skin (dark glassy face, glowing green hairline, LIT active state) is on .tab/.btn
     below; this just lays them out. ---- */
  .tabs{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:7px;
  }
  .tabs.cols2{ grid-template-columns:repeat(2,minmax(0,1fr)); }
  /* ---- TILES — ONE consistent treatment for every tile (mode / engine / charset /
     colour): a clean thin green hairline, a subtle dark fill, a consistent radius.
     :hover brightens + lifts subtly; the active aria-pressed="true" state is a clean
     filled green with dark text and a RESTRAINED glow (not a blooming halo). No
     clipped corners. ---- */
  /* OUTLINED CLIPPED SHAPE — the slant clips the border off the diagonal, so instead
     of a real border we paint the element BACKGROUND as the OUTLINE colour (clipped to
     the slant) and lay a ::after FILL inset by 1px with the SAME clip-path. The outline
     colour then shows as a uniform ~1px edge on EVERY side incl. the diagonal. The fill
     sits at z-index:-1 inside an isolate'd stacking context so the button TEXT stays
     crisp ABOVE it (never doubled/outlined). --tab-outline / --tab-fill drive both. */
  .tab, .btn{
    appearance:none;
    -webkit-appearance:none;
    position:relative;
    isolation:isolate;
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.01em;
    color:#c8c8c8;
    width:100%;
    min-height:36px;
    min-width:32px;
    padding:0 5px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:clip;
    cursor:pointer;
    text-shadow:none;
    border:0;
    border-radius:0;
    --tab-slant:polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%);
    --tab-outline:rgba(255,255,255,.42);  /* hairline outline colour (follows slant) */
    --tab-fill:#17171a;                   /* face colour */
    clip-path:var(--tab-slant);           /* sharp HUD corner */
    background:var(--tab-outline);        /* this layer IS the outline */
    transition:transform .08s ease, box-shadow .12s ease, color .12s ease;
  }
  /* the fill face — inset 1px, same slant, behind the text */
  .tab::after, .btn::after{
    content:"";
    position:absolute;
    inset:1px;
    z-index:-1;
    clip-path:var(--tab-slant);
    background:var(--tab-fill);
    transition:background-color .12s ease;
  }
  .tab:hover, .btn:hover{
    transform:translateY(-1px);
    color:#e0e0e0;
    --tab-outline:rgba(255,255,255,.62);
    --tab-fill:#0e1a16;
  }
  .tab:active, .btn:active{
    transform:translateY(0);
    --tab-fill:#17171a;
  }
  /* selected — a clean filled white panel with dark text + a restrained glow; the
     outline reads as a faint grey hairline so the slant stays drawn on the white tile */
  .tab[aria-pressed="true"]{
    color:#0a0a0a;
    font-weight:700;
    text-shadow:none;
    --tab-outline:rgba(0,0,0,.55);
    --tab-fill:#ffffff;
    box-shadow:0 0 10px rgba(255,255,255,.35);
  }
  .tab[aria-pressed="true"]:hover{
    transform:translateY(-1px);
    --tab-fill:#f2f2f2;
    box-shadow:0 0 12px rgba(255,255,255,.45);
  }

  /* MODE SWITCH — the PRIMARY selector. Set apart from the row of sub-tabs below as
     taller icon-over-label cards, each with a DISTINCT icon (sparkle / photo / type),
     so the top-level mode is instantly readable and the three no longer look alike. */
  .modeswitch{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:7px; }
  .modeswitch .tab{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:5px; min-height:58px; padding:9px 4px;
    font-size:9px; letter-spacing:.04em; text-transform:uppercase;
  }
  .modeswitch .mico{ width:21px; height:21px; display:block; opacity:.9; pointer-events:none; }
  .modeswitch .tab[aria-pressed="true"] .mico{ opacity:1; }

  /* ---- LOOK SWATCHES — each LOOK is a SQUARE mini-swatch made of characters:
     buildLookSwatches() fills a tile with a patch of that look's own charset
     ramp, tinted to its palette (solid ink, or a clipped gradient for the
     spectrum/fire/ice/neon looks), over that look's stage background, with the
     name on a bottom scrim. Square via aspect-ratio; the glyph patch is sized in
     container units (cqi) so it fills the tile at any rail width. Selected tile
     gets a bright ring. This is the swatch counterpart to the .tab metal tiles. */
  .looksgrid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:6px;
  }
  /* OUTLINED CLIPPED SWATCH — same technique as the tiles: the element background is
     the OUTLINE colour clipped to the slant, and an inset-1px .lookface (set up by
     buildLookSwatches, carrying the per-look stage bg, same slant) sits inside it, so
     the outline reads as a uniform ~1px hairline on every edge incl. the diagonal. The
     glyph patch + name sit ABOVE the face. */
  .looktile{
    appearance:none;
    -webkit-appearance:none;
    position:relative;
    isolation:isolate;
    aspect-ratio:1 / 1;
    container-type:inline-size;
    overflow:hidden;
    padding:0;
    cursor:pointer;
    border:0;
    border-radius:0;
    --lk-slant:polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%);
    clip-path:var(--lk-slant);  /* sharp HUD corner */
    background:rgba(255,255,255,.34);  /* this layer IS the outline (light hairline) */
    color:#ececef;                /* no-JS fallback: plain name text */
    font-family:var(--mono);
    font-size:10px;
    line-height:34px;             /* centres the no-JS fallback name vertically */
    text-align:center;
    box-shadow:
      0 2px 4px rgba(0,0,0,.42);
    transition:transform .07s ease, box-shadow .1s ease, background-color .1s ease, outline-color .1s ease;
  }
  /* the inset face — carries the per-look stage bg (set inline by JS), 1px inset so the
     element's outline colour frames the whole slant. No-JS fallback: a dark face. */
  .lookface{
    position:absolute;
    inset:1px;
    z-index:-1;
    clip-path:var(--lk-slant);
    background:#06060a;
  }
  .looktile:hover{
    transform:translateY(-1px);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.18),
      0 5px 10px rgba(0,0,0,.5);
  }
  .looktile:active{ transform:translateY(1px); }
  /* the character patch — fills the tile, vertically centred, cropped to a full
     bleed; cqi sizing keeps the glyph scale proportional to the tile. */
  .looktex{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    white-space:pre;
    line-height:1;
    font-size:19cqi;
    letter-spacing:0;
    text-align:center;
    pointer-events:none;
    user-select:none;
  }
  /* the look name on a bottom scrim so it reads over any swatch */
  .lookname{
    position:absolute;
    left:0;right:0;bottom:0;
    font-size:8.5px;
    letter-spacing:.04em;
    text-transform:lowercase;
    text-align:center;
    padding:7px 3px 3px;
    color:#f4f4f6;
    background:linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.6) 56%, rgba(0,0,0,.82) 100%);
    text-shadow:0 1px 2px rgba(0,0,0,.85);
    pointer-events:none;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  /* light (paper) looks: dark name on a light scrim instead */
  .looktile.lk-light .lookname{
    color:#16160f;
    background:linear-gradient(180deg, rgba(232,232,226,0) 0%, rgba(232,232,226,.66) 54%, rgba(232,232,226,.9) 100%);
    text-shadow:0 1px 0 rgba(255,255,255,.6);
  }
  /* selected — a clean white ring with a restrained glow; the slant outline brightens */
  .looktile[aria-pressed="true"]{
    outline:2px solid var(--neon);
    outline-offset:1px;
    background:rgba(255,255,255,.85);   /* brighter slant hairline when active */
    box-shadow:
      inset 0 0 0 2px rgba(255,255,255,.7),
      0 0 9px rgba(255,255,255,.35);
    transform:translateY(-1px);
  }

  /* uniform, always-visible focus ring */
  .tab:focus-visible, .btn:focus-visible, .looktile:focus-visible, .knob:focus-visible, input:focus-visible{
    outline:2px solid var(--neon);
    outline-offset:2px;
  }

  /* ---- KNOBS — three circular dark-metal dials in a row (Speed / Cell /
     Contrast). Ported from Fluid's .knob: a radial-gradient metal face, an inset
     highlight rim, and a WHITE indicator dot that rotates across a ~270° sweep.
     A visually-hidden <input type=range> holds the real value (keyboard + a11y +
     existing 'input' handlers); the knob drives it. ~44px face. ---- */
  .knobgrid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:8px;
  }
  .knobctl{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
    position:relative;
  }
  /* visually-hidden range — keeps keyboard + screen-reader + 'input' handlers */
  .knobctl input[type="range"]{
    position:absolute;
    width:1px;height:1px;
    opacity:0;
    pointer-events:none;
    margin:0;padding:0;
    overflow:hidden;
  }
  /* ---- DIALS — clean dark dials to match the tiles: a charcoal face inside ONE
     tasteful green ring, minimal glow. No conic tick bezel. ::before is the recessed
     dark cap; .knob-dial::after (untouched logic) carries the green indicator. */
  .knob{
    width:46px;height:46px;
    position:relative;
    border-radius:50%;
    cursor:pointer;
    touch-action:none;
    -webkit-user-select:none;user-select:none;
    background:radial-gradient(circle at 50% 50%, #0c1410 0%, #080f0c 60%, #060a08 100%);
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.3),
      0 0 6px rgba(255,255,255,.12);
  }
  .knob::before{
    /* recessed dark face inside the green rim */
    content:"";
    position:absolute;inset:6px;
    border-radius:50%;
    background:radial-gradient(circle at 46% 34%, #0c1612, #08110c 72%, #060a08 100%);
    box-shadow:inset 0 0 5px rgba(0,0,0,.7);
  }
  /* rotating indicator: a layer that turns; the green dot sits near its top */
  .knob-dial{
    position:absolute;inset:0;
    border-radius:50%;
    z-index:2;
    transform:rotate(-135deg);
    transition:transform .06s linear;
  }
  .knob-dial::after{
    /* INDICATOR — a clean green tick with a restrained glow. */
    content:"";
    position:absolute;
    left:50%;top:5px;
    width:3.5px;height:8px;
    margin-left:-1.75px;
    border-radius:2px;
    background:#ffffff;
    box-shadow:0 0 4px rgba(255,255,255,.7);
  }
  .knoblabel{
    text-align:center;
    line-height:1.2;
  }
  .knoblabel .knm{
    display:block;
    font-size:8px;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--ink-dim);
  }
  .knoblabel .val{
    display:block;
    font-size:11px;
    font-weight:700;
    font-variant-numeric:tabular-nums;
    color:#d6d6d6;
    text-shadow:none;
    margin-top:1px;
  }

  /* hide-bar toggle pinned bottom-right so the bar can vanish for clean view */
  .reveal{
    position:fixed;
    right:12px;bottom:12px;
    z-index:4;
    display:none;
    width:auto;          /* override .btn width:100% -> a small floating button, not full-width */
  }
  /* hidden state: collapse the rail to 0 so the stage expands full-width */
  body.barhidden{ --panel-w:0px; }
  body.barhidden .topbar{ width:clamp(224px, 23vw, 300px); transform:translateX(-101%); }   /* slide out, don't collapse */
  /* reduced-motion: skip the slide, hide instantly (and ensures the panel always hides) */
  @media (prefers-reduced-motion: reduce){ body.barhidden .topbar{ display:none; transform:none; } }
  body.barhidden .reveal{ display:none; }   /* the rail-edge handle reopens it now */

  /* RAIL collapse HANDLE — a slim tab on the rail's right edge, vertically centred,
     that hides/shows the side panel. It rides left:var(--panel-w), so it auto-slides
     to the screen edge when the rail collapses (--panel-w -> 0). */
  .railtoggle{
    position:fixed;
    left:var(--panel-w);
    top:50%;
    transform:translateY(-50%);
    z-index:6;
    width:16px; height:50px;
    display:flex; align-items:center; justify-content:center;
    padding:0;
    border:1px solid rgba(255,255,255,.18);
    border-left:none;
    background:#16161b;
    color:#c4c4c4;
    cursor:pointer;
    font:700 13px/1 var(--mono);
    border-radius:0 4px 4px 0;
    box-shadow:2px 0 7px rgba(0,0,0,.45);
    transition:left .24s cubic-bezier(.4,0,.2,1), background .12s ease, color .12s ease;
  }
  .railtoggle:hover{ background:#24242c; color:#fff; }
  .railtoggle:focus-visible{ outline:2px solid #fff; outline-offset:2px; }
  @media (max-width:680px){ .railtoggle{ display:none; } }   /* no left rail on mobile */
  /* mobile has no rail-edge handle, so when the bar is hidden show the bottom-right
     "controls" button (wired to showBar) — otherwise hiding the bar is a dead-end */
  @media (max-width:680px){ body.barhidden .reveal{ display:inline-block; } }

  footer{
    position:fixed;
    left:var(--panel-w);right:0;bottom:0;
    z-index:4;
    display:flex;
    justify-content:space-between;
    gap:16px;
    padding:10px 14px;
    font-size:10px;
    letter-spacing:.16em;
    color:var(--ink-faint);
    text-shadow:none;
    pointer-events:none;
  }
  footer span{white-space:nowrap}
  body.barhidden footer{ display:none; }

  .scanlines{
    position:fixed;
    left:var(--panel-w);
    right:0;
    top:0;
    bottom:0;
    z-index:3;
    pointer-events:none;
    background:repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,.16) 3px,
      rgba(0,0,0,.16) 4px
    );
    mix-blend-mode:multiply;
    opacity:var(--scan-op);
  }
  /* The stage is ALWAYS dark now (the bg toggle themes the SIDEBAR only), so the CRT
     scanlines are ALWAYS the faint LIGHT lines — the dark multiply lines would vanish
     on black. This overrides the dark base above in every mode. */
  .scanlines{
    background:repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0) 0,
      rgba(255,255,255,0) 2px,
      rgba(255,255,255,.16) 3px,
      rgba(255,255,255,.16) 4px
    );
    mix-blend-mode:normal;
  }

  /* STAGE BACKGROUND toggle — a compact pill pinned to the TOP-RIGHT of the stage
     (right of the rail, above scanlines/vignette). Two circular swatches (black /
     creme); the active one carries a clear ring. Translucent backdrop + hairline
     border so it floats over either background. */
  /* top-right floating controls: the cursor-reactivity toggle + the bg (light/dark) toggle */
  .cornerctl{
    position:fixed;
    top:14px;
    right:14px;
    z-index:5;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .bgtoggle{
    display:flex;
    align-items:center;
    gap:8px;
    padding:6px;
    border-radius:999px;
    background:rgba(128,128,128,.16);
    border:1px solid rgba(160,160,160,.35);
    backdrop-filter:blur(8px) saturate(1.1);
    -webkit-backdrop-filter:blur(8px) saturate(1.1);
    box-shadow:0 2px 10px rgba(0,0,0,.25);
  }
  .bgtoggle .bgsw{
    -webkit-appearance:none; appearance:none;
    width:24px; height:24px;
    min-width:24px; min-height:24px;
    padding:0;
    border-radius:50%;
    border:1px solid rgba(120,120,120,.55);
    cursor:pointer;
    position:relative;
    display:block;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.10);
    transition:transform .12s ease;
  }
  /* comfortable hit area without growing the visible swatch */
  .bgtoggle .bgsw::after{
    content:"";
    position:absolute;
    inset:-7px;
    border-radius:50%;
  }
  .bgtoggle .bgsw[data-bg="black"]{ background:#0a0a0c; }
  .bgtoggle .bgsw[data-bg="creme"]{ background:#e8e8e2; }
  .bgtoggle .bgsw:hover{ transform:scale(1.06); }
  /* active swatch gets a clear ring (driven by aria-pressed) */
  .bgtoggle .bgsw[aria-pressed="true"]{
    box-shadow:0 0 0 2px rgba(20,20,24,.65), 0 0 0 4px rgba(255,255,255,.9);
  }
  .bgtoggle .bgsw:focus-visible{
    outline:none;
    box-shadow:0 0 0 3px rgba(90,160,255,.95);
  }
  /* CURSOR-REACTIVITY toggle — a small pill matching the bg toggle, sitting to its
     left. Lit (white + glow) when reactivity is ON, dim when OFF. */
  .curtoggle{
    -webkit-appearance:none; appearance:none;
    display:flex; align-items:center; justify-content:center;
    min-height:36px; padding:0 11px;
    border-radius:999px;
    background:rgba(128,128,128,.16);
    border:1px solid rgba(160,160,160,.35);
    backdrop-filter:blur(8px) saturate(1.1); -webkit-backdrop-filter:blur(8px) saturate(1.1);
    box-shadow:0 2px 10px rgba(0,0,0,.25);
    color:rgba(225,225,225,.5);
    cursor:pointer;
    transition:color .12s ease, border-color .12s ease, box-shadow .12s ease;
  }
  .curtoggle svg{ width:17px; height:17px; display:block; }
  .curtoggle:hover{ color:#fff; }
  .curtoggle[aria-pressed="true"]{
    color:#fff;
    border-color:rgba(255,255,255,.6);
    box-shadow:0 0 0 1px rgba(255,255,255,.22), 0 2px 10px rgba(0,0,0,.25), 0 0 9px rgba(255,255,255,.18);
  }
  .curtoggle:focus-visible{ outline:none; box-shadow:0 0 0 3px rgba(90,160,255,.95); }

  /* ============================================================================
     LIGHT MODE — driven entirely by body[data-bg="creme"] (the CREME swatch). The
     top-right BG toggle's applyBg() already stamps document.body.dataset.bg, so
     picking the creme swatch flips the WHOLE PANEL to a clean light/creme theme
     while the stage/art keeps its own behaviour. The BLACK swatch (default,
     data-bg="black") leaves everything below untouched — pure dark theme.
     Approach: re-point the SAME local tokens the dark panel uses (--ink, --neon,
     --tab-outline/--tab-fill, etc.) to a light palette, so every control resolves
     light-on-creme with a dark hairline and a clearly-popping active state. The
     slant clip-path geometry is shared, so the sharp corners + outline survive. */
  body[data-bg="creme"] .topbar{
    /* ONLY the sidebar SURFACE goes light. The control TOKENS are deliberately left
       at their dark values so the buttons/tiles/active-state/knobs keep their normal
       (dark) design — just the panel-surface TEXT below is darkened so it stays
       readable on creme. */
    color:#26262a;
    text-shadow:none;
    background-color:#ecece7;
    background-image:linear-gradient(180deg, #f3f3ee 0%, #e6e6e0 100%);
    border-right:1px solid rgba(20,20,24,.18);
    scrollbar-color:rgba(20,20,24,.34) transparent;   /* dark thin thumb (Firefox) */
  }
  body[data-bg="creme"] .topbar::-webkit-scrollbar-thumb{ background:rgba(20,20,24,.34); }

  /* wordmark + sub: dark, no glow, so they read on the light panel */
  body[data-bg="creme"] h1.wordmark{
    color:#141416;
    text-shadow:none;
  }
  body[data-bg="creme"] .wordmark .blip{
    background:#141416;
    box-shadow:none;
  }
  body[data-bg="creme"] .sub{ color:rgba(60,60,64,.7); }
  body[data-bg="creme"] .desc{ color:rgba(55,55,60,.8); }
  body[data-bg="creme"] .credit{ color:rgba(60,60,64,.6); }
  body[data-bg="creme"] .credit a{ color:#1c1c20; border-color:rgba(20,20,24,.32); }
  body[data-bg="creme"] .credit a:hover{ color:#000; border-color:#000; }

  /* section bays: a faint dark wash + dark hairline on the light panel */
  body[data-bg="creme"] .group{
    background:rgba(20,20,24,.025);
    border:1px solid rgba(20,20,24,.14);
  }
  /* section labels: dark, readable (AA) */
  body[data-bg="creme"] .group > .lab{
    color:#26262a;
    opacity:.92;
  }

  /* NOTE: light mode does NOT touch the tiles/buttons/active-state, knobs, look
     swatches, words input, image thumb, rail handle or focus rings — they keep their
     normal dark design (only the sidebar SURFACE + the text on it changes colour).
     Knob labels still darken so they read on the creme faceplate. */
  body[data-bg="creme"] .knoblabel .knm{ color:rgba(60,60,64,.78); }
  body[data-bg="creme"] .knoblabel .val{ color:#1c1c20; text-shadow:none; }

  /* The footer + corner controls (cursor toggle, bg swatches) float over the STAGE,
     which is ALWAYS dark now — so they keep their dark-mode styling in BOTH sidebar
     themes (no creme override; a dark-on-black footer would have vanished). */

  /* MOBILE light mode: the rail becomes a bottom strip — keep its top hairline dark */
  @media (max-width:680px){
    body[data-bg="creme"] .topbar{ border-top:1px solid rgba(20,20,24,.18); }
  }

  /* record button — active recording state pulses a red dot (on the dark metal tile) */
  .tab.recording{
    color:#ff8a7e;
    --tab-outline:#e0341f;
    --tab-fill:#1c0f0e;
    box-shadow:0 0 9px rgba(224,52,31,.4);
  }
  .tab.recording::before{
    content:"";
    display:inline-block;
    width:7px;height:7px;
    margin-right:6px;
    border-radius:50%;
    background:#c2160a;
    box-shadow:0 0 6px rgba(194,22,10,.7);
    vertical-align:.04em;
    animation:recpulse .9s ease-in-out infinite;
  }
  @keyframes recpulse{50%{opacity:.25}}
  /* clip ready — green "Save to Photos" state (iOS share-sheet save on the next tap) */
  .tab.saveready{
    color:#e0e0e0;
    --tab-outline:#1f9d55;
    --tab-fill:#0f2c1f;
    box-shadow:0 0 9px rgba(31,157,85,.4);
  }
  .tab[aria-disabled="true"], .tab:disabled{
    opacity:.4;
    cursor:not-allowed;
  }

  /* ---- MODE SWITCH — a top-level 3-way segmented toggle that swaps the control
     set. body.mode-generative shows the generative-only controls (ENGINE, LOOKS,
     the SPEED knob, the SHUFFLE action); body.mode-image shows the image-only
     controls (the IMAGE source section + INVERT); body.mode-words shows the WORDS
     controls (the text input + FILL picker, SPEED only when the fill is an engine).
     The shared controls (CHARSET/Ramp, COLOUR, the CELL + CONTRAST knobs, COPY +
     SHARE, EXPORT) live in ALL modes. Visibility is pure display:none so there are
     no dead/blank gaps. Driven by state.mode in syncControls(). ---- */

  /* generative-only — hidden in image + words modes */
  body.mode-image #grp-engine,
  body.mode-words #grp-engine,
  body.mode-image #grp-looks,
  body.mode-words #grp-looks,
  body.mode-image #knob-speed,
  body.mode-image .act-shuffle,
  body.mode-words .act-shuffle{ display:none; }

  /* image-only — hidden when not in image mode */
  body.mode-generative #grp-image,
  body.mode-words #grp-image,
  body.mode-generative #img-invert{ display:none; }
  /* INVERT lives inside the image-loaded block; its row wrapper must also vanish
     in generative mode so no empty .tabs row remains. The whole #grp-image is
     already hidden above, so this is only belt-and-braces for the inner row. */

  /* words-only — the text input + FILL picker, hidden in the other modes */
  #grp-words{ display:none; }
  body.mode-words #grp-words{ display:flex; }

  /* PALETTE picker — only for words mode with the 3D block fill. Hidden in every
     other mode/fill so there's no dead control. body.words-3d is set in
     syncControls() when state.mode==='words' && state.wordFill==='3d'. */
  #grp-wordpal{ display:none; }
  body.words-3d #grp-wordpal{ display:flex; }

  /* In image mode the SPEED knob is gone — the knob row now holds CELL + CONTRAST.
     In words mode SPEED is only meaningful when the fill is an engine; body.words-
     static (solid fill) hides it too. Recentre to 2 columns when one dial is gone
     so the remaining dials sit balanced (no empty third column / lopsided gap). */
  body.mode-image .knobgrid,
  body.mode-words.words-static .knobgrid{ grid-template-columns:repeat(2,minmax(0,1fr)); }
  body.mode-words.words-static #knob-speed{ display:none; }
  /* 3D blocks are also static (no animation) -> drop the SPEED knob too. */
  body.mode-words.words-3d .knobgrid{ grid-template-columns:repeat(2,minmax(0,1fr)); }
  body.mode-words.words-3d #knob-speed{ display:none; }

  /* The ACTIONS group is shared (copy + share stay), but SHUFFLE is generative-
     only. The group's .tabs is a 3-col grid; with shuffle hidden in image/words
     mode the two remaining tiles must fill the row cleanly (no blank third cell). */
  body.mode-image #grp-actions .tabs,
  body.mode-words #grp-actions .tabs{ grid-template-columns:repeat(2,minmax(0,1fr)); }

  /* ---- WORDS text input — a self-contained terminal field styled to the HUD panel:
     a recessed dark slot with neon-green ink + glow, a green hairline border + inset
     shadow so it reads as a lit input line on the datapad. */
  .wordfield{
    appearance:none;
    -webkit-appearance:none;
    font-family:var(--mono);
    font-size:13px;
    letter-spacing:.04em;
    color:#d6d6d6;
    width:100%;
    min-height:38px;
    padding:8px 10px;
    border-radius:3px;
    border:1px solid rgba(255,255,255,.3);
    background-color:#04090b;
    background-image:linear-gradient(180deg, #050b0d 0%, #03080a 100%);
    box-shadow:
      inset 0 0 8px rgba(0,0,0,.7),
      inset 0 0 0 1px rgba(255,255,255,.06);
    text-shadow:0 0 5px rgba(255,255,255,.3);
    caret-color:var(--neon);
  }
  .wordfield::placeholder{ color:rgba(180,180,180,.4); }
  .wordfield:focus-visible{ outline:2px solid var(--neon); outline-offset:2px; box-shadow:inset 0 0 8px rgba(0,0,0,.7), 0 0 10px rgba(255,255,255,.3); }

  /* ---- IMAGE SECTION — two states toggled by body.has-image ---------------
     Default (no image): show .image-empty (the "insert image" button), hide
     .image-loaded. With body.has-image: hide .image-empty, show .image-loaded
     (thumbnail + replace + remove + invert). No dead/blank controls in either
     state. */
  .image-loaded{ display:none; flex-direction:column; gap:6px; }
  body.has-image .image-empty{ display:none; }
  body.has-image .image-loaded{ display:flex; }

  .image-row{
    display:flex;
    align-items:stretch;
    gap:6px;
  }
  .image-thumb-actions{
    display:flex;
    flex-direction:column;
    gap:6px;
    flex:1 1 auto;
    min-width:0;
  }
  .image-thumb-actions .tab{ flex:1 1 auto; }

  /* clickable thumbnail tile — a small metal-framed preview of the loaded
     image. Pressed (aria-pressed="true") when the image render is active. */
  .img-thumb{
    appearance:none;
    -webkit-appearance:none;
    flex:0 0 auto;
    width:62px;height:62px;
    padding:3px;
    border-radius:3px;
    cursor:pointer;
    border:1px solid rgba(255,255,255,.32);
    background-color:#05090b;
    background-image:linear-gradient(180deg, rgba(255,255,255,.06) 0%, rgba(0,0,0,.25) 100%);
    box-shadow:
      inset 0 0 8px rgba(0,0,0,.5),
      0 0 6px rgba(255,255,255,.15);
    transition:transform .07s ease, box-shadow .1s ease, border-color .1s ease;
  }
  .img-thumb img{
    display:block;
    width:100%;height:100%;
    object-fit:cover;
    border-radius:5px;
    image-rendering:auto;
  }
  .img-thumb:hover{
    transform:translateY(-1px);
    border-color:rgba(255,255,255,.6);
    box-shadow:inset 0 0 8px rgba(0,0,0,.5), 0 0 12px rgba(255,255,255,.3);
  }
  .img-thumb:active{ transform:translateY(1px); }
  /* active = image is the current render: bright neon-green ring */
  .img-thumb[aria-pressed="true"]{
    border-color:var(--neon);
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.8),
      0 0 0 2px rgba(255,255,255,.45),
      0 0 14px rgba(255,255,255,.5);
  }
  .img-thumb:focus-visible{ outline:2px solid var(--neon); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){
    .img-thumb{ transition:box-shadow .12s ease, border-color .12s ease; }
    .img-thumb:hover, .img-thumb:active{ transform:none; }
  }

  /* TOAST — self-contained, theme-coloured, fades after ~1.6s */
  .toast{
    position:fixed;
    left:calc(var(--panel-w) + 50%);
    transform:translate(-50%, 12px);
    bottom:34px;
    z-index:6;
    max-width:min(80vw,360px);
    padding:8px 14px;
    font-size:12px;
    letter-spacing:.08em;
    color:var(--ink);
    background:rgba(var(--bg-rgb),.92);
    border:1px solid var(--ink);
    border-radius:3px;
    box-shadow:var(--ctl-glow);
    text-shadow:none;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    pointer-events:none;
    opacity:0;
    transition:opacity .18s ease, transform .18s ease;
  }
  .toast.show{
    opacity:1;
    transform:translate(-50%, 0);
  }
  body.barhidden .toast{ left:50%; }
  @media (max-width:680px){ .toast{ left:50%; } }

  @media (prefers-reduced-motion: reduce){
    .wordmark .blip{animation:none}
    .tab.recording::before{animation:none}
    .toast{transition:none}
    /* no transform/shift transitions when motion is reduced */
    .tab, .btn{transition:box-shadow .12s ease, background-color .12s ease, color .12s ease}
    .tab:hover, .btn:hover{transform:none}
    .tab:active, .btn:active{transform:none}
    .looktile{transition:box-shadow .12s ease, border-color .12s ease, outline-color .12s ease}
    .looktile:hover, .looktile:active, .looktile[aria-pressed="true"]{transform:none}
    .knob-dial{transition:none}
  }

  /* MOBILE — the rail becomes a full-width top strip (a translucent overlay) over
     a full-bleed stage. Groups stay vertical so chips always wrap; nothing can
     overflow horizontally. The strip scrolls internally if tall. */
  @media (max-width:680px){
    /* PHONE: stack vertically — ART on top, CONTROLS scrollable below. */
    :root{ --panel-w:0px; --art-h:48vh; }
    /* art fills the TOP of the screen */
    #art{ left:0; top:0; width:100vw; height:var(--art-h); }
    .vignette, .scanlines{ left:0; right:0; top:0; bottom:auto; height:var(--art-h); }
    /* controls become a scrollable faceplate filling the BOTTOM */
    .topbar{
      left:0; right:0; top:var(--art-h); bottom:0;
      width:100vw; max-width:100vw; height:auto;
      border-right:none;
      border-top:1px solid var(--ink-faint);
      padding:12px 16px 18px;
    }
    .cornerctl{ top:10px; right:10px; }   /* stays over the art (top-right) */
    .controls{ gap:12px; }
    /* flex-wrap the metal tiles + knobs so they adapt to ANY width and never clip */
    .tabs, .tabs.cols2{ display:flex; flex-wrap:wrap; gap:6px; }
    .tabs .tab, .tabs .btn{ flex:1 1 96px; }
    /* keep the primary MODE switch a tidy 3-across row even on phones */
    .modeswitch{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); }
    .modeswitch .tab{ flex:initial; }
    .looksgrid{ grid-template-columns:repeat(auto-fill, minmax(72px, 1fr)); }
    .knobgrid{ display:flex; flex-wrap:wrap; gap:14px 20px; justify-content:flex-start; }
    .knobctl{ flex:0 0 auto; }
  }
</style>
</head>
<body>
<canvas id="art" aria-hidden="true"></canvas>
<div class="vignette"></div>

<!-- STAGE BACKGROUND toggle — top-right. Flips the art canvas background between
     black and a soft creme white. Affects the STAGE only, never the rail. -->
<div class="cornerctl">
  <button class="curtoggle" id="btn-reactive" type="button" aria-pressed="false" aria-label="Toggle cursor reactivity — when on, the art follows/reacts to the cursor" title="Cursor reactive">
    <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M5 2.5L5 18.5L9.3 14.4L12 20.4L14.1 19.5L11.4 13.6L17 13.6Z"/></svg>
  </button>
  <div class="bgtoggle" id="bg-toggle" role="group" aria-label="Sidebar theme (dark / light)">
    <button class="bgsw" id="bg-black" type="button" data-bg="black" title="Dark mode" aria-label="Dark mode (dark sidebar)" aria-pressed="true"></button>
    <button class="bgsw" id="bg-creme" type="button" data-bg="creme" title="Light mode" aria-label="Light mode (light sidebar)" aria-pressed="false"></button>
  </div>
</div>

<header class="topbar">
  <h1 class="wordmark">ASCII<span class="blip" aria-hidden="true"></span></h1>
  <span class="sub">everything is characters</span>
  <p class="desc">Generative ASCII art, photos &amp; text. Copy as text, export, or share.</p>
  <p class="credit">made by <a href="https://themasterofnone.xyz" target="_blank" rel="noopener noreferrer">themasterofnone</a></p>

  <div class="controls" role="group" aria-label="Instrument controls">
    <!-- MODE SWITCH — top-level 3-way segmented toggle that swaps the whole control
         set. Generative = donut/matrix/plasma engines + looks + speed + shuffle.
         Image = the image source + invert. Words = type text -> ASCII, optionally
         filled by a live engine. Driven by body.mode-generative / body.mode-image /
         body.mode-words (set in syncControls from state.mode) so each mode shows
         only its own controls; the shared controls (charset/colour/cell/contrast/
         copy/share/export) live in all three. -->
    <div class="group">
      <span class="lab" id="lab-mode">Mode</span>
      <div class="tabs modeswitch" id="seg-mode" role="group" aria-labelledby="lab-mode">
        <button class="tab" id="mode-gen" data-mode="generative" type="button" aria-pressed="true" aria-label="Generative mode — donut, matrix, plasma engines">
          <svg class="mico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.5l1.75 5.95 5.95 1.75-5.95 1.75L12 17.9l-1.75-5.95L4.3 10.2l5.95-1.75z"/><path fill="currentColor" opacity=".6" d="M18.8 3.1l.62 2.08 2.08.62-2.08.62-.62 2.08-.62-2.08-2.08-.62 2.08-.62z"/></svg>
          <span>Generative</span>
        </button>
        <button class="tab" id="mode-img" data-mode="image" type="button" aria-pressed="false" aria-label="Image mode — convert a loaded image to ASCII">
          <svg class="mico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="8.5" cy="10" r="1.7"/><path d="M21 16.5l-5-4-4.5 4.5L9 14.5l-6 4.5"/></svg>
          <span>Image</span>
        </button>
        <button class="tab" id="mode-words" data-mode="words" type="button" aria-pressed="false" aria-label="Words mode — type text rendered as ASCII">
